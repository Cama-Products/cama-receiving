      <tr><td></td><td>Lines add up to</td><td class="num">${fmtQty(qtyTotal)}</td><td></td><td class="num">${money(sum)}</td><td colspan="2">${unpriced ? `<span class="muted">${plural(unpriced, 'line')} with no price</span>` : ''}</td></tr>
      ${adj ? `<tr class="tot-sub"><td></td><td>${adj.amount < 0 ? 'Less' : 'Plus'} ${esc(adj.label)}</td><td></td><td></td><td class="num">${money(adj.amount)}</td><td colspan="2"></td></tr>` : ''}
      <tr><td></td><td>Invoice total (printed on the invoice)</td><td></td><td></td><td class="num">${printed === null || printed === undefined || printed === '' ? '&mdash;' : money(printed)}</td><td colspan="2"></td></tr>
      <tr class="tot-verdict"><td></td><td colspan="6">${verdict}</td></tr>
      ${adjustRowHtml(inv, adj, printed, expected, money)}
    </tfoot>`
  }
  // A discount, freight, tax or other charge that is on the invoice's total but not among its lines. The readers pick these up when they
  // can; this is for when one is missed. It shows when there is one already, or the lines don't add up to the printed total.
  function adjustRowHtml(inv, adj, printed, expected, money) {
    const hasPrinted = !(printed === null || printed === undefined || printed === '')
    const diff = hasPrinted ? Math.round((+printed - expected) * 100) / 100 : null
    const mismatch = hasPrinted && Math.abs(diff) > 0.015
    if (!adj && hasPrinted && !mismatch) return ''
    const kind = !adj ? 'discount' : adj.amount < 0 ? 'discount' : /freight/i.test(adj.label) ? 'freight' : /tax/i.test(adj.label) ? 'tax' : 'charge'
    const opt = (v, t) => `<option value="${v}" ${kind === v ? 'selected' : ''}>${t}</option>`
    const newTotal = adj ? adj.amount + diff : diff
    return `<tr class="tot-adjust" data-inv="${esc(invKey(inv))}"><td></td><td colspan="6">
      <div class="adjust-box">
        <span class="adjust-title">Discount or charge that is on the invoice total but not in its lines</span>
        <span class="adjust-form">
          <select data-adj="kind" aria-label="Kind of amount">${opt('discount', 'Discount (taken off)')}${opt('freight', 'Freight (added)')}${opt('tax', 'Sales tax (added)')}${opt('charge', 'Other charge (added)')}</select>
          <input type="number" min="0" step="any" data-adj="amount" value="${adj ? esc(Math.abs(adj.amount).toFixed(2)) : ''}" placeholder="Amount" aria-label="Amount">
          <button class="btn" type="button" data-act="save-adjust">${adj ? 'Save' : 'Add'}</button>
          ${adj ? '<button class="link-btn danger" type="button" data-act="remove-adjust">Remove</button>' : ''}
          ${mismatch ? `<button class="btn ghost" type="button" data-act="adjust-diff" data-amount="${newTotal}">Use the difference (${esc(money(Math.abs(diff)))} ${diff < 0 ? 'discount' : 'charge'})</button>` : ''}
        </span>
      </div></td></tr>`
  }
  function editRowHtml(r) {
    const { inv, ln, idx, db } = r
    const manual = isManual(r), needs = needsCode(r)
    const changed = isChanged(r)
    const check = toCheck(r)
    const tag = [check ? 'check' : '', needs ? 'needs' : '', manual ? 'manual' : '', changed ? 'changed' : ''].filter(Boolean).join(' ')
    const codeEdited = !!ln.orig_code && ln.orig_code !== ln.code
    const qtyEdited = qtyChanged(ln), priceEdited = priceChanged(ln), totalEdited = totalChanged(ln)
    const fmt2 = n => (+n).toLocaleString('en-NZ', { minimumFractionDigits: 2, maximumFractionDigits: 2 })
    const fmtP = n => (+n).toLocaleString('en-NZ', { minimumFractionDigits: 2, maximumFractionDigits: 4 })
    let matched
    if (!db && +ln.qty === 0 && !ln.is_freight) matched = '<span class="check-flag" style="color:var(--slate)">Back order</span><span class="sub" style="display:block;color:var(--slate-dim);font-size:12px">Not counted. Still on order.</span>'
    else if (!db) matched = '<span class="muted">—</span>'
    else if (db.status === 'not_on_po') matched = manual
      ? `<strong>${esc(db.stock_code)}</strong><span class="flag" style="color:var(--warn)">Not on a loaded PO</span>`
      : '<span class="flag" style="display:inline">Not on any loaded PO</span>' + elsewhereHint(r)
    else if (ln.is_freight && !(db.pos || []).length) matched = `<strong>${esc(db.stock_code)}</strong><span class="sub" style="display:block;color:var(--navy);font-size:12px;font-weight:600">Freight charge</span>`
    else matched = (db.status === 'over' ? `<span class="check-flag">${esc(overText(r))}</span>` : '') + `<strong>${esc(db.stock_code)}</strong><span class="sub" style="display:block;color:var(--slate-dim);font-size:12px">PO ${esc((db.pos || []).map(p => p[0]).join(', '))}${db.bin ? ' · ' + esc(db.bin) : ''}</span>`
    return `<tr class="${needs ? 'not_on_po' : ''} ${check ? 'to-check' : ''}" data-inv="${esc(invKey(inv))}" data-idx="${idx}" data-tags="${tag}">
      <td class="partno"><input type="text" maxlength="40" value="${esc(ln.code)}" aria-label="Part number" autocomplete="off">
        ${ln.added ? `<span class="sub"><span class="edit-tag">Added</span><button class="link-btn danger" data-act="remove-added">Remove</button></span>`
          : codeEdited || qtyEdited || priceEdited || totalEdited ? `<span class="sub"><span class="edit-tag">Edited</span><button class="link-btn" data-act="reset-line">Reset</button></span>` : ''}
        ${codeEdited ? `<span class="sub">invoice said ${esc(ln.orig_code)}</span>` : ''}</td>
      <td>${esc(ln.desc)}</td>
      <td class="qtycell num"><input type="number" inputmode="decimal" step="any" min="0" value="${esc(ln.qty)}" aria-label="Quantity for ${esc(ln.code)}">
        ${qtyEdited ? `<span class="sub">invoice said ${fmtQty(ln.orig_qty)}</span>` : ''}</td>
      <td class="pricecell num"><input type="number" inputmode="decimal" step="any" min="0" value="${ln.price == null || ln.price === '' ? '' : esc(ln.price)}" placeholder="—" aria-label="Invoice price for ${esc(ln.code)}">
        ${priceEdited ? `<span class="sub">invoice said ${ln.orig_price == null ? 'no price' : fmtP(ln.orig_price)}</span>` : ''}</td>
      <td class="totalcell num"><input type="number" inputmode="decimal" step="any" min="0" value="${lineAmount(ln) == null ? '' : esc(fmt2(lineAmount(ln)).replace(/,/g, ''))}" placeholder="—" aria-label="Line total for ${esc(ln.code)}">
        ${totalEdited ? `<span class="sub">invoice said ${ln.orig_total == null ? 'no total' : fmt2(ln.orig_total)}</span>` : ''}</td>
      <td>${matched}</td>
      <td class="ourcode"><input type="text" maxlength="40" value="${manual ? esc(ln.our_code) : ''}" placeholder="Our code" aria-label="Our code for ${esc(ln.code)}" autocomplete="off">
        ${ln.is_freight ? `<span class="manual-tag freight">Freight ${esc(moneyText(inv.currency, ln.freight_amount ?? 0))}</span> <button class="link-btn" data-act="edit-freight">Edit amount</button> <button class="link-btn" data-act="clear-code">Clear</button>`
          : manual ? `<span class="manual-tag">Manual</span> <button class="link-btn" data-act="clear-code">Clear</button>` : ''}</td>
    </tr>`
  }

  function applyEditFilter() {
    const f = editFilter
    let shown = 0
    content.querySelectorAll('#editBody .inv-card').forEach(card => {
      let any = false
      card.querySelectorAll('tbody tr').forEach(tr => {
        const show = f === 'all' || tr.dataset.tags.split(' ').includes(f)
        tr.hidden = !show; if (show) { any = true; shown++ }
      })
      const tw = card.querySelector('.table-wrap'); if (tw) tw.hidden = !any   // the card stays so you can still add a line
    })
    const empty = $('editEmpty'); if (!empty) return
    empty.hidden = shown > 0 || !(editState.shipment.invoices || []).length
    empty.textContent = f === 'check' ? 'Nothing to check: every line is on a PO and none is for more than is on order.' : f === 'needs' ? 'Every line is matched to a PO line. Nothing needs a code.' : f === 'manual' ? 'No codes have been entered manually in this shipment.' : f === 'changed' ? 'No quantity or part number has been changed, and no line added, in this shipment.' : ''
  }

  // ---- find the unmatched lines on OTHER open POs (the invoice names one PO, but lines are sometimes on another) ----
  const rowKey = r => `${invKey(r.inv)}|${r.idx}`
  function elsewhereHint(r) {
    const f = editState.elsewhere && editState.elsewhere.found.get(rowKey(r))
    if (!f) return ''
    if (!f.length) return '<span class="sub" style="display:block;font-size:12px;color:var(--slate)">Not on any other open PO in MYOB either</span>'
    const held = editState.elsewhere.held
    const same = f.filter(h => h.same).sort((x, y) => (held.has(y.po) ? 1 : 0) - (held.has(x.po) ? 1 : 0)), use = same.length ? same : f
    const heldHit = same.find(h => held.has(h.po))
    const stale = heldHit ? ` · PO ${heldHit.po} is newer than this shipment's saved copy of it: reload it` : ''
    return `<span class="sub" style="display:block;font-size:12px;color:var(--navy);font-weight:600">On PO ${esc([...new Set(use.map(h => h.po))].join(', '))}${same.length ? '' : ' (a different supplier)'}: ${esc(use[0].stock_code)} (${fmtQty(use[0].qty)} outstanding)${esc(stale)}</span>`
  }
  function elsewhereHtml() {
    const e = editState.elsewhere
    if (!e) return ''
    const byPo = new Map(); let none = []
    for (const r of editRows().filter(needsCode)) {
      const hits = e.found.get(rowKey(r)) || []
      if (!hits.length) { none.push(r.ln.code); continue }
      for (const po of new Set(hits.map(h => h.po))) { const h0 = hits.find(h => h.po === po); if (!byPo.has(po)) byPo.set(po, { supplier: h0.supplier, same: !!h0.same, codes: [] }); byPo.get(po).codes.push(r.ln.code) }
    }
    const list = c => esc([...new Set(c)].slice(0, 12).join(', ')) + ([...new Set(c)].length > 12 ? ` and ${[...new Set(c)].length - 12} more` : '')
    return `<div style="margin-top:10px;padding-top:8px;border-top:1px solid rgba(0,0,0,0.12)">
      <div><strong>Searched ${fmtQty(e.total)} open PO lines in the MYOB sync:</strong></div>
      ${[...byPo].sort((x, y) => (y[1].same ? 1 : 0) - (x[1].same ? 1 : 0)).map(([po, v]) => v.same
        ? (e.held.has(po)
          ? `<div style="margin-top:4px">Found on <strong>PO ${esc(po)}</strong>${v.supplier ? ' (' + esc(v.supplier) + ')' : ''}: ${list(v.codes)}. This shipment holds an <strong>older copy</strong> of that PO without ${v.codes.length === 1 ? 'this line' : 'these lines'}; the latest MYOB sync has ${v.codes.length === 1 ? 'it' : 'them'}. <button class="btn" type="button" data-addpo="${esc(po)}" style="margin-left:6px;padding:5px 10px;font-size:12px">Reload PO ${esc(po)} from MYOB</button></div>`
          : `<div style="margin-top:4px">Found on <strong>PO ${esc(po)}</strong>${v.supplier ? ' (' + esc(v.supplier) + ')' : ''}: ${list(v.codes)}. <button class="btn" type="button" data-addpo="${esc(po)}" style="margin-left:6px;padding:5px 10px;font-size:12px">Add PO ${esc(po)} to this shipment</button></div>`)
        : `<div style="margin-top:4px;color:var(--slate)">Also a part with the same number on PO ${esc(po)}${v.supplier ? ' (' + esc(v.supplier) + ')' : ''}, a different supplier: ${list(v.codes)}. Not offered.</div>`).join('')}
      ${none.length ? `<div style="margin-top:4px">Not on any open PO: ${list(none)}. The PO line may be fully received or closed in MYOB, or may carry a different supplier part number (check with Refresh, or type the stock code in Our code).</div>` : ''}
    </div>`
  }
  async function findElsewhere() {
    if (editBusy) return
    const btn = $('elsewhereBtn'); if (btn) { btn.disabled = true; btn.textContent = 'Looking…' }
    try {
      const all = []
      for (let from = 0; ; from += 1000) {
        const { data, error } = await supabase.from('myob_po_lines').select('line_id, po, stock_code, supplier_code, qty, supplier').order('line_id').range(from, from + 999)
        if (error) throw new Error(error.message)
        all.push(...data); if (data.length < 1000) break
      }
      const held = new Set((editState.shipment.po_lines || []).map(l => String(l.line_id)).filter(Boolean))
      const index = new Map()
      for (const r of all) {
        if (held.has(String(r.line_id))) continue   // a line the shipment already holds would have matched
        for (const k of new Set([normCode(r.stock_code), normCode(r.supplier_code)])) { if (k) { if (!index.has(k)) index.set(k, []); index.get(k).push(r) } }
      }
      const words = (editState.shipment.suppliers || []).map(s => String(s).split(/[\s,.\-]+/)[0].toLowerCase()).filter(w => w.length > 2)
      for (const r of all) r.same = words.some(w => String(r.supplier || '').toLowerCase().includes(w))
      const found = new Map()
      for (const r of editRows().filter(needsCode)) {
        const hits = []
        for (const k of [r.ln.code, r.ln.our_code, ...(r.ln.alt_codes || [])].map(normCode).filter(Boolean)) for (const h of index.get(k) || []) if (!hits.includes(h)) hits.push(h)
        found.set(rowKey(r), hits)
      }
      editState.elsewhere = { found, total: all.length, held: new Set((editState.shipment.po_lines || []).map(l => l.po)) }
      editMsg = null
    } catch (e) {
      editMsg = { cls: 'err', html: `Couldn't search: ${esc(friendlyDbError(e))}` }
    }
    renderEdit()
  }
  // Add another PO's lines (from the MYOB sync) to this shipment and match again. Edits made here and counts are kept.
  function addPoToShipment(po) {
    const holds = (editState.shipment.po_lines || []).some(l => l.po === po)
    if (!confirm(holds
      ? `Reload PO ${po} from MYOB?\n\nThe shipment holds an older copy of it. The latest MYOB sync is loaded and the invoices are matched again. Edits and counts are kept.\n\nDon't do this after the goods receipt has been entered in MYOB.`
      : `Add PO ${po} to this shipment?\n\nIts PO lines are loaded from the latest MYOB sync and the invoices are matched again. Lines are matched to the PO named on the invoice first, then to PO ${po}.`)) return
    return runEdit(async ship => {
      const found = await loadMyobPOs([po])
      if (!found.length) throw new Error(`PO ${po} isn't in the MYOB sync.`)
      const { data: st } = await supabase.from('myob_sync').select('last_ok').eq('id', 1).maybeSingle()
      const had = ship.po_lines.some(l => l.po === po)
      ship.po_lines = ship.po_lines.filter(l => l.po !== po).concat(found)
      ship.files = (had ? (ship.files || []).filter(f => !(f.kind === 'myob' && new RegExp('^PO ' + po + '\\b').test(f.summary))) : (ship.files || []))
        .concat([{ name: 'MYOB', path: '', kind: 'myob', summary: `PO ${po} from MYOB, ${plural(found.length, 'line')}${st?.last_ok ? ` (MYOB data from ${fmtTime(st.last_ok)})` : ''}${had ? '' : ', added in Shipment Edit'}` }])
      return { cls: 'ok', html: had
        ? `Reloaded <strong>PO ${esc(po)}</strong> from MYOB (${plural(found.length, 'line')}) and matched again.`
        : `Added <strong>PO ${esc(po)}</strong> (${plural(found.length, 'line')}) to this shipment and matched again.` }
    })
  }

  // "PO 32265: 141 lines, PO 31000: 12 lines (MYOB data from 19 Oct, 8:57 pm)": what the shipment was matched against
  function poLoadedText(sh) {
    const by = new Map()
    for (const l of sh.po_lines || []) by.set(l.po, (by.get(l.po) || 0) + 1)
    const lines = [...by].map(([po, n]) => `PO ${po} has ${plural(n, 'line')}`)
    const wanted = poNumbersOn(sh.invoices || []).filter(n => !by.has(n))
    const when = ((sh.files || []).find(f => f.kind === 'myob')?.summary.match(/\(MYOB data from [^)]*\)/) || [''])[0]
    return [lines.join(', ') || 'no PO lines', wanted.length ? `no lines for PO ${wanted.join(', ')}` : ''].filter(Boolean).join('; ') + (when ? ' ' + when : '') + '.'
  }
  async function editRefreshPo() {
    if (editBusy) return
    if (!confirm("Reload this shipment's PO lines from MYOB?\n\nUse this if the PO has changed in MYOB since the invoice was added. The invoices are matched again, edits made here are kept, and so are counts.\n\nDon't use it after the goods receipt has been entered in MYOB: received lines drop off the PO there, so they would stop matching.")) return
    editBusy = true
    $('editBody')?.classList.add('busy')
    const id = editState.shipment.id
    try { editMsg = { cls: 'ok', html: await refreshPoLines(id) } } catch (e) { editMsg = { cls: 'err', html: `Couldn't refresh: ${esc(friendlyDbError(e))}` } }
    shipOptionsCache.at = 0
    try { await loadEdit(id); editBusy = false; renderEdit() } catch (e) { editBusy = false; content.innerHTML = `<div class="notice err">${esc(friendlyDbError(e))}</div>` }
  }

  // One edit to a shipment's invoice lines: change the saved invoice, match the whole shipment again, reload this tab.
  // mutate(ship) changes ship.invoices and returns {cls, html}, or null if nothing changed. It may throw for bad input.
  // Set (or remove, with null) the discount or charge that is on an invoice's total but not in its lines
  function setAdjust(key, adj) {
    return runEdit(ship => {
      const inv = ship.invoices.find(i => invKey(i) === key)
      if (!inv) throw new Error('That invoice is no longer in the shipment.')
      inv.notes = (inv.notes || []).filter(n => !/entered in Shipment Edit/.test(n))
      if (!adj || !adj.amount) { delete inv.adjust; return { cls: 'ok', html: `The amount outside the lines was removed from invoice <strong>${esc(inv.invoice_no)}</strong>.` } }
      const amount = Math.round(adj.amount * 100) / 100
      inv.adjust = { amount, label: adj.label, manual: true }
      inv.notes.push(`${adj.label[0].toUpperCase()}${adj.label.slice(1)} of ${Math.abs(amount).toFixed(2)} was entered in Shipment Edit.`)
      return { cls: 'ok', html: `${esc(adj.label[0].toUpperCase() + adj.label.slice(1))} of <strong>${esc(Math.abs(amount).toFixed(2))}</strong> ${amount < 0 ? 'taken off' : 'added to'} invoice <strong>${esc(inv.invoice_no)}</strong>.` }
    })
  }
  async function runEdit(mutate) {
    if (editBusy) return
    editBusy = true
    $('editBody')?.classList.add('busy')
    const id = editState.shipment.id
    try {
      const ship = await getFullShipment(id)
      const msg = await mutate(ship)
      if (msg) { await syncShipment(ship); editMsg = msg }
    } catch (e) {
      editMsg = { cls: 'err', html: `Couldn't save: ${esc(friendlyDbError(e))}` }
    }
    shipOptionsCache.at = 0
    try { await loadEdit(id); editBusy = false; renderEdit() } catch (e) { editBusy = false; content.innerHTML = `<div class="notice err">${esc(friendlyDbError(e))}</div>` }
  }
  const lineIn = (ship, key, idx) => {
    const inv = ship.invoices.find(i => invKey(i) === key)
    const ln = inv && inv.lines[idx]
    if (!ln || ln.removed) throw new Error('That line is no longer on the invoice.')
    return { inv, ln }
  }
  const retotal = ln => { if (ln.price != null && ln.price !== '') ln.total = Math.round(ln.qty * ln.price * 100) / 100 }
  // The first change to a line keeps what the invoice said (quantity, price and line total) so it can be shown and reset.
  const capture = ln => { if (!ln.added && ln.orig_qty === undefined) { ln.orig_qty = ln.qty; ln.orig_price = ln.price ?? null; ln.orig_total = ln.total ?? null } }
  // The line total follows quantity x price, unless it was typed in. Back at the invoice's own quantity and price it is the invoice's printed total again.
  const settle = ln => {
    if (ln.total_manual) return
    if (!ln.added && ln.orig_qty !== undefined && +ln.qty === +ln.orig_qty && (ln.price ?? null) === ln.orig_price && ln.orig_total !== null) ln.total = ln.orig_total
    else retotal(ln)
  }
  const uncapture = ln => {
    if (ln.added || ln.orig_qty === undefined) return
    if (+ln.qty === +ln.orig_qty && (ln.price ?? null) === ln.orig_price && (ln.total ?? null) === ln.orig_total) { delete ln.orig_qty; delete ln.orig_price; delete ln.orig_total; delete ln.total_manual }
  }

  function changeQuantity(key, idx, raw) {
    return runEdit(ship => {
      const { ln } = lineIn(ship, key, idx)
      const n = parseFloat(raw)
      if (!Number.isFinite(n) || n <= 0) throw new Error('The quantity must be a number greater than 0.')
      if (n === +ln.qty) return null
      const before = ln.qty
      capture(ln)
      ln.qty = n; settle(ln); uncapture(ln)
      return { cls: 'ok', html: `Quantity for <strong>${esc(ln.code)}</strong> changed from ${fmtQty(before)} to <strong>${fmtQty(n)}</strong>.` }
    })
  }
  function changePartNumber(key, idx, raw) {
    return runEdit(ship => {
      const { ln } = lineIn(ship, key, idx)
      const v = raw.trim()
      if (!v) throw new Error('Enter a part number.')
      if (v === ln.code) return null
      const before = ln.code
      if (!ln.added && !ln.orig_code) ln.orig_code = ln.code
      ln.code = v
      if (!ln.added && ln.orig_code === v) delete ln.orig_code
      return { cls: 'ok', html: `Part number <strong>${esc(before)}</strong> changed to <strong>${esc(v)}</strong>.` }
    })
  }
  function changePrice(key, idx, raw) {
    return runEdit(ship => {
      const { ln } = lineIn(ship, key, idx)
      const n = parseFloat(raw)
      if (!Number.isFinite(n) || n < 0) throw new Error('The price must be a number, 0 or more.')
      if (n === Number(ln.price)) return null
      const before = ln.price
      capture(ln)
      ln.price = n; ln.total_manual = false; settle(ln); uncapture(ln)
      return { cls: 'ok', html: `Price for <strong>${esc(ln.code)}</strong> changed from ${before == null ? 'no price' : esc(before)} to <strong>${esc(n)}</strong>. The line total is now ${esc((+lineAmount(ln)).toLocaleString('en-NZ', { minimumFractionDigits: 2, maximumFractionDigits: 2 }))}.` }
    })
  }
  function changeTotal(key, idx, raw) {
    return runEdit(ship => {
      const { ln } = lineIn(ship, key, idx)
      const n = Math.round(parseFloat(raw) * 100) / 100
      if (!Number.isFinite(n) || n < 0) throw new Error('The line total must be a number, 0 or more.')
      if (n === lineAmount(ln)) return null
      const before = lineAmount(ln)
      capture(ln)
      ln.total = n; ln.total_manual = true; uncapture(ln)
      return { cls: 'ok', html: `Line total for <strong>${esc(ln.code)}</strong> changed from ${before == null ? 'none' : esc(before.toFixed(2))} to <strong>${esc(n.toFixed(2))}</strong>.` }
    })
  }
  function resetLine(key, idx) {
    return runEdit(ship => {
      const { ln } = lineIn(ship, key, idx)
      if (ln.orig_code) ln.code = ln.orig_code
      if (ln.orig_qty !== undefined) {
        ln.qty = ln.orig_qty
        if (ln.orig_price !== undefined) ln.price = ln.orig_price
        if (ln.orig_total !== undefined && ln.orig_total !== null) ln.total = ln.orig_total; else retotal(ln)
      }
      delete ln.orig_code; delete ln.orig_qty; delete ln.orig_price; delete ln.orig_total; delete ln.total_manual
      return { cls: 'ok', html: `<strong>${esc(ln.code)}</strong> is back to what the invoice said.` }
    })
  }
  async function addInvoiceLine(key) {
    const inv = editState.shipment.invoices.find(i => invKey(i) === key); if (!inv) return
    const data = await askNewLine({ invoiceNo: inv.invoice_no, currency: inv.currency })
    if (!data) return
    let freightAmount = null
    if (data.ourCode && looksLikeFreight(data.ourCode)) {
      freightAmount = await askFreightAmount({ code: data.code, invoiceNo: inv.invoice_no, currency: inv.currency, suggested: data.price != null ? Math.round(data.qty * data.price * 100) / 100 : '' })
      if (freightAmount === null) return
    }
    return runEdit(ship => {
      const target = ship.invoices.find(i => invKey(i) === key)
      if (!target) throw new Error('That invoice is no longer in the shipment.')
      const ln = { code: data.code, our_code: data.ourCode || '', alt_codes: [], desc: data.desc, qty: data.qty, price: data.price, total: data.price != null ? Math.round(data.qty * data.price * 100) / 100 : null, po: '', added: true }
      if (data.ourCode) { ln.manual_code = true; ln.orig_our_code = '' }
      if (freightAmount !== null) { ln.is_freight = true; ln.freight_amount = freightAmount }
      target.lines.push(ln)
      return { cls: 'ok', html: `Added <strong>${esc(data.code)}</strong> × ${fmtQty(data.qty)} to invoice ${esc(target.invoice_no)}.` }
    })
  }
  function removeAddedLine(key, idx) {
    if (!confirm('Remove this added line?')) return
    return runEdit(ship => {
      const { ln } = lineIn(ship, key, idx)
      if (!ln.added) throw new Error('Only a line you added can be removed. Use Reset to undo an edit.')
      ln.removed = true   // kept in place (not deleted) so the other lines keep their line numbers and counts
      return { cls: 'ok', html: `Removed the added line <strong>${esc(ln.code)}</strong>.` }
    })
  }

  async function saveOurCode(key, idx, raw, freight = null) {
    if (editBusy) return
    editBusy = true
    $('editBody')?.classList.add('busy')
    const id = editState.shipment.id
    try {
      const code = raw.trim()
      const ship = await getFullShipment(id)
      const inv = ship.invoices.find(i => invKey(i) === key)
      const ln = inv && inv.lines[idx]
      if (!ln) throw new Error('That line is no longer on the invoice.')
      let kind
      const unbusy = () => { editBusy = false; $('editBody')?.classList.remove('busy') }
      if (code) {
        const sameFreight = freight ? (ln.is_freight && +ln.freight_amount === freight.amount) : !ln.is_freight
        if (ln.manual_code && ln.our_code === code && sameFreight) { unbusy(); return }
        if (!ln.manual_code) ln.orig_our_code = ln.our_code || ''
        ln.our_code = code; ln.manual_code = true; kind = 'set'
        if (freight) { ln.is_freight = true; ln.freight_amount = freight.amount } else { delete ln.is_freight; delete ln.freight_amount }
      } else if (ln.manual_code) {
        ln.our_code = ln.orig_our_code || ''; delete ln.manual_code; delete ln.orig_our_code; delete ln.is_freight; delete ln.freight_amount; kind = 'clear'
      } else { unbusy(); return }
      const r = await syncShipment(ship)
      const row = r.result.rows.find(x => x.supplier === inv.supplier && x.invoice_no === inv.invoice_no && x.line_no === idx + 1)
      if (kind === 'clear') editMsg = { cls: 'ok', html: `Cleared the manual code on <strong>${esc(ln.code)}</strong>.` }
      else if (freight) editMsg = { cls: 'ok', html: `<strong>${esc(ln.code)}</strong> is coded as freight: <strong>${esc(moneyText(inv.currency, freight.amount))}</strong>. It shows in blue in Shipment Reconciliation and isn't counted.` }
      else if (row && row.status !== 'not_on_po') editMsg = { cls: 'ok', html: `<strong>${esc(ln.code)}</strong> is now matched to <strong>${esc(row.stock_code)}</strong> on PO ${esc(row.pos.map(p => p[0]).join(', '))}.` }
      else editMsg = { cls: 'warn', html: `Saved <strong>${esc(code)}</strong> against <strong>${esc(ln.code)}</strong>. It isn't on a loaded PO, so it stays under PO exceptions and is counted under this code.` }
    } catch (e) {
      editMsg = { cls: 'err', html: `Couldn't save: ${esc(friendlyDbError(e))}` }
    }
    shipOptionsCache.at = 0
    try { await loadEdit(id); editBusy = false; renderEdit() } catch (e) { editBusy = false; content.innerHTML = `<div class="notice err">${esc(friendlyDbError(e))}</div>` }
  }

  // ============================================================
  // TAB 3: PURCHASING INFORMATION
  // For a shipment: every item still outstanding on the POs its invoices belong to, after this shipment's
  // invoices are taken off. Uses the PO lines saved with the shipment (MYOB as at the time it was matched).
  // ============================================================
  const fmtDate = iso => (iso ? new Date(iso + 'T00:00:00').toLocaleDateString('en-NZ', { day: 'numeric', month: 'short', year: 'numeric' }) : '')

  async function showPurchasingList() {
    renderSidebar('purchasing')
    setTop('Purchasing Information', 'Choose a shipment to see what is still outstanding on its POs')
    content.innerHTML = `<div class="empty-state">Loading shipments…</div>`
    try {
      const data = await loadShipmentCards()
      shipOptionsCache = { at: Date.now(), rows: data }
      if (!data.length) { content.innerHTML = `<div class="empty-state">No shipments yet. <a href="#/invoices">Add invoices in Invoice Creation</a>.</div>`; return }
      const group = (title, list, open = true) => !list.length ? '' : open
        ? `<div class="group-title">${title}<span class="count">${list.length}</span></div>${list.map(s => listCardHtml(s, 'purchasing')).join('')}`
        : `<details class="received-ships"><summary>${title} (${list.length})</summary>${list.map(s => listCardHtml(s, 'purchasing')).join('')}</details>`
      content.innerHTML = group('Open shipments', data.filter(s => s.status === 'open'))
        + group('Counted', data.filter(s => s.status === 'counted'))
        + group('Completed', data.filter(s => s.status === 'received'), false)
      wireCardClicks()
    } catch (e) { content.innerHTML = `<div class="notice err">${esc(friendlyDbError(e))}</div>` }
  }

  let purch = null   // {shipment, rows}
  async function showPurchasing(id) {
    rememberShipment(id)
    renderSidebar('purchasing')
    setTop('Loading…')
    content.innerHTML = `<div class="empty-state">Loading shipment…</div>`
    try {
      const [sh] = await Promise.all([getFullShipment(id), shipmentOptions()])
      if (!shipOptionsCache.rows.some(r => r.id === id)) shipOptionsCache.rows.unshift(sh)
      const rows = (sh.still_open || []).map(p => ({ ...p, onShipment: Math.max(0, (+p.qty || 0) - (+p.outstanding || 0)) }))
        .sort((x, y) => String(x.po).localeCompare(String(y.po)) || compareOurCode(x.stock_code, y.stock_code, x.supplier_code, y.supplier_code))
      purch = { shipment: sh, rows }
      renderPurchasing()
    } catch (e) { setTop('Purchasing Information'); content.innerHTML = `<div class="notice err">${esc(friendlyDbError(e))}</div>` }
  }

  function renderPurchasing() {
    const { shipment: sh, rows } = purch
    const valueText = list => {
      const by = new Map()
      for (const r of list) by.set(r.currency || '', (by.get(r.currency || '') || 0) + (+r.outstanding || 0) * (+r.price || 0))
      return [...by].map(([c, n]) => moneyText(c, n)).join(' + ') || '—'
    }
    const pos = [...new Set([...(sh.pos || []), ...rows.map(r => r.po)])].sort()
    const notFound = (sh.problems || []).filter(p => p.name === 'MYOB')
    setTop(shipName(sh), `Purchasing Information · ${plural(pos.length, 'PO')}`,
      `${pickerHtml(sh.id)}
       <button class="btn" id="dlBtn" ${rows.length ? '' : 'disabled'}>Download outstanding list</button>
       <button class="btn ghost" id="printBtn">Print</button>`)
    wirePicker('purchasing')

    const card = po => {
      const rs = rows.filter(r => r.po === po)
      const head = rs[0] || (sh.po_lines || []).find(l => l.po === po) || {}
      const pcs = rs.reduce((s, r) => s + (+r.outstanding || 0), 0)
      const meta = [head.supplier ? esc(head.supplier) : '', head.order_date ? `ordered ${esc(fmtDate(head.order_date))}` : '',
        rs.length ? `${plural(rs.length, 'line')} · ${fmtQty(pcs)} pcs · ${esc(valueText(rs))}` : 'Nothing outstanding: this shipment covers everything left on the PO'].filter(Boolean).join(' · ')
      return `<details class="inv-card" open data-po="${esc(po)}">
        <summary><div><div class="inv-title">PO ${esc(po)}</div><div class="inv-sub">${meta}</div></div></summary>
        ${rs.length ? `<div class="table-wrap"><table class="grid">
          <thead><tr><th>Stock code</th><th>Description</th><th>Due</th><th class="num">PO qty</th><th class="num">On this shipment</th><th class="num">Outstanding</th><th class="num hide-sm">Unit price</th><th class="num hide-sm">Value</th></tr></thead>
          <tbody>${rs.map(r => {
            const sub = r.supplier_code && normCode(r.supplier_code) !== normCode(r.stock_code) ? `<span class="sub">${esc(r.supplier_code)}</span>` : ''
            return `<tr data-q="${esc((r.stock_code + ' ' + r.supplier_code + ' ' + r.desc).toLowerCase())}">
              <td class="code">${esc(r.stock_code)}${sub}</td><td>${esc(r.desc)}</td><td>${esc(fmtDate(r.due_date))}</td>
              <td class="num">${fmtQty(r.qty)}</td><td class="num">${r.onShipment ? fmtQty(r.onShipment) : '—'}</td><td class="num"><strong>${fmtQty(r.outstanding)}</strong></td>
              <td class="num hide-sm">${fmtMoney(r.price)}</td><td class="num hide-sm">${r.price == null ? '' : esc(moneyText(r.currency, (+r.outstanding || 0) * (+r.price || 0)))}</td></tr>`
          }).join('')}</tbody>
          <tfoot><tr><td></td><td>Outstanding on this PO</td><td></td><td></td><td></td><td class="num">${fmtQty(pcs)}</td><td class="hide-sm"></td><td class="num hide-sm">${esc(valueText(rs))}</td></tr></tfoot>
        </table></div>` : ''}
      </details>`
    }

    content.innerHTML = `
      <a class="back-link" href="#/purchasing">← All shipments</a>
      ${notFound.map(p => `<div class="notice warn" style="max-width:900px">${esc(p.error)} Its outstanding items can't be listed.</div>`).join('')}
      <div class="facts">
        <div class="fact"><div class="label">POs</div><div class="value">${esc(pos.join(', ') || '—')}</div></div>
        <div class="fact"><div class="label">Lines outstanding</div><div class="value">${rows.length}</div></div>
        <div class="fact"><div class="label">Pieces outstanding</div><div class="value">${fmtQty(rows.reduce((s, r) => s + (+r.outstanding || 0), 0))}</div></div>
        <div class="fact"><div class="label">Value outstanding</div><div class="value">${esc(valueText(rows))}</div></div>
      </div>
      <p class="muted" style="margin:-4px 0 14px;max-width:760px">Items still to arrive on the relevant POs, with this shipment's invoices already taken off. Figures are MYOB as at ${esc(fmtWhen(sh.created_at))}, when the shipment was matched.</p>
      ${rows.length ? `<div class="filters"><input type="text" id="poSearch" placeholder="Filter by code or description" aria-label="Filter outstanding items" style="min-width:260px"></div>` : ''}
      <div id="poCards">${pos.length ? pos.map(card).join('') : '<div class="empty-state">No PO lines were found for this shipment, so there is nothing to list.</div>'}</div>`
    const search = $('poSearch')
    if (search) search.oninput = () => {
      const q = search.value.trim().toLowerCase()
      content.querySelectorAll('#poCards .inv-card').forEach(c => {
        let any = false
        c.querySelectorAll('tbody tr').forEach(tr => { const show = !q || tr.dataset.q.includes(q); tr.hidden = !show; if (show) any = true })
        c.hidden = !!q && !any
      })
    }
    $('dlBtn').onclick = () => {
      const wb = outstandingWorkbook(XLSX, { name: shipName(sh), rows })
      XLSX.writeFile(wb, `Outstanding_${shipName(sh).replace(/[^A-Za-z0-9 _.-]+/g, '').trim().slice(0, 50) || 'shipment'}.xlsx`)
    }
    $('printBtn').onclick = () => window.print()
  }

  // ============================================================
  // TAB 4: SHIPMENT COUNT
  // One consolidated list for the whole shipment, sorted by bin. One count per item: if the same item is
  // on two invoices, the quantity counted is split back onto the invoice lines in order.
  // ============================================================
  let cur = null   // {shipment, lines, items}

  function finishItem(it) {
    const ls = it.lines, f = ls[0]
    it.bin = ls.map(l => l.bin).find(Boolean) || ''
    it.stock_code = f.stock_code; it.supplier_code = f.supplier_code; it.description = f.description
    it.expected = ls.reduce((s, l) => s + (+l.inv_qty || 0), 0)
    const counted = ls.some(l => l.received !== null && l.received !== undefined)
    it.received = counted ? ls.reduce((s, l) => s + (+l.received || 0), 0) : null
    const po = new Set(); for (const l of ls) for (const [p] of l.pos || []) po.add(p)
    it.pos = [...po]
    const inv = new Map(); for (const l of ls) inv.set(l.invoice_no, (inv.get(l.invoice_no) || 0) + (+l.inv_qty || 0))
    it.invoices = [...inv.entries()].map(([no, qty]) => ({ no, qty }))
    it.flags = [...new Set(ls.flatMap(l => l.flags || []))]
    it.status = ls.some(l => l.status === 'not_on_po') ? 'not_on_po' : ls.some(l => l.status === 'over') ? 'over' : 'ok'
    it.superseded = ls.some(l => l.superseded)
    // one note for the item (it is saved on the item's first line; Shipment Reconciliation shows it on that line)
    it.note = [...new Set(ls.map(l => (l.variance_note || '').trim()).filter(Boolean))].join(' · ')
    return it
  }
  function groupItems(lines) {
    const map = new Map()
    for (const l of lines) {
      if (isFreightFlags(l.flags)) continue   // freight is a charge, not goods to count
      const k = itemKeyOf(l)
      if (!map.has(k)) map.set(k, { key: k, lines: [] })
      map.get(k).lines.push(l)
    }
    return [...map.values()].map(finishItem).sort((x, y) => compareOurCode(x.stock_code, y.stock_code, x.supplier_code, y.supplier_code))   // A-Z by our part number
  }
  function itemTags(it) {
    const t = [it.status]
    if (it.superseded) t.push('superseded')
    if (it.flags.some(f => /^Matched (without|with) /.test(f))) t.push('prefix')
    if (!it.bin && it.status !== 'not_on_po') t.push('nobin')
    if (it.received === null) t.push('uncounted')
    else if (+it.received !== +it.expected) t.push('diff')
    return t.join(' ')
  }
  function diffHtml(it) {
    if (it.received === null) return ''
    const d = +it.received - +it.expected
    if (d === 0) return '<span class="diff-ok">✓</span>'
    return `<span class="${d < 0 ? 'diff-short' : 'diff-over'}">${d > 0 ? '+' : ''}${fmtQty(d)}</span>`
  }

  async function showCount(id) {
    rememberShipment(id)
    renderSidebar('count')
    setTop('Loading…')
    content.innerHTML = `<div class="empty-state">Loading shipment…</div>`
    try {
      const [{ data: sh, error }, lines] = await Promise.all([
        supabase.from('shipments').select('id, created_at, name, status, summary, suppliers, invoice_nos, pos').eq('id', id).maybeSingle(),
        fetchLines(id), shipmentOptions(),
      ])
      if (error || !sh) throw new Error(error?.message || 'This shipment no longer exists.')
      if (!shipOptionsCache.rows.some(r => r.id === id)) shipOptionsCache.rows.unshift(sh)
      cur = { shipment: sh, lines, items: groupItems(lines) }
      if (sh.status !== 'open') return renderCountClosed(sh)
      renderCount()
    } catch (e) { setTop('Shipment Count'); content.innerHTML = `<div class="notice err">${esc(friendlyDbError(e))}</div>` }
  }

  // A shipment whose count was confirmed no longer appears on the Count screen. If one is opened by a link, say where it went.
  function renderCountClosed(sh) {
    setTop(shipName(sh), 'Shipment Count', '')
    content.innerHTML = `<a class="back-link" href="#/count">← All shipments</a>
      <div class="notice ok">The count for this shipment has been confirmed${sh.status === 'received' ? ' and the shipment is completed' : ''}. ${me.is_manager ? `It is in <a href="#/reconcile/${sh.id}">Shipment Reconciliation</a>.` : 'Purchasing is reconciling it.'}</div>
      ${me.is_manager && sh.status === 'counted' ? '<p><button class="btn ghost" id="reopenBtn" type="button">Reopen the count</button></p>' : ''}`
    if ($('reopenBtn')) $('reopenBtn').onclick = () => reopenCount(sh.id, shipName(sh))
  }
  let activeFilter = 'all'
  function renderCount() {
    const { shipment: sh, items } = cur
    const s = sh.summary || {}
    setTop(shipName(sh), `Shipment Count · ${plural((sh.invoice_nos || []).length, 'invoice')} · matched ${fmtWhen(sh.created_at)}`,
      `${pickerHtml(sh.id, 'count')}
       <button class="btn" id="dlBtn">Download check-off sheet</button>
       <button class="btn ghost" id="printBtn">Print</button>
       ${me.is_manager ? `<a class="btn ghost" href="#/reconcile/${sh.id}">Reconciliation →</a>` : ''}`)
    wirePicker('count')

    const toCheck = (s.not_on_po || 0) + (s.over || 0)
    const count = (f) => items.filter(it => itemTags(it).split(' ').includes(f)).length
    const chip = (f, label, n, issue) => n ? `<button class="chip ${issue ? 'issue' : ''}" data-f="${f}" aria-pressed="false">${label}<b>${n}</b></button>` : ''
    content.innerHTML = `
      <a class="back-link" href="#/count">← All shipments</a>
      <div class="facts">
        <div class="fact"><div class="label">Invoices</div><div class="value">${esc((sh.invoice_nos || []).join(', ') || '—')}</div></div>
        <div class="fact"><div class="label">PO</div><div class="value">${esc((sh.pos || []).join(', ') || '—')}</div></div>
        <div class="fact"><div class="label">Items to count</div><div class="value">${items.length}</div></div>
        <div class="fact"><div class="label">Pieces</div><div class="value">${fmtQty(items.reduce((a, it) => a + it.expected, 0))}</div></div>
        <div class="fact" style="min-width:170px"><div class="label">Counted</div><div class="value" id="countedVal"></div><div class="progress"><div id="countedBar"></div></div></div>
      </div>
      ${(() => { const nf = cur.lines.filter(l => isFreightFlags(l.flags)).length; return nf ? `<p class="muted" style="margin:-4px 0 14px">${plural(nf, 'freight line')} in this shipment ${nf === 1 ? 'is' : 'are'} not counted.</p>` : '' })()}
      ${me.linked ? '' : `<div class="notice warn">Your login (staff #${esc(me.loginNo)}) isn't linked to a staff record yet, so counts won't show who entered them. Ask whoever runs Supabase to add you to the staff table.</div>`}
      ${!items.length ? `<div class="notice warn">This shipment has no invoice lines yet.${me.is_manager ? ' Add invoices in <a href="#/invoices">Invoice Creation</a>.' : ' Ask the office to add the invoices.'}</div>` : ''}
      ${!(sh.pos || []).length && items.length ? `<div class="notice warn">No PO lines were found for this shipment, so nothing is matched to a PO. ${me.is_manager ? 'Check the PO number on the invoice, or re-match once MYOB has synced.' : 'Tell the office.'}</div>` : ''}
      ${toCheck ? `<div class="notice err">${toCheck ? `${plural(s.not_on_po || 0, 'line')} not on any loaded PO${s.over ? `, ${plural(s.over, 'line')} for more than is on order` : ''}.` : ''} Check these before receiving.${me.is_manager ? ` <a href="#/edit/${sh.id}">Shipment Edit</a> lets you add our code to a line.` : ''}</div>` : ''}
      <div class="scan-panel" id="scanPanel">
        <div class="scan-row">
          <label for="scanInput">Scan or search</label>
          <input id="scanInput" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Scan a barcode, or type a part number or supplier code, then press Enter">
          <button class="btn ghost" id="scanClear" type="button">Clear</button>
        </div>
        <div id="scanResult" aria-live="polite"></div>
      </div>
      ${items.length ? `<div class="count-labels">
        <strong>Labels</strong>
        <label>Label type <select id="countLblType">${LABEL_ORDER.map(id => `<option value="${id}" ${id === countLabelType() ? 'selected' : ''}>${esc(LABEL_TYPES[id].name)}</option>`).join('')}</select></label>
        <button class="btn" id="printAllLbl" type="button">Print all labels for this shipment</button>
        <span class="muted" id="countLblMsg" style="font-size:12px">Each row's Print Qty is filled in with the quantity supplied. Change it if you need more or fewer, then press Print. Printing opens the browser's print window unless this page was opened with the silent-printing launcher (see Label Printer.bat in the setup guide).</span>
      </div>` : ''}
      <div class="filters" role="group" aria-label="Show items">
        <button class="chip" data-f="all" aria-pressed="true">All<b>${items.length}</b></button>
        <button class="chip" data-f="uncounted" aria-pressed="false">Not counted<b id="uncountedN"></b></button>
        <button class="chip issue" data-f="diff" aria-pressed="false">Count differs<b id="diffN"></b></button>
        ${chip('not_on_po', 'Not on PO', count('not_on_po'), true)}
        ${chip('over', 'More than ordered', count('over'), true)}
        ${chip('superseded', 'Superseded', count('superseded'), true)}
        ${chip('prefix', 'Prefix matched', count('prefix'), false)}
        ${chip('nobin', 'No bin', count('nobin'), false)}
      </div>
      <div class="table-card"><table class="grid" id="lines">
        <thead><tr>
          <th>Bin</th><th>Stock code</th><th>Description</th><th class="hide-sm">Invoice</th><th class="hide-sm">PO</th>
          <th class="num">Qty</th><th class="count num">Received</th><th class="num">Diff</th><th>Note</th><th class="num lbl-col">Print Qty</th>
        </tr></thead>
        <tbody>${items.map(itemRowHtml).join('')}</tbody>
      </table></div>
      <div class="confirm-box" id="confirmBox">
        <div><strong>Finished counting?</strong><div class="muted" id="confirmHint"></div></div>
        <button class="btn" id="confirmBtn" type="button">Confirm shipment</button>
      </div>`
    activeFilter = 'all'
    content.querySelectorAll('.chip').forEach(b => b.onclick = () => {
      content.querySelectorAll('.chip').forEach(x => x.setAttribute('aria-pressed', x === b))
      applyFilter(b.dataset.f)
    })
    content.querySelectorAll('td.count input').forEach(inp => {
      inp.addEventListener('change', () => saveItemCount(inp))
      inp.addEventListener('keydown', ev => {
        const tr = inp.closest('tr')
        if (ev.key === 'Enter') {
          ev.preventDefault()
          inp.blur()   // saves the count
          if (cur.scanKey && tr.dataset.key === cur.scanKey) { const lq = tr.querySelector('.lbl-qty'); if (lq) { lq.focus(); lq.select(); return } }   // a scanned line: on to Print Qty
          $('scanInput').focus()   // any other line: back to the search box
        } else if (ev.key === 'Escape') { ev.preventDefault(); inp.blur(); endScanLine('') }
      })
    })
    // labels: a quantity box and Print button on every row, and one button for the whole shipment
    $('lines').addEventListener('click', ev => {
      const b = ev.target.closest('.lbl-print'); if (b) printItemLabels(b.closest('tr'))
    })
    $('lines').addEventListener('keydown', ev => {
      if (!ev.target.matches('.lbl-qty')) return
      if (ev.key === 'Enter') { ev.preventDefault(); printItemLabels(ev.target.closest('tr')) }
      else if (ev.key === 'Escape') { ev.preventDefault(); endScanLine('') }
    })
    content.querySelectorAll('td.note input').forEach(inp => {
      inp.addEventListener('change', () => saveItemNote(inp))
      inp.addEventListener('keydown', ev => { if (ev.key === 'Enter') { ev.preventDefault(); inp.blur() } })
    })
    $('confirmBtn').onclick = confirmShipment
    wireScan()
    if ($('printAllLbl')) {
      $('printAllLbl').onclick = printAllLabels
      $('countLblType').onchange = () => lblStore.set(LBL_TYPE_KEY, +$('countLblType').value)
    }
    $('dlBtn').onclick = downloadCheckoff
    $('printBtn').onclick = () => window.print()
    updateProgress()
  }

  function itemRowHtml(it) {
    const showSub = it.stock_code && it.supplier_code && normCode(it.stock_code) !== normCode(it.supplier_code)
    const invs = it.invoices.map(i => it.invoices.length > 1 ? `${esc(i.no)} ×${fmtQty(i.qty)}` : esc(i.no)).join('<br>')
    return `<tr class="${esc(it.status)}" data-key="${esc(it.key)}" data-tags="${itemTags(it)}">
      <td class="bin ${it.bin ? '' : 'none'}">${esc(it.bin || 'No bin')}</td>
      <td class="code">${esc(it.stock_code || it.supplier_code)}${showSub ? `<span class="sub">${esc(it.supplier_code)}</span>` : ''}</td>
      <td>${esc(it.description)}</td>
      <td class="hide-sm">${invs}</td>
      <td class="hide-sm">${it.pos.map(esc).join('<br>')}</td>
      <td class="num"><strong>${fmtQty(it.expected)}</strong></td>
      <td class="count num"><input type="number" inputmode="decimal" min="0" step="any" value="${it.received ?? ''}" aria-label="Received quantity for ${esc(it.stock_code || it.supplier_code)}"></td>
      <td class="num diff">${diffHtml(it)}</td>
      <td class="note"><input type="text" maxlength="300" value="${esc(it.note)}" placeholder="Add a note" ${cur.shipment.status === 'open' ? '' : 'disabled'} aria-label="Note for ${esc(it.stock_code || it.supplier_code)}"></td>
      <td class="num lbl-col"><div class="lblcell"><input class="lbl-qty" type="number" min="0" max="99999" step="1" inputmode="numeric" value="${Math.max(0, Math.ceil(it.expected))}" aria-label="Print Qty for ${esc(it.stock_code || it.supplier_code)}"><button class="btn ghost lbl-print" type="button">Print</button></div><span class="lbl-status" aria-live="polite"></span></td>
    </tr>`
  }

  function applyFilter(f = activeFilter) {
    activeFilter = f
    content.querySelectorAll('#lines tbody tr').forEach(tr => { tr.hidden = f !== 'all' && !tr.dataset.tags.split(' ').includes(f) })
  }
  function updateProgress() {
    const items = cur.items
    const counted = items.filter(it => it.received !== null).length
    const diffs = items.filter(it => it.received !== null && +it.received !== +it.expected).length
    $('countedVal').textContent = `${counted} of ${items.length}`
    $('countedBar').style.width = `${items.length ? (100 * counted / items.length) : 0}%`
    $('uncountedN').textContent = items.length - counted
    $('diffN').textContent = diffs
    const un = items.length - counted
    $('confirmHint').textContent = un ? `${plural(un, 'item')} not counted yet. Confirming completes the count, sends it to Reconciliation and opens an email to purchasing.` : 'Every item has been counted. Confirming sends it to Reconciliation and opens an email to purchasing.'
    $('confirmBtn').classList.toggle('ready', un === 0 && items.length > 0)
    return items.length > 0 && counted === items.length
  }

  // ---------- scan or search ----------
  // A scanned barcode (a GTIN from MYOB's Details 2 tab: barcode 1, 2 or 3), a supplier's own code printed as a barcode, a stock
  // code, or typed text. The item is found, the cursor goes to its count box, and once the count is entered the cursor goes back to
  // the scan box, so the next scan can never land in a count box.
  function addScanKey(map, raw, key) {
    const k = normCode(raw); if (!k) return
    const add = x => { if (!map.has(x)) map.set(x, new Set()); map.get(x).add(key) }
    add(k)
    if (/^\d+$/.test(k) && k.replace(/^0+/, '')) add(k.replace(/^0+/, ''))   // 0012345678905 and 12345678905 are the same barcode
    for (const pre of SUPPLIER_PREFIXES) if (k.startsWith(pre) && k.length >= pre.length + 3) add(k.slice(pre.length))   // HYG50751 is also 50751
  }
  function buildScanIndex() {
    const m = new Map()
    for (const it of cur.items) {
      addScanKey(m, it.stock_code, it.key); addScanKey(m, it.supplier_code, it.key)
      for (const l of it.lines) { addScanKey(m, l.gtin, it.key) }
    }
    for (const [key, r] of cur.scanLabels || []) if (r) for (const f of ['barcode1', 'barcode2', 'barcode3', 'oem1', 'oem2', 'oem3']) addScanKey(m, r[f], key)
    cur.scanIdx = m
  }
  // barcodes and OEM numbers of this shipment's items, loaded in the background (a scan before this finishes asks the database instead)
  async function loadScanLabels() {
    const byCode = new Map(), codes = [...new Set(cur.items.map(it => it.stock_code).filter(Boolean))]
    for (let i = 0; i < codes.length; i += 80) {
      const { data, error } = await supabase.from('stock_labels').select('stock_code, barcode1, barcode2, barcode3, oem1, oem2, oem3').in('stock_code', codes.slice(i, i + 80))
      if (error) return
      for (const r of data) byCode.set(r.stock_code, r)
    }
    cur.scanLabels = new Map(cur.items.map(it => [it.key, byCode.get(it.stock_code) || null]))
    buildScanIndex()
  }
  const itemForLabelRow = r => cur.items.filter(it => [it.stock_code, it.supplier_code].some(c => c && (normCode(c) === normCode(r.stock_code))))
  async function scanLookup(term) {
    const t = term.trim(), k = normCode(t), kz = /^\d+$/.test(k) ? k.replace(/^0+/, '') : k
    const hit = new Set([...(cur.scanIdx.get(k) || []), ...(kz && kz !== k ? cur.scanIdx.get(kz) || [] : [])])
    if (hit.size) return { kind: 'items', items: [...hit].map(key => cur.items.find(it => it.key === key)).filter(Boolean) }
    // not known here: ask the label data (stock code, any barcode)
    const digits = /^\d+$/.test(t) ? [t.replace(/^0+/, ''), t.padStart(12, '0'), t.padStart(13, '0'), t.padStart(14, '0')] : []
    for (const variant of [...new Set([t, ...digits])].filter(Boolean)) {
      const res = await supabase.rpc('find_labels', { term: variant })
      if (res.error) break
      if (res.data && res.data.length) {
        const items = [...new Set(res.data.flatMap(itemForLabelRow))]
        return items.length ? { kind: 'items', items } : { kind: 'elsewhere', row: res.data[0] }
      }
    }
    // typed text: part of a code or description (not for long digit strings, which are barcodes)
    if (k.length >= 3 && !(/^\d{8,}$/.test(k))) {
      const low = t.toLowerCase()
      const items = cur.items.filter(it => [it.stock_code, it.supplier_code].some(c => c && normCode(c).includes(k)) || (it.description || '').toLowerCase().includes(low))
      if (items.length) return { kind: 'items', items }
    }
    return { kind: 'none' }
  }
  // The search box stays at the top of the screen while the list scrolls under it, so the found line is scrolled to just below the box.
  function showRowBelowPanel(tr) {
    if (!tr) return
    tr.style.scrollMarginTop = `${($('scanPanel') ? $('scanPanel').offsetHeight : 0) + 14}px`
    tr.scrollIntoView({ block: 'start', behavior: 'smooth' })
  }
  const clearScanMarks = () => { content.querySelectorAll('#lines tr.scan-hit, #lines tr.scan-cand').forEach(r => r.classList.remove('scan-hit', 'scan-cand')); content.querySelectorAll('#lines td.scan-focus').forEach(td => td.classList.remove('scan-focus')) }
  // After any action on the Count screen (a count saved, a note, a label printed, a filter or button pressed) the cursor goes back to the
  // scan box. It is left alone if the person has moved into another box to type.
  const scanFocusSoon = () => setTimeout(() => {
    const s = $('scanInput'); if (!s || !document.body.contains(s) || cur.shipment.status !== 'open') return
    const a = document.activeElement
    if (!a || a === document.body || (a !== s && a.matches('button, a, select, input[type="checkbox"], .chip'))) s.focus()
  }, 0)
  function scanMsg(html, cls = '') { $('scanResult').innerHTML = html ? `<div class="scan-msg ${cls}">${html}</div>` : '' }
  function wireScan() {
    if (cur.shipment.status !== 'open') return
    buildScanIndex(); loadScanLabels().catch(() => {})
    const input = $('scanInput')
    input.addEventListener('focus', () => input.select())   // the next scan replaces whatever is in the box
    input.addEventListener('keydown', async ev => {
      if (ev.key !== 'Enter') return
      ev.preventDefault()
      const term = input.value.trim(); if (!term) return
      clearScanMarks(); scanMsg('Looking…')
      let r
      try { r = await scanLookup(term) } catch (e) { scanMsg(`Couldn't search: ${esc(friendlyDbError(e))}`, 'bad'); input.select(); return }
      if (r.kind === 'none') { scanMsg(`<strong>${esc(term)}</strong> is not on this shipment.`, 'bad'); input.select(); return }
      if (r.kind === 'elsewhere') { scanMsg(`<strong>${esc(term)}</strong> is <strong>${esc(r.row.stock_code)}</strong>${r.row.description ? `, ${esc(r.row.description)}` : ''}. It is not on this shipment.`, 'bad'); input.select(); return }
      if (r.items.length === 1) return showScanItem(r.items[0])
      $('scanResult').innerHTML = `<div class="scan-msg">${r.items.length} items match. Choose one:</div><div class="scan-list">${r.items.slice(0, 8).map(it => `<button type="button" class="scan-pick" data-key="${esc(it.key)}"><strong>${esc(it.stock_code || it.supplier_code)}</strong> ${esc(it.description)}<span>Invoiced ${fmtQty(it.expected)}${it.received !== null ? ` · counted ${fmtQty(it.received)}` : ''}</span></button>`).join('')}</div>${r.items.length > 8 ? `<div class="scan-msg">Showing 8 of ${r.items.length}. Type more of the code.</div>` : ''}`
      $('scanResult').querySelectorAll('.scan-pick').forEach(b => b.onclick = () => showScanItem(cur.items.find(it => it.key === b.dataset.key)))
      clearScanMarks()
      let firstRow = null
      for (const it of r.items) { const row = [...content.querySelectorAll('#lines tbody tr')].find(x => x.dataset.key === it.key); if (row) { row.classList.add('scan-cand'); firstRow = firstRow || row } }
      showRowBelowPanel(firstRow)   // every match is marked in the list, and the first is brought into view
    })
    $('scanClear').onclick = () => { clearScanMarks(); input.value = ''; scanMsg(''); input.focus() }
    // any action on the screen sends the cursor back here
    for (const el of [$('lines'), content.querySelector('.filters'), content.querySelector('.count-labels'), $('dlBtn')]) if (el) el.addEventListener('click', ev => { if (ev.target.closest('button, .chip, a, label')) scanFocusSoon() })
    for (const el of [content.querySelector('.count-labels')]) if (el) el.addEventListener('change', ev => { if (ev.target.matches('select, input[type="checkbox"]')) scanFocusSoon() })
    setTimeout(() => { if ($('scanInput')) $('scanInput').focus() }, 0)   // ready for the first scan
  }
  // A found item is worked on in its own line in the list: the line is marked and scrolled to just under the search box, and the cursor
  // is in its Received box. Type the quantity and press Enter: the count is saved and the cursor moves to Print Qty. Change it if needed
  // and press Enter (or Print) to print the labels, and the cursor goes back to the search box. Escape goes back to the search box at any point.
  function showScanItem(it) {
    const tr = [...content.querySelectorAll('#lines tbody tr')].find(r => r.dataset.key === it.key)
    if (tr && tr.hidden) { const allChip = content.querySelector('.chip[data-f="all"]'); if (allChip) allChip.click() }
    clearScanMarks(); cur.scanKey = it.key
    const code = esc(it.stock_code || it.supplier_code)
    $('scanResult').innerHTML = `<div class="scan-found ${esc(it.status)}">
      <div><span class="scan-code">${code}</span>${it.stock_code && it.supplier_code && normCode(it.stock_code) !== normCode(it.supplier_code) ? `<span class="scan-alt">${esc(it.supplier_code)}</span>` : ''}
        <span class="scan-desc">${esc(it.description)}</span>
        <span class="scan-meta">Bin ${esc(it.bin || 'none')} · Invoiced <strong>${fmtQty(it.expected)}</strong>${it.received !== null ? ` · already counted <strong>${fmtQty(it.received)}</strong>` : ''}${it.status === 'not_on_po' ? ' · <strong class="bad">not on a PO</strong>' : it.status === 'over' ? ' · <strong class="bad">more than is on order</strong>' : ''}</span></div>
      <div class="scan-steps">Type the quantity received in the marked box and press <b>Enter</b>, change <b>Print Qty</b> if needed, then press <b>Enter</b> or <b>Print</b>.
        <button class="btn ghost" id="scanSame" type="button">Received = invoiced (${fmtQty(it.expected)})</button><button class="btn ghost" id="scanCancel" type="button">Cancel</button></div>
      <div id="scanSaved" class="scan-saved"></div>
    </div>`
    if (!tr) { scanMsg(`<strong>${code}</strong> is on this shipment but not in the list.`, 'bad'); return }
    tr.classList.add('scan-hit'); tr.querySelector('td.count').classList.add('scan-focus')
    const recv = tr.querySelector('td.count input'), lq = tr.querySelector('.lbl-qty')
    showRowBelowPanel(tr)
    recv.focus(); recv.select()
    const toPrintQty = () => { if (lq) { lq.focus(); lq.select() } }
    $('scanSame').onclick = async () => { recv.value = it.expected; await saveItemCount(recv); toPrintQty() }
    $('scanCancel').onclick = () => endScanLine('')
  }
  // The line is finished with (printed, skipped or cancelled): the marks go and the cursor goes back to an empty search box.
  function endScanLine(msg, cls = 'ok') {
    clearScanMarks(); cur.scanKey = null
    const input = $('scanInput'); if (!input) return
    input.value = ''; scanMsg(msg, cls); input.focus()
  }

  // The note for an item. It is kept on the item's first line; if the item is on more than one invoice line the others are cleared,
  // so there is one note, not several copies.
  async function saveItemNote(inp) {
    const tr = inp.closest('tr'), it = cur.items.find(x => x.key === tr.dataset.key)
    const note = inp.value.trim()
    if (note === it.note) return
    inp.classList.remove('saved', 'failed'); inp.classList.add('saving')
    const patches = it.lines.map((l, i) => ({ l, note: i === 0 ? note : '' })).filter(p => (p.l.variance_note || '') !== p.note)
    const res = await Promise.all(patches.map(p => supabase.from('shipment_lines').update({ variance_note: p.note }).eq('id', p.l.id)))
    inp.classList.remove('saving')
    const bad = res.find(r => r.error)
    if (bad) { inp.classList.add('failed'); inp.title = friendlyDbError(bad.error); return }
    patches.forEach(p => { p.l.variance_note = p.note })
    finishItem(it)
    inp.classList.add('saved')
    scanFocusSoon()
  }

  // Confirm shipment: the count is finished. The shipment goes to Reconciliation (and leaves this screen), and an email to
  // purchasing opens in the default mail program, ready to send.
  const PURCHASING_EMAIL = 'purchasing@camaproducts.co.nz'
  let countNotice = ''
  function completionMailto(sh) {
    const name = shipName(sh)
    const items = cur.items, counted = items.filter(it => it.received !== null).length
    const diffs = items.filter(it => it.received !== null && +it.received !== +it.expected).length
    const notes = items.filter(it => it.note).length
    const body = [
      `Shipment ${name} is complete and ready for reconciling.`, '',
      (sh.invoice_nos || []).length ? `Invoices: ${sh.invoice_nos.join(', ')}` : null, (sh.pos || []).length ? `PO: ${sh.pos.join(', ')}` : null,
      `Counted by: ${me.name}`,
      `${counted} of ${items.length} items counted${diffs ? `, ${diffs} differ from the invoice` : ''}${notes ? `, ${notes} with notes` : ''}.`,
    ].filter(l => l !== null).join('\r\n')
    return `mailto:${PURCHASING_EMAIL}?subject=${encodeURIComponent(`Shipment ${name} is complete`)}&body=${encodeURIComponent(body)}`
  }
  async function confirmShipment() {
    const sh = cur.shipment, name = shipName(sh)
    const un = cur.items.filter(it => it.received === null).length
    const msg = un
      ? `${plural(un, 'item')} ${un === 1 ? 'has' : 'have'} not been counted.\n\nConfirm "${name}" anyway?\n\nIt will be removed from this screen and an email to ${PURCHASING_EMAIL} will open for you to send.`
      : `Confirm "${name}" as counted?\n\nIt will be removed from this screen and an email to ${PURCHASING_EMAIL} will open for you to send.`
    if (!confirm(msg)) return
    const btn = $('confirmBtn'); btn.disabled = true
    const { error } = await supabase.from('shipments').update({ status: 'counted' }).eq('id', sh.id)
    if (error) { btn.disabled = false; return alert(`Couldn't confirm the shipment: ${friendlyDbError(error)}`) }
    const href = completionMailto(sh)
    sh.status = 'counted'; shipOptionsCache.at = 0
    countNotice = `"${name}" is confirmed and has gone to reconciliation. An email to ${PURCHASING_EMAIL} should have opened in your mail program. If it didn't, tell purchasing it is ready.`
    window.__lastMailto = href
    const link = document.createElement('a'); link.href = href; document.body.appendChild(link); link.click(); link.remove()
    location.hash = '#/count'
  }
  async function reopenCount(id, name) {
    if (!confirm(`Reopen the count for "${name}"?\n\nIt goes back on the Shipment Count screen so the count can be changed.`)) return
    const { error } = await supabase.from('shipments').update({ status: 'open' }).eq('id', id)
    if (error) return alert(`Couldn't reopen the shipment: ${friendlyDbError(error)}`)
    shipOptionsCache.at = 0
    location.hash = `#/count/${id}`
  }

  async function saveItemCount(inp) {
    const tr = inp.closest('tr')
    const it = cur.items.find(x => x.key === tr.dataset.key)
    const raw = inp.value.trim()
    const value = raw === '' ? null : Number(raw)
    if (value !== null && (!Number.isFinite(value) || value < 0)) { inp.classList.add('failed'); return }
    inp.classList.remove('saved', 'failed'); inp.classList.add('saving')
    // one count for the item, split across its invoice lines in order
    const alloc = value === null ? it.lines.map(() => null) : allocateCount(value, it.lines.map(l => +l.inv_qty))
    const now = new Date().toISOString()
    const patches = it.lines.map((l, i) => ({ l, patch: { received: alloc[i], counted_by: value === null ? null : me.staffno, counted_at: value === null ? null : now } }))
    const res = await Promise.all(patches.map(p => supabase.from('shipment_lines').update(p.patch).eq('id', p.l.id)))
    inp.classList.remove('saving')
    const bad = res.find(r => r.error)
    if (bad) { inp.classList.add('failed'); inp.title = bad.error.message; return }
    patches.forEach(p => Object.assign(p.l, p.patch))
    finishItem(it)
    inp.classList.add('saved')
    tr.dataset.tags = itemTags(it)
    tr.querySelector('td.diff').innerHTML = diffHtml(it)
    updateProgress()   // the shipment stays open until Confirm shipment is pressed
    if ($('scanSaved') && cur.scanKey === it.key && value !== null) $('scanSaved').innerHTML = `Counted <strong>${fmtQty(value)}</strong> (invoiced ${fmtQty(it.expected)})${value !== +it.expected ? ' <strong class="bad">differs</strong>' : ''}`
    scanFocusSoon()
  }

  // ---------- labels from Shipment Count ----------
  const countLabelType = () => { const t = +lblStore.get(LBL_TYPE_KEY); return LABEL_TYPES[t] ? t : LABEL_ORDER[0] }
  const labelDataFrom = r => ({ barcode: r.barcode1 || '', partNo: r.stock_code || '', description: r.label_description || '', oem1: r.oem1 || '', oem2: r.oem2 || '', oem3: r.oem3 || '', bin: r.bin || '' })
  const labelLookupError = e => /find_labels|stock_labels|does not exist|schema cache/i.test(e.message) ? 'The label data tables are not set up yet (run migration_3.sql).' : `Couldn't look up labels: ${e.message}`

  // Fill cur.labelRows (item key -> label row, or null when MYOB has none) for these items.
  async function loadItemLabels(items) {
    cur.labelRows = cur.labelRows || new Map()
    const todo = items.filter(it => !cur.labelRows.has(it.key))
    const byCode = new Map()
    const codes = [...new Set(todo.map(it => it.stock_code).filter(Boolean))]
    for (let i = 0; i < codes.length; i += 80) {
      const { data, error } = await supabase.from('stock_labels').select('*').in('stock_code', codes.slice(i, i + 80))
      if (error) throw new Error(error.message)
      for (const r of data) byCode.set(r.stock_code, r)
    }
    for (const it of todo) {
      let r = it.stock_code ? byCode.get(it.stock_code) : null
      if (!r) {   // different capitals, or no stock code: search stock codes and barcodes the way Label Printer does
        for (const term of [it.stock_code, it.supplier_code].filter(Boolean)) {
          const res = await supabase.rpc('find_labels', { term })
          if (res.error) throw new Error(res.error.message)
          if (res.data && res.data.length) { r = res.data[0]; break }
        }
      }
      cur.labelRows.set(it.key, r || null)
    }
  }
  const rowLabelQty = tr => { const raw = tr.querySelector('.lbl-qty').value.trim(), n = Math.floor(+raw); return raw && Number.isFinite(n) && n >= 0 && n <= 99999 ? n : NaN }
  function setRowLabelStatus(tr, text, bad = false) { const st = tr.querySelector('.lbl-status'); st.textContent = text; st.className = 'lbl-status' + (bad ? ' bad' : '') }

  async function printItemLabels(tr) {
    const it = cur.items.find(x => x.key === tr.dataset.key); if (!it) return
    const scanned = cur.scanKey === it.key
    const label = esc(it.stock_code || it.supplier_code)
    const n = rowLabelQty(tr)
    if (n === 0) { setRowLabelStatus(tr, 'Print Qty is 0, so nothing to print.', true); if (scanned) endScanLine(`No labels printed for <strong>${label}</strong> (Print Qty is 0).`); return }
    if (!Number.isFinite(n) || n < 1) { setRowLabelStatus(tr, 'Enter how many labels.', true); tr.querySelector('.lbl-qty').focus(); return }
    setRowLabelStatus(tr, 'Looking up…')
    try { await loadItemLabels([it]) } catch (e) { setRowLabelStatus(tr, labelLookupError(e), true); if (scanned) endScanLine(`<strong>${label}</strong>: ${esc(labelLookupError(e))}`, 'bad'); return }
    const row = cur.labelRows.get(it.key)
    if (!row) { setRowLabelStatus(tr, 'No label data in MYOB for this item.', true); if (scanned) endScanLine(`<strong>${label}</strong> has no label data in MYOB, so nothing was printed.`, 'bad'); return }
    if (n > 500 && !confirm(`Print ${n.toLocaleString()} labels?`)) { setRowLabelStatus(tr, ''); return }
    setRowLabelStatus(tr, '')
    printLabelJobs(countLabelType(), [{ data: labelDataFrom(row), n }], () => { setRowLabelStatus(tr, `Sent ${n} to the printer`); scanFocusSoon() })
    if (scanned) endScanLine(`Printing <strong>${n}</strong> label${n === 1 ? '' : 's'} for <strong>${label}</strong>.`)   // back to the search box for the next scan
    else scanFocusSoon()
  }

  // One print job for the whole shipment: every row's label, in the order on screen, each as many times as its quantity box says.
  async function printAllLabels() {
    const btn = $('printAllLbl'), msg = $('countLblMsg')
    const rows = cur.items.map(it => ({ it, tr: content.querySelector(`#lines tr[data-key="${it.key}"]`) })).filter(x => x.tr)
    const bad = rows.filter(x => !Number.isFinite(rowLabelQty(x.tr)))
    if (bad.length) { bad.forEach(x => setRowLabelStatus(x.tr, 'Enter a quantity, or 0 to skip.', true)); msg.textContent = `${plural(bad.length, 'row')} ${bad.length === 1 ? 'has' : 'have'} a quantity that isn't valid.`; bad[0].tr.querySelector('.lbl-qty').focus(); return }
    const wanted = rows.map(x => ({ ...x, n: rowLabelQty(x.tr) })).filter(x => x.n > 0)
    if (!wanted.length) { msg.textContent = 'Every quantity is 0, so there is nothing to print.'; return }
    btn.disabled = true; msg.textContent = 'Looking up label data…'
    try { await loadItemLabels(wanted.map(x => x.it)) } catch (e) { msg.textContent = labelLookupError(e); btn.disabled = false; return }
    btn.disabled = false
    const jobs = wanted.filter(x => cur.labelRows.get(x.it.key)).map(x => ({ data: labelDataFrom(cur.labelRows.get(x.it.key)), n: x.n, tr: x.tr }))
    const missing = wanted.filter(x => !cur.labelRows.get(x.it.key))
    missing.forEach(x => setRowLabelStatus(x.tr, 'No label data in MYOB for this item.', true))
    if (!jobs.length) { msg.textContent = 'None of these items have label data in MYOB, so nothing can be printed.'; return }
    const total = jobs.reduce((s, j) => s + j.n, 0)
    const skipped = rows.length - wanted.length
    const ok = confirm(`Print ${total.toLocaleString()} label${total === 1 ? '' : 's'} for ${plural(jobs.length, 'item')}?`
      + (missing.length ? `\n\nNo label data in MYOB, so these are skipped:\n${missing.map(x => x.it.stock_code || x.it.supplier_code).join(', ')}` : '')
      + (skipped ? `\n\n${plural(skipped, 'item')} with quantity 0 skipped.` : ''))
    if (!ok) { msg.textContent = ''; return }
    msg.textContent = `Printing ${total.toLocaleString()} labels…`
    printLabelJobs(countLabelType(), jobs, () => {
      msg.textContent = `Sent ${total.toLocaleString()} labels for ${plural(jobs.length, 'item')} to the printer.${missing.length ? ` ${plural(missing.length, 'item')} had no label data.` : ''}`
      jobs.forEach(j => setRowLabelStatus(j.tr, `Sent ${j.n} to the printer`))
      scanFocusSoon()
    })
    scanFocusSoon()
  }

  // One sheet per invoice, each sorted by Cama code A to Z (see invoiceCheckoffWorkbook in core).
  // The Count screen only loads a few columns of the shipment, so the invoices (printed line amounts, PO, date, GST, printed
  // total) are fetched here, when the sheet is asked for.
  async function downloadCheckoff() {
    const btn = $('dlBtn'), label = btn.textContent
    btn.disabled = true; btn.textContent = 'Preparing…'
    try {
      const sh = await getFullShipment(cur.shipment.id)
      const wb = invoiceCheckoffWorkbook(XLSX, { name: shipName(sh), invoices: sh.invoices || [], lines: cur.lines })
      XLSX.writeFile(wb, `Count_${shipName(sh).replace(/[^A-Za-z0-9 _.-]+/g, '').trim().slice(0, 50) || 'shipment'}.xlsx`)
    } catch (e) {
      alert(`The check-off sheet could not be made: ${e.message || e}`)
    } finally { btn.disabled = false; btn.textContent = label }
  }

  // ============================================================
  // TAB 5: SHIPMENT RECONCILIATION
  // Every line grouped by invoice number, with quantity variances (counted v invoiced), PO exceptions
  // and price changes, and a note field for each line.
  // ============================================================
  let recon = null   // {shipment, lines}
  let showRecv = true, showPoq = true   // two separate switches, remembered for the browser session
  try { showRecv = sessionStorage.getItem('rx_show_recv') !== '0'; showPoq = sessionStorage.getItem('rx_show_poq') !== '0' } catch {}
  const isCounted = l => l.received !== null && l.received !== undefined
  const qtyDiff = l => (isCounted(l) ? +l.received - +l.inv_qty : null)
  function lineTags(l) {
    if (isFreightFlags(l.flags)) return l.variance_note ? ['freight', 'noted'] : ['freight']   // a charge: no count, no PO exception
    const t = []
    if (!isCounted(l)) t.push('uncounted'); else if (qtyDiff(l) !== 0) t.push('qty')
    if (l.status !== 'ok') t.push('po')
    if (priceVarOf(l)) t.push('price')
    if (l.variance_note) t.push('noted')
    return t
  }

  // ---------- Shipment Count and Shipment Reconciliation: the lists you click into (like Invoice Creation) ----------
  function listCardHtml(s, base) {
    const sm = s.summary || {}
    const invs = s.invoice_list || []
    const isCount = base === 'count', isPurch = base === 'purchasing'
    const money = me.is_manager   // warehouse staff see quantities, not values
    const rows = invs.length ? invs.map(i => `<tr>
        <td><strong>${esc(i.invoice_no)}</strong></td><td>${esc(i.supplier)}</td><td>${esc(i.po || '')}</td>
        <td class="num">${i.lines}</td><td class="num">${fmtQty(i.pcs)}</td>
        ${money ? `<td class="num">${i.total != null ? esc(i.currency || '') + ' ' + fmtMoney(i.total) : ''}</td>` : ''}</tr>`).join('')
      : `<tr><td colspan="${money ? 6 : 5}" class="muted">No invoices in this shipment.</td></tr>`
    const toCheck = (sm.not_on_po || 0) + (sm.over || 0)
    const href = `#/${base}/${s.id}`
    return `<div class="ship-card clickable" data-href="${href}">
      <div class="ship-head">
        <div class="ship-title"><a class="ship-name" href="${href}">${esc(shipName(s))}</a> ${statusTag(s.status)}</div>
        <div class="ship-actions"><a class="btn" href="${href}">${isCount ? 'Count' : isPurch ? 'View outstanding' : 'Reconcile'} →</a></div>
      </div>
      <div class="ship-meta">${esc(fmtWhen(s.created_at))} · ${plural(invs.length || (s.invoice_nos || []).length, 'invoice')} · ${plural(sm.lines || 0, 'line')} · ${fmtQty(sm.pcs || 0)} pcs${isCount && sm.oldest_due ? ` · <span class="${sm.oldest_due < new Date().toISOString().slice(0, 10) ? 'warn-text' : ''}">Oldest due ${esc(fmtDay(sm.oldest_due))}${sm.oldest_due < new Date().toISOString().slice(0, 10) ? ' (overdue)' : ''}</span>` : ''}${isPurch ? ` · ${plural(sm.still_open || 0, 'line')} still outstanding` : money && toCheck ? ` · ${toCheck} to check` : ''}</div>
      <div class="table-wrap"><table class="grid inv-table">
        <thead><tr><th>Invoice</th><th>Supplier</th><th>PO</th><th class="num">Lines</th><th class="num">Pieces</th>${money ? '<th class="num">Total</th>' : ''}</tr></thead>
        <tbody>${rows}</tbody></table></div>
    </div>`
  }
  function wireCardClicks() {
    content.onclick = ev => {
      if (ev.target.closest('a, button, select, input, summary')) return
      const card = ev.target.closest('.ship-card.clickable')
      if (card) location.hash = card.dataset.href.slice(1)
    }
  }

  // The oldest due date in MYOB of the PO lines a shipment is on. New and re-matched shipments keep it in their summary; shipments made
  // before that are worked out here once (the match is run again from the saved invoices and PO lines) and saved.
  async function fillOldestDue(list) {
    const need = list.filter(s => (s.summary || {}).oldest_due === undefined)
    if (!need.length) return
    const { data } = await supabase.from('shipments').select('id, invoices, po_lines, summary').in('id', need.map(s => s.id))
    for (const f of data || []) {
      const s = list.find(x => x.id === f.id); if (!s) continue
      let oldest = null
      try { oldest = summarise(f.invoices || [], f.po_lines || [], matchShipment(f.invoices || [], f.po_lines || [])).oldest_due } catch { /* no date: it goes to the end of the list */ }
      s.summary = { ...(f.summary || {}), oldest_due: oldest }
      await supabase.from('shipments').update({ summary: s.summary }).eq('id', f.id)
    }
  }
  const fmtDay = d => { const t = new Date(`${String(d).slice(0, 10)}T00:00:00`); return Number.isNaN(+t) ? String(d) : t.toLocaleDateString('en-NZ', { day: 'numeric', month: 'short', year: 'numeric' }) }
  const dueOrder = (a, b) => {
    const x = (a.summary || {}).oldest_due || '', y = (b.summary || {}).oldest_due || ''
    if (!x !== !y) return x ? -1 : 1
    return x.localeCompare(y) || String(a.created_at).localeCompare(String(b.created_at))
  }
  async function showCountList() {
    renderSidebar('count')
    setTop('Shipment Count', 'Choose a shipment to count')
    content.innerHTML = `<div class="empty-state">Loading shipments…</div>`
    try {
      const all = await loadShipmentCards()
      shipOptionsCache = { at: Date.now(), rows: all }
      const data = all.filter(s => s.status === 'open')   // a shipment leaves this screen when its count is confirmed
      await fillOldestDue(data)
      data.sort(dueOrder)   // the shipment with the oldest due date in MYOB is at the top
      const notice = countNotice ? `<div class="notice ok">${esc(countNotice)}</div>` : ''
      countNotice = ''
      if (!data.length) {
        content.innerHTML = notice + (me.is_manager
          ? `<div class="empty-state">No shipments to count. <a href="#/invoices">Add invoices in Invoice Creation</a>.</div>`
          : `<div class="empty-state">No shipments to count right now. The office adds shipments here once their invoices are ready.</div>`)
        return
      }
      const group = (title, list, open = true) => !list.length ? '' : open
        ? `<div class="group-title">${title}<span class="count">${list.length}</span></div>${list.map(s => listCardHtml(s, 'count')).join('')}`
        : `<details class="received-ships"><summary>${title} (${list.length})</summary>${list.map(s => listCardHtml(s, 'count')).join('')}</details>`
      content.innerHTML = notice + group('To count: oldest due date first', data)
      wireCardClicks()
    } catch (e) { content.innerHTML = `<div class="notice err">${esc(friendlyDbError(e))}</div>` }
  }

  async function showReconcileList() {
    renderSidebar('reconcile')
    setTop('Shipment Reconciliation', 'Choose a shipment to reconcile')
    content.innerHTML = `<div class="empty-state">Loading shipments…</div>`
    try {
      const all = await loadShipmentCards()
