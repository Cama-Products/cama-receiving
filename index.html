<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cama - Receiving</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2314265A'/%3E%3Ctext x='32' y='45' font-family='Arial,Helvetica,sans-serif' font-size='36' font-weight='800' fill='%23B5D334' text-anchor='middle'%3ER%3C/text%3E%3C/svg%3E">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
  :root {
    --navy: #21409A;        /* PMS Reflex Blue C - CAMA brand blue */
    --navy-dark: #14265A;
    --navy-darker: #0D1B40;
    --lime: #B5D334;        /* PMS 376C - CAMA brand green */
    --lime-dark: #93AC29;
    --lime-tint: rgba(181,211,52,0.16);
    --surface: #F4F6FA;
    --paper: #FFFFFF;
    --border: #DEE3EC;
    --ink: #1A2340;
    --slate: #5A6380;
    --slate-dim: #9099B0;
    --err: #B3261E;
    --err-tint: rgba(179,38,30,0.09);
    --ok: #1F7A45;
    --ok-tint: rgba(31,122,69,0.09);
    --warn: #B26A00;
    --warn-tint: rgba(178,106,0,0.10);
    --sidebar-w: 240px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Verdana, sans-serif;
    background: var(--surface); color: var(--ink); font-size: 14px; line-height: 1.45;
    -webkit-tap-highlight-color: transparent;
  }
  a { color: var(--navy); text-decoration: none; }
  a:hover { text-decoration: underline; }
  button { font-family: inherit; }
  :focus-visible { outline: 2px solid var(--navy); outline-offset: 2px; }

  /* ============ LOGIN ============ */
  .login-screen {
    min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 24px; background: var(--navy-darker); padding: 24px;
  }
  .login-logo { width: 200px; height: auto; margin-bottom: 4px; }
  .login-wordmark { font-size: 14px; font-weight: 700; letter-spacing: 0.14em; color: rgba(255,255,255,0.85); margin-top: -8px; }
  .login-card {
    background: var(--paper); border-radius: 16px; padding: 36px 32px;
    width: 100%; max-width: 360px; display: flex; flex-direction: column; align-items: center; gap: 22px;
  }
  .prompt { font-size: 16px; color: var(--slate); }
  .display { font-size: 38px; font-weight: 700; letter-spacing: 0.08em; min-height: 50px; display: flex; align-items: center; justify-content: center; gap: 12px; color: var(--ink); font-variant-numeric: tabular-nums; }
  .pin-dots { display: flex; gap: 14px; }
  .pin-dot { width: 15px; height: 15px; border-radius: 50%; border: 2px solid var(--border); transition: background 0.12s ease, border-color 0.12s ease; }
  .pin-dot.filled { background: var(--navy); border-color: var(--navy); }
  .error-msg { color: var(--err); font-size: 14px; min-height: 18px; text-align: center; }
  .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; width: 100%; max-width: 300px; }
  .key {
    background: var(--surface); border: 1px solid var(--border); color: var(--ink);
    font-size: 24px; font-weight: 500; border-radius: 12px; aspect-ratio: 1.3 / 1;
    display: flex; align-items: center; justify-content: center; user-select: none; cursor: pointer;
  }
  .key:active { background: #EAEDF2; }
  .key.func.primary { background: var(--navy); border-color: var(--navy); color: #fff; font-size: 14px; font-weight: 700; }
  .key.func.plain { background: transparent; border-color: transparent; font-size: 14px; color: var(--slate); }
  .switch-user { background: none; border: none; color: var(--navy); font-size: 13px; padding: 8px; font-weight: 600; cursor: pointer; }
  .setup-warning {
    max-width: 380px; background: #FFF6E8; border: 1px solid #E8A33D; color: #8A5A16;
    padding: 14px 16px; border-radius: 10px; font-size: 13px; line-height: 1.5;
  }

  /* ============ APP SHELL ============ */
  .shell { display: flex; height: 100vh; overflow: hidden; }
  .sidebar { width: var(--sidebar-w); flex-shrink: 0; background: var(--navy-dark); color: #fff; display: flex; flex-direction: column; height: 100%; }
  .sidebar-logo { padding: 20px 18px 16px; border-bottom: 1px solid rgba(255,255,255,0.12); display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .sidebar-logo img { width: 110px; height: auto; display: block; }
  .sidebar-wordmark { font-size: 13px; font-weight: 700; letter-spacing: 0.14em; color: rgba(255,255,255,0.85); }
  .sidebar-user { padding: 14px 18px; border-bottom: 1px solid rgba(255,255,255,0.12); font-size: 12px; color: rgba(255,255,255,0.7); }
  .sidebar-user strong { display: block; color: #fff; font-size: 14px; margin-bottom: 2px; font-weight: 600; }
  .nav { flex: 1; padding: 10px 0; overflow-y: auto; }
  .nav-item { display: flex; align-items: center; gap: 10px; padding: 11px 18px; cursor: pointer; color: rgba(255,255,255,0.8); font-size: 14px; font-weight: 500; border-left: 3px solid transparent; transition: all 0.15s; text-decoration: none; }
  .nav-item:hover { color: #fff; background: rgba(255,255,255,0.06); text-decoration: none; }
  .nav-item.active { color: #fff; border-left-color: var(--lime); background: rgba(255,255,255,0.08); font-weight: 600; }
  .sidebar-footer { padding: 10px 0; border-top: 1px solid rgba(255,255,255,0.1); }

  .main { flex: 1; display: flex; flex-direction: column; height: 100%; overflow: hidden; min-width: 0; }
  .topbar { background: var(--paper); border-bottom: 1px solid var(--border); padding: 0 28px; min-height: 62px; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-shrink: 0; }
  .topbar-title { font-size: 18px; font-weight: 700; }
  .topbar-subtitle { font-size: 12px; color: var(--slate-dim); margin-top: 1px; }
  .topbar-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .content { flex: 1; overflow-y: auto; padding: 24px 28px 60px; }

  /* ============ COMMON ============ */
  .btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--navy); background: var(--navy); color: #fff; font-size: 13px; font-weight: 600; padding: 9px 14px; border-radius: 8px; cursor: pointer; text-decoration: none; }
  .btn:hover { background: var(--navy-dark); text-decoration: none; }
  .btn.ghost { background: var(--paper); color: var(--navy); border-color: var(--border); }
  .btn.ghost:hover { border-color: var(--navy); }
  .btn.danger { background: var(--paper); color: var(--err); border-color: var(--border); }
  .btn:disabled { opacity: 0.55; cursor: default; }
  .panel { background: var(--paper); border: 1px solid var(--border); border-radius: 12px; padding: 20px 22px; }
  .muted { color: var(--slate); }
  .empty-state { color: var(--slate); padding: 40px 0; text-align: center; }
  .notice { border-radius: 10px; padding: 12px 16px; margin-bottom: 16px; font-size: 14px; }
  .notice.ok { background: var(--ok-tint); color: var(--ok); }
  .notice.err { background: var(--err-tint); color: var(--err); }
  .notice.warn { background: var(--warn-tint); color: var(--warn); }
  table.grid { width: 100%; border-collapse: collapse; background: var(--paper); }
  table.grid th { text-align: left; font-size: 12px; font-weight: 700; color: var(--slate-dim); padding: 10px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; position: sticky; top: 0; background: var(--paper); z-index: 1; }
  table.grid td { padding: 9px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
  table.grid .num { text-align: right; font-variant-numeric: tabular-nums; }
  .table-card { background: var(--paper); border: 1px solid var(--border); border-radius: 12px; overflow: auto; }

  /* ============ RECEIVE ============ */
  .drop {
    border: 2px dashed var(--border); border-radius: 14px; background: var(--paper);
    padding: 34px 28px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center;
    transition: border-color 0.15s, background 0.15s; max-width: 760px;
  }
  .drop.over { border-color: var(--lime-dark); background: #FAFCF1; }
  .drop .big { font-size: 17px; font-weight: 600; }
  .drop .small { font-size: 13px; color: var(--slate); }
  .drop label.btn { margin-top: 8px; }
  .drop input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; }
  .file-list { max-width: 760px; margin: 16px 0; display: flex; flex-direction: column; gap: 8px; }
  .file-row { background: var(--paper); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; display: grid; grid-template-columns: 52px 1fr auto; gap: 12px; align-items: center; }
  .file-ext { font-size: 11px; font-weight: 700; color: var(--navy); background: rgba(33,64,154,0.08); border-radius: 6px; text-align: center; padding: 4px 0; }
  .file-name { font-weight: 600; word-break: break-all; }
  .file-status { font-size: 12px; color: var(--slate); }
  .route-pill { display: inline-block; margin-left: 8px; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; background: var(--surface); color: var(--slate); vertical-align: middle; }
  .route-pill.free { background: var(--ok-tint); color: var(--ok); }
  .route-pill.azure { background: var(--warn-tint); color: var(--warn); }
  .route-pill.none { background: var(--err-tint); color: var(--err); }
  .file-row.file-azure { border-color: var(--warn); }
  .azure-alert { max-width: 900px; margin-bottom: 10px; }
  .file-status.err { color: var(--err); }
  .file-status.ok { color: var(--ok); }
  .file-remove { background: none; border: none; color: var(--slate-dim); font-size: 18px; cursor: pointer; padding: 4px 8px; }
  .receive-actions { display: flex; gap: 10px; align-items: center; max-width: 760px; }
  .hint { font-size: 12px; color: var(--slate-dim); max-width: 760px; margin-top: 18px; line-height: 1.6; }

  /* ============ SHIPMENT ============ */
  .facts { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; }
  .fact { background: var(--paper); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; min-width: 120px; }
  .fact .label { font-size: 12px; color: var(--slate-dim); font-weight: 600; }
  .fact .value { font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .progress { height: 6px; background: var(--border); border-radius: 3px; margin-top: 6px; overflow: hidden; }
  .progress > div { height: 100%; background: var(--lime-dark); transition: width 0.2s; }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 12px; }
  .chip { border: 1px solid var(--border); background: var(--paper); border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 600; color: var(--slate); cursor: pointer; }
  .chip b { margin-left: 4px; color: var(--ink); }
  .chip.issue b { color: var(--err); }
  .chip[aria-pressed=true] { background: var(--navy); border-color: var(--navy); color: #fff; }
  .chip[aria-pressed=true] b { color: var(--lime); }
  td.code { font-weight: 600; white-space: nowrap; }
  td.code .sub { display: block; font-weight: 400; color: var(--slate-dim); font-size: 12px; }
  td.bin { white-space: nowrap; font-variant-numeric: tabular-nums; }
  td.bin.none { color: var(--slate-dim); }
  .flag { display: block; font-size: 12px; color: var(--err); margin-top: 2px; }
  th.count, td.count { background: var(--lime-tint); border-left: 3px solid var(--lime); }
  td.count input { width: 72px; font: inherit; font-weight: 700; text-align: right; padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px; background: #fff; font-variant-numeric: tabular-nums; }
  td.count input:focus { outline: 2px solid var(--navy); outline-offset: -1px; }
  td.count input.saving { border-color: var(--slate-dim); }
  td.count input.saved { border-color: var(--ok); }
  td.count input.failed { border-color: var(--err); }
  .diff-ok { color: var(--ok); font-weight: 700; }
  .diff-short { color: var(--err); font-weight: 700; }
  .diff-over { color: var(--warn); font-weight: 700; }
  .up { color: var(--err); } .down { color: var(--ok); }
  tr.not_on_po td { background: var(--err-tint); }
  /* a line that needs checking: not on any PO, or for more than is on order */
  tr.to-check td { background: var(--warn-tint); }
  tr.to-check.not_on_po td { background: var(--err-tint); }
  tr.to-check td:first-child { box-shadow: inset 4px 0 0 var(--warn); }
  tr.to-check.not_on_po td:first-child { box-shadow: inset 4px 0 0 var(--err); }
  .check-flag { display: block; font-size: 12px; font-weight: 700; color: var(--warn); margin-bottom: 2px; }
  .status-tag { font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 6px; white-space: nowrap; }
  .status-tag.open { background: rgba(33,64,154,0.08); color: var(--navy); }
  .status-tag.counted { background: var(--ok-tint); color: var(--ok); }
  .status-tag.received { background: var(--surface); color: var(--slate); }
  details.notes { margin-top: 22px; }
  details.notes summary { cursor: pointer; font-weight: 600; color: var(--navy); }
  details.notes li { margin: 4px 0; }
  .section-title { font-size: 15px; font-weight: 700; margin: 26px 0 10px; }


  /* ============ TABS: shipments, forms ============ */
  .form-row { display: grid; grid-template-columns: 140px 1fr; gap: 10px; align-items: center; margin: 0 0 12px; max-width: 640px; }
  .form-row label { font-weight: 600; color: var(--slate); font-size: 13px; }
  select, input[type=text] { font: inherit; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; background: #fff; color: var(--ink); min-width: 0; }
  select:focus, input[type=text]:focus { outline: 2px solid var(--navy); outline-offset: -1px; }
  .add-panel { max-width: 800px; margin-bottom: 8px; }
  .step-title { font-size: 13px; font-weight: 700; color: var(--navy); letter-spacing: 0.02em; margin: 4px 0 10px; }
  .step-title:not(:first-child) { margin-top: 20px; }
  .add-panel .drop { max-width: none; padding: 24px 20px; }
  .add-panel .file-list, .add-panel .receive-actions { max-width: none; }
  .section-title-row { display: flex; align-items: baseline; gap: 12px; margin: 30px 0 12px; }
  .section-title-row h2 { margin: 0; font-size: 17px; }
  #shipmentList.busy { opacity: 0.55; pointer-events: none; }
  .ship-card { background: var(--paper); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; margin-bottom: 14px; }
  .ship-head { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: flex-start; }
  .ship-title { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; min-width: 0; }
  .ship-name { font-size: 16px; font-weight: 700; word-break: break-word; }
  .ship-name .rename-input { font-size: 15px; font-weight: 600; width: min(380px, 70vw); }
  .ship-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .ship-actions .btn { padding: 7px 12px; font-size: 13px; }
  .ship-meta { color: var(--slate); font-size: 13px; margin: 4px 0 10px; }
  .ship-meta .warn-text { color: var(--err); font-weight: 600; }
  .ship-meta a.warn-text { text-decoration: underline; }
  .link-btn { background: none; border: none; color: var(--navy); font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; padding: 2px 4px; }
  .link-btn:hover { text-decoration: underline; }
  .link-btn.danger { color: var(--err); }
  table.inv-table th, table.inv-table td { padding: 7px 8px; font-size: 13px; }
  table.inv-table td.act { white-space: nowrap; }
  table.inv-table select { padding: 5px 8px; font-size: 12px; max-width: 190px; }
  details.received-ships { margin-top: 18px; }
  details.received-ships summary { cursor: pointer; font-weight: 600; color: var(--navy); margin-bottom: 12px; }
  .picker { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; color: var(--slate-dim); font-weight: 600; }
  .picker select { max-width: 280px; font-size: 13px; padding: 7px 9px; }
  .notice a { color: inherit; font-weight: 700; text-decoration: underline; }
  .notice .fail { color: var(--err); margin-top: 4px; }
  .notice strong { font-weight: 700; }

  /* ============ SHIPMENT EDIT ============ */
  td.ourcode { white-space: nowrap; }
  td.ourcode input { width: 160px; padding: 6px 8px; font-size: 13px; }
  td.ourcode input.saving { border-color: var(--slate-dim); }
  .manual-tag { display: inline-block; font-size: 11px; font-weight: 700; color: var(--navy); background: rgba(33,64,154,0.08); border-radius: 6px; padding: 2px 6px; margin-left: 6px; }
  .edit-intro { max-width: 760px; margin: 0 0 16px; color: var(--slate); }
  #editBody.busy { opacity: 0.55; pointer-events: none; }

  /* ============ Reconciliation: show/hide received and PO qty ============ */
  .filters .switches { margin-left: auto; display: inline-flex; gap: 18px; flex-wrap: wrap; align-items: center; }
  .filters .switch { display: inline-flex; gap: 8px; align-items: center; font-size: 13px; font-weight: 600; color: var(--slate); cursor: pointer; padding: 4px 2px; }
  .filters .switch input { width: 16px; height: 16px; accent-color: var(--navy); cursor: pointer; }
  #invCards.hide-recv .col-recv { display: none; }
  #invCards.hide-poq .col-poq { display: none; }
  td.freight-amt { color: var(--navy); font-weight: 700; }

  .ship-card.clickable { cursor: pointer; transition: border-color 0.15s; }
  .ship-card.clickable:hover { border-color: var(--navy); }
  a.ship-name { color: var(--navy); text-decoration: none; }
  a.ship-name:hover { text-decoration: underline; }
  .group-title { font-size: 15px; font-weight: 700; margin: 26px 0 10px; display: flex; gap: 10px; align-items: baseline; }
  .group-title:first-of-type { margin-top: 4px; }
  .group-title .count { font-weight: 600; color: var(--slate-dim); font-size: 13px; }
  .back-link { display: inline-block; margin: 0 0 14px; font-weight: 600; font-size: 13px; }

  /* ============ LABEL PRINTING ============ */
  .label-tool { display: grid; grid-template-columns: minmax(330px, 450px) minmax(0, 1fr); gap: 24px; align-items: start; background: rgb(233,233,233); border-radius: 16px; padding: 22px; transition: background 0.2s; }
  @media (max-width: 1000px) { .label-tool { grid-template-columns: 1fr; } }
  .lt-grid, .lt-fields { display: grid; grid-template-columns: 128px 1fr; gap: 10px 12px; align-items: center; }
  .lt-grid label, .lt-fields label { font-weight: 600; font-size: 13px; color: var(--slate); }
  .lt-grid input, .lt-grid select, .lt-fields input { width: 100%; }
  #lblScan, #lblQty { font-size: 18px; font-weight: 700; padding: 10px 12px; }
  .lt-fields { margin-top: 16px; padding-top: 16px; border-top: 1px solid rgba(0,0,0,0.14); }
  .lt-fields input { font-size: 14px; }
  .lt-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
  .lt-banner { display: inline-block; font-weight: 700; font-size: 13px; padding: 4px 12px; border-radius: 999px; background: rgba(255,255,255,0.65); margin-bottom: 12px; }
  .lt-msg { margin-top: 12px; font-size: 14px; min-height: 20px; }
  .lt-msg.err { color: var(--err); font-weight: 700; }
  .lt-notes { margin-top: 12px; background: #FFF6E0; border: 1px solid #E8A33D; color: #6B4A12; border-radius: 10px; padding: 10px 14px; font-weight: 600; }
  .lt-also { margin-top: 8px; font-size: 13px; color: var(--slate); }
  .lt-also button { font: inherit; font-size: 12px; font-weight: 700; margin-left: 6px; padding: 2px 8px; border: 1px solid var(--border); border-radius: 999px; background: #fff; cursor: pointer; }
  .lt-sync { margin-top: 14px; font-size: 12px; color: var(--slate); }
  .lt-preview { display: flex; justify-content: center; background: #fff; border-radius: 12px; padding: 18px; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.08); }
  .lt-paper { background: #fff; box-shadow: 0 2px 12px rgba(0,0,0,0.28); overflow: hidden; position: relative; }
  .lt-note { margin-top: 8px; font-size: 12px; color: var(--slate); }
  .lt-settings { margin-top: 14px; background: rgba(255,255,255,0.6); border-radius: 10px; padding: 10px 14px; }
  .lt-settings summary { cursor: pointer; font-weight: 700; color: var(--navy); font-size: 13px; }
  .lt-settings .lt-fields { border-top: 0; padding-top: 0; grid-template-columns: 150px 1fr; }
  .lt-settings .lt-fields input { max-width: 140px; }
  .count-labels { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; background: var(--paper); border: 1px solid var(--border); border-radius: 12px; padding: 10px 14px; margin: 0 0 14px; }
  .count-labels strong { font-size: 14px; }
  .count-labels label { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: var(--slate); }
  .count-labels select { padding: 6px 9px; }
  th.lbl-col, td.lbl-col { white-space: nowrap; }
  .lblcell { display: flex; gap: 6px; align-items: center; justify-content: flex-end; }
  .lblcell input { width: 76px; padding: 6px 8px; font-weight: 700; text-align: right; font-size: 14px; }
  .lblcell .btn { padding: 6px 12px; font-size: 12px; }
  .lbl-status { display: block; font-size: 11px; color: var(--slate); margin-top: 3px; text-align: right; min-height: 14px; }
  .lbl-status.bad { color: var(--err); font-weight: 600; }
  #labelPrint { display: none; }
  @media print {
    .count-labels, th.lbl-col, td.lbl-col { display: none !important; }
    body.printing-labels .shell, body.printing-labels #loginScreen { display: none !important; }
    body.printing-labels #labelPrint { display: block; }
    body.printing-labels { background: #fff; }
    .lbl-page { break-after: page; page-break-after: always; }
    .lbl-page:last-child { break-after: auto; page-break-after: auto; }
  }

  /* ============ Shipment Edit: part number, qty, new lines ============ */
  td.partno input { width: 150px; padding: 6px 8px; font-size: 13px; font-weight: 600; }
  td.qtycell input, td.pricecell input, td.totalcell input { width: 84px; padding: 6px 8px; font-size: 13px; font-weight: 700; text-align: right; }
  td.pricecell input, td.totalcell input { width: 96px; }
  .sort-pick { margin-left: auto; font-size: 13px; color: var(--slate); display: inline-flex; align-items: center; gap: 6px; }
  .sort-pick select { padding: 5px 8px; font-size: 13px; }
  td.partno .sub, td.qtycell .sub, td.pricecell .sub, td.totalcell .sub { display: block; font-size: 12px; color: var(--slate-dim); margin-top: 3px; }
  .edit-tag { display: inline-block; font-size: 11px; font-weight: 700; color: var(--slate); background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 1px 6px; margin-right: 4px; }
  .inv-card > summary .add-line { padding: 7px 12px; font-size: 13px; }
  .flag.edited { color: var(--slate); font-weight: 500; }
  .modal.wide { width: min(520px, 100%); }
  .modal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; }
  .modal-grid .full { grid-column: 1 / -1; }
  .modal-grid .modal-field input { font-size: 15px; font-weight: 500; padding: 9px 10px; }
  .modal-hint { font-size: 12px; color: var(--slate-dim); font-weight: 400; }

  /* ============ FREIGHT (blue) + popup ============ */
  tr.is-freight td { background: rgba(33,64,154,0.11); }
  tr.is-freight td:first-child { box-shadow: inset 4px 0 0 var(--navy); }
  .pill.freightpill { background: rgba(33,64,154,0.14); color: var(--navy); }
  .flag.freight { color: var(--navy); font-weight: 600; }
  .manual-tag.freight { background: var(--navy); color: #fff; }
  .fact.freight-fact { border-color: rgba(33,64,154,0.4); background: rgba(33,64,154,0.06); }
  .fact.freight-fact .value { color: var(--navy); }
  .chip.freight-chip { border-color: rgba(33,64,154,0.4); color: var(--navy); }
  .modal-back { position: fixed; inset: 0; background: rgba(13,27,64,0.55); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 50; }
  .modal { background: var(--paper); border-radius: 14px; padding: 24px 26px; width: min(420px, 100%); box-shadow: 0 20px 60px rgba(13,27,64,0.35); }
  .modal h3 { margin: 0 0 8px; font-size: 18px; }
  .modal p { margin: 0 0 16px; color: var(--slate); }
  .modal-field { display: flex; flex-direction: column; gap: 6px; font-weight: 600; font-size: 13px; color: var(--slate); }
  .modal-field input { font: inherit; font-size: 18px; font-weight: 700; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; color: var(--ink); }
  .modal-err { color: var(--err); font-size: 13px; min-height: 18px; margin-top: 8px; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 10px; }

  /* ============ RECONCILIATION ============ */
  .inv-card { background: var(--paper); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 16px; overflow: hidden; }
  .inv-card > summary { list-style: none; cursor: pointer; padding: 14px 18px; display: flex; justify-content: space-between; gap: 14px; flex-wrap: wrap; align-items: flex-start; border-bottom: 1px solid transparent; }
  .inv-card[open] > summary { border-bottom-color: var(--border); background: #FAFBFD; }
  .inv-card > summary::-webkit-details-marker { display: none; }
  .inv-card .inv-title { font-size: 16px; font-weight: 700; }
  .inv-card .inv-sub { color: var(--slate); font-size: 13px; margin-top: 2px; }
  .inv-card .inv-stats { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: 12px; font-weight: 600; }
  .pill { border-radius: 999px; padding: 4px 10px; background: var(--surface); color: var(--slate); }
  .pill.bad { background: var(--err-tint); color: var(--err); }
  .pill.warn { background: var(--warn-tint); color: var(--warn); }
  .pill.good { background: var(--ok-tint); color: var(--ok); }
  .inv-card .table-wrap { overflow-x: auto; }
  .inv-card tfoot td { font-weight: 700; background: #FAFBFD; border-top: 2px solid var(--border); }
  .inv-card tfoot tr + tr td { border-top: 1px solid var(--border); }
  .inv-card tfoot .tot-verdict td { font-weight: 600; }
  .inv-card tr.tot-adjust td { background: #FFFBF3; border-top: 1px solid var(--border); font-weight: 400; }
  .adjust-box { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
  .adjust-title { font-size: 12px; font-weight: 700; color: var(--warn); }
  .adjust-form { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .adjust-form select, .adjust-form input { padding: 6px 8px; font-size: 13px; }
  .adjust-form input { width: 100px; }
  .inv-card tr.po-head td { background: #EEF3F9; border-top: 2px solid var(--border); font-size: 13px; padding-top: 7px; padding-bottom: 7px; }
  td.po { white-space: nowrap; font-size: 13px; }
  .tot-ok { color: var(--ok); }
  .tot-warn { color: var(--warn); }
  td.note input { width: 100%; min-width: 150px; padding: 6px 8px; font-size: 13px; }
  td.note input:disabled { background: var(--surface); color: var(--slate); }
  td.recv-edit input { width: 76px; font: inherit; font-weight: 700; text-align: right; padding: 5px 7px; border: 1px solid var(--border); border-radius: 6px; background: #fff; }
  td.recv-edit input:focus { outline: 2px solid var(--navy); outline-offset: -1px; }
  td.recv-edit input.saved { border-color: var(--ok); }
  td.recv-edit input.failed { border-color: var(--err); }
  td.recv-edit input:disabled { background: transparent; border-color: transparent; }
  .search-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; margin: 0 0 14px; }
  .search-row input { flex: 1 1 380px; max-width: 560px; padding: 10px 12px; font-size: 15px; border: 1px solid var(--border); border-radius: 8px; background: #fff; }
  .search-row input:focus { outline: 2px solid var(--navy); outline-offset: -1px; }
  tr.done-row { cursor: pointer; }
  tr.done-row:hover td { background: #F4F7FB; }
  tr.done-row td .sub { display: block; font-size: 12px; color: var(--slate-dim); }
  tr.done-row td.act { white-space: nowrap; text-align: right; }
  th.sortable, #stillOpenTable th { cursor: pointer; user-select: none; white-space: nowrap; }
  th.sortable:hover, #stillOpenTable th:hover { color: var(--navy); }
  th.sortable::after, #stillOpenTable th::after { content: ' ↕'; opacity: .35; }
  th[aria-sort="ascending"]::after { content: ' ▲'; opacity: 1; color: var(--navy); }
  th[aria-sort="descending"]::after { content: ' ▼'; opacity: 1; color: var(--navy); }
  .inv-card.sorted tr.po-head { display: none; }
  .scan-panel { position: sticky; top: -24px; z-index: 30; margin: 0 0 16px; padding: 12px 16px; background: #fff; border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 6px 14px -8px rgba(20,30,60,0.35); }
  .scan-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
  .scan-row label { font-weight: 700; color: var(--navy); }
  .scan-row input { flex: 1 1 360px; padding: 12px 14px; font-size: 18px; border: 2px solid var(--navy); border-radius: 8px; }
  .scan-row input:focus { outline: 3px solid var(--ok-tint); }
  .scan-msg { margin-top: 10px; font-size: 14px; color: var(--slate); }
  .scan-msg.bad { color: var(--err); font-weight: 600; }
  .scan-msg.ok { color: var(--ok); font-weight: 600; }
  .scan-msg.warn { color: var(--warn); font-weight: 600; }
  .scan-msg .bad { color: var(--err); }
  .scan-found { margin-top: 10px; padding: 10px 14px; border: 1px solid var(--border); border-left: 6px solid var(--ok); border-radius: 8px; background: #FBFDFB; }
  .scan-found.not_on_po { border-left-color: var(--err); background: var(--err-tint); }
  .scan-found.over { border-left-color: var(--warn); background: var(--warn-tint); }
  .scan-found .scan-code { font-size: 20px; font-weight: 800; color: var(--navy); }
  .scan-found .scan-alt { margin-left: 8px; font-size: 13px; color: var(--slate-dim); font-weight: 600; }
  .scan-found .scan-desc { margin-left: 12px; font-size: 15px; }
  .scan-found .scan-meta { margin-left: 12px; font-size: 13px; color: var(--slate); }
  .scan-found .scan-steps { margin-top: 6px; font-size: 13px; color: var(--slate); display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
  .scan-found .scan-steps .btn { padding: 4px 10px; font-size: 12px; }
  .scan-found .scan-saved { margin-top: 4px; font-size: 14px; color: var(--ok); }
  td.count.scan-focus input { outline: 3px solid var(--ok); outline-offset: 1px; box-shadow: 0 0 0 5px rgba(31,122,69,0.18); }
  .scan-card { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 14px 24px; margin-top: 12px; padding: 14px 16px; border: 1px solid var(--border); border-left: 6px solid var(--ok); border-radius: 8px; background: #FBFDFB; }
  .scan-card.not_on_po { border-left-color: var(--err); background: var(--err-tint); }
  .scan-card.over { border-left-color: var(--warn); background: var(--warn-tint); }
  .scan-code { font-size: 22px; font-weight: 800; color: var(--navy); }
  .scan-code span { margin-left: 10px; font-size: 14px; font-weight: 600; color: var(--slate-dim); }
  .scan-desc { font-size: 16px; margin-top: 2px; }
  .scan-meta { font-size: 13px; color: var(--slate); margin-top: 4px; }
  .scan-entry { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
  .scan-entry label { font-weight: 700; }
  .scan-entry input { width: 120px; padding: 10px 12px; font-size: 22px; font-weight: 800; text-align: right; border: 2px solid var(--navy); border-radius: 8px; }
  .scan-entry input.failed { border-color: var(--err); }
  .scan-list { display: grid; gap: 5px; margin-top: 8px; max-height: 160px; overflow-y: auto; }   /* the box stays at the top of the screen, so a long list scrolls inside it */
  .scan-pick { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 16px; text-align: left; padding: 7px 12px; border: 1px solid var(--border); border-radius: 8px; background: #fff; cursor: pointer; font: inherit; }
  .scan-pick:hover, .scan-pick:focus { border-color: var(--navy); outline: none; background: #F4F7FB; }
  .scan-pick span { color: var(--slate-dim); font-size: 13px; }
  tr.scan-hit td { background: rgba(31,122,69,0.22) !important; box-shadow: inset 0 2px 0 var(--ok), inset 0 -2px 0 var(--ok); }
  tr.scan-cand td { background: rgba(31,122,69,0.10) !important; }
  @media print { .scan-panel { display: none; } }
  .confirm-box { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px; margin: 18px 0 8px; padding: 16px 18px; background: #fff; border: 1px solid var(--border); border-radius: 10px; }
  .confirm-box .muted { font-size: 13px; margin-top: 2px; }
  #confirmBtn.ready { box-shadow: 0 0 0 3px var(--ok-tint); }
  @media print { .confirm-box { display: none; } }
  td.note input.saved { border-color: var(--ok); }
  td.note input.failed { border-color: var(--err); }
  td.var { white-space: nowrap; }
  .var-short { color: var(--err); font-weight: 700; }
  .var-over { color: var(--warn); font-weight: 700; }
  tr.has-qty-var td { background: rgba(179,38,30,0.045); }

  @media (max-width: 860px) {
    .sidebar { display: none; }
    .content { padding: 16px; }
    .scan-panel { top: -16px; }
    .topbar { padding: 10px 16px; }
    .hide-sm { display: none; }
    .mobile-nav { display: flex !important; }
  }
  .mobile-nav { display: none; gap: 6px; }
  @media print {
    .sidebar, .topbar-right, .filters, details.notes, .no-print, .mobile-nav, .picker { display: none !important; }
    .inv-card { break-inside: avoid; }
    .inv-card:not([open]) > :not(summary) { display: block; }
    .shell, .main, .content { height: auto; overflow: visible; display: block; }
    body { background: #fff; font-size: 11px; }
    table.grid th { position: static; }
    tr[hidden] { display: table-row !important; }
    td.count input { border: 1px solid #000; }
  }
</style>
</head>

  // ---------- EAN-13 ----------
  // The workbook builds its barcode from the first 12 digits and works out the check digit itself,
  // so a stored 13th digit is never trusted. Same here.
  function eanCheckDigit(d12) {
    let even = 0, odd = 0
    for (let i = 0; i < 12; i++) (i % 2 ? (even += +d12[i]) : (odd += +d12[i]))
    return (10 - ((even * 3 + odd) % 10)) % 10
  }
  // Returns the 13 digits to print, or null when the stored barcode can't make an EAN-13.
  // 13 digits: first 12 are kept and the check digit is recalculated.
  // 12 digits (UPC-A): printed as EAN-13 with a leading 0. (The workbook's formula prints nothing for these.)
  function ean13Digits(barcode) {
    const s = String(barcode ?? '').trim()
    if (!/^\d+$/.test(s)) return null
    let d12
    if (s.length === 13) d12 = s.slice(0, 12)
    else if (s.length === 12) d12 = '0' + s.slice(0, 11)
    else return null
    return d12 + eanCheckDigit(d12)
  }
  const EAN_L = ['0001101', '0011001', '0010011', '0111101', '0100011', '0110001', '0101111', '0111011', '0110111', '0001011']
  const EAN_G = ['0100111', '0110011', '0011011', '0100001', '0011101', '0111001', '0000101', '0010001', '0001001', '0010111']
  const EAN_R = ['1110010', '1100110', '1101100', '1000010', '1011100', '1001110', '1010000', '1000100', '1001000', '1110100']
  // Which of the six left-hand digits use the G (second) code set, by the first digit
  const EAN_PARITY = ['LLLLLL', 'LLGLGG', 'LLGGLG', 'LLGGGL', 'LGLLGG', 'LGGLLG', 'LGGGLL', 'LGLGLG', 'LGLGGL', 'LGGLGL']
  // The 95 bar/space modules ('1' = bar) for 13 digits
  function ean13Modules(d13) {
    const first = +d13[0], pat = EAN_PARITY[first]
    let m = '101'
    for (let i = 0; i < 6; i++) m += (pat[i] === 'L' ? EAN_L : EAN_G)[+d13[1 + i]]
    m += '01010'
    for (let i = 0; i < 6; i++) m += EAN_R[+d13[7 + i]]
    return m + '101'
  }
  
  // SVG of one barcode, drawn directly in millimetres: `module` is the width of one bar module and `H` the total height
  // (bars, the longer guard bars and the digits underneath). Width and height are independent, so a wider barcode does not
  // have to be a taller one.
  function barcodeSvg(d13, module, H = 10) {
    const W = 113 * module                                   // 95 bar modules plus the quiet zones (11 left, 7 right)
    const digitH = Math.min(2.3, Math.max(1.3, H * 0.2))     // height of the digits under the bars
    const guardExt = digitH * 0.45
    const barH = Math.max(1, H - digitH * 1.2 - 0.3)
    const mods = ean13Modules(d13)
    const guard = i => i < 3 || (i >= 45 && i < 50) || i >= 92
    let bars = ''
    for (let i = 0; i < 95; ) {
      if (mods[i] !== '1') { i++; continue }
      let j = i; while (j < 95 && mods[j] === '1' && guard(j) === guard(i)) j++
      bars += `<rect x="${((11 + i) * module).toFixed(3)}" y="0" width="${((j - i) * module).toFixed(3)}" height="${(barH + (guard(i) ? guardExt : 0)).toFixed(3)}"/>`
      i = j
    }
    // the digits, spread evenly across each half the way a printed EAN-13 does
    const ty = H - 0.25
    const txt = (x, str, len) => `<text x="${(x * module).toFixed(3)}" y="${ty.toFixed(3)}" font-size="${digitH.toFixed(3)}" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"${len ? ` textLength="${(len * module).toFixed(3)}" lengthAdjust="spacing"` : ''}>${str}</text>`
    const text = txt(5, d13[0]) + txt(11 + 3 + 21, d13.slice(1, 7), 38) + txt(11 + 50 + 21, d13.slice(7), 38)
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W.toFixed(3)} ${H.toFixed(3)}" width="${W.toFixed(3)}mm" height="${H.toFixed(3)}mm" fill="#000" shape-rendering="crispEdges">${bars}${text}</svg>`
  }

  // Colour cue for items flagged in MYOB as needing a pre-label (STOCK_ITEMS.X_PRE_LABEL), as on the workbook's form
  const PRE_LABEL_COLOURS = { 1: { name: 'Blue', rgb: 'rgb(60,166,232)' }, 2: { name: 'Green', rgb: 'rgb(19,236,155)' }, 3: { name: 'Red', rgb: 'rgb(237,81,99)' } }
  const preLabelColour = n => PRE_LABEL_COLOURS[+n] || { name: '', rgb: 'rgb(233,233,233)' }

  const lblEsc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
  
  // The settings a PC can change (stored on that PC): paper size, nudge, scale and barcode size.
  // The layout is shrunk to fit inside the label (never enlarged), as the workbook's fit-to-one-page setting did,
  // then centred on the label. offsetX / offsetY nudge it from there.
  function labelGeometry(type, s = {}) {
    const t = LABEL_TYPES[type]
    const pageW = s.pageW || t.page.w, pageH = s.pageH || t.page.h
    const fit = Math.min(1, (pageW - 2 * t.margin) / t.area.w, (pageH - 2 * t.margin) / t.area.h)
    const scale = s.scale ? s.scale / 100 : fit
    return {
      pageW, pageH, scale,
      x: (pageW - t.area.w * scale) / 2 + (s.offsetX || 0),
      y: (pageH - t.area.h * scale) / 2 + (s.offsetY || 0),

  // by default, times the width setting) and is kept inside the label. Height is the height of the barcode's own row, times the
  // height setting, but never more than that row, so a bigger barcode can't grow up over the text above it (such as the bin
  // location). A barcode wider than its cell grows leftwards from the cell's right edge. Text marked `beside` makes room.
  function barcodeBox(type, settings = {}) {
    const t = LABEL_TYPES[type], it = t.items.find(x => x.k === 'barcode'), g = labelGeometry(type, settings), k = g.scale
    const em = it.pt * LBL_PT_MM
    // the furthest right the barcode may reach: the label's right edge less a small gap (so it can use the margin beside the layout)
    const rightLimit = Math.max(it.x + it.w, (g.pageW - BARCODE_EDGE_GAP - g.x) / k)

  // CSS shared by the preview and the printed pages
  const LABEL_CSS = `
  .lbl-page{position:relative;background:#fff;overflow:hidden;color:#000}
  .lbl-inner{position:absolute}
  .lbl-el{position:absolute;display:flex;box-sizing:border-box}

  // ============================================================
  // CAMA Receiving - core logic (no DOM, no Supabase)
  // Readers: MYOB PO export, BBT Excel, ratioparts PDF text, Azure JSON
  // Matcher: invoice lines -> PO lines
  // ============================================================
  
  // ---------- small helpers ----------
  const normCode = c => String(c ?? '').toUpperCase().replace(/[^A-Z0-9]/g, '')
  
  function codeStr(v) {
    if (v === null || v === undefined) return ''
    if (typeof v === 'number' && Number.isInteger(v)) return String(v)
    return String(v).trim()
  }
  
  function num(v) {
    if (v === null || v === undefined || v === '') return null
    if (typeof v === 'number') return v
    const n = parseFloat(String(v).replace(/,/g, ''))
    return Number.isFinite(n) ? n : null
  }
  
  const pad = n => String(n).padStart(2, '0')
  function isoDate(v) {
    if (!v) return ''
    if (v instanceof Date && !isNaN(v)) return `${v.getFullYear()}-${pad(v.getMonth() + 1)}-${pad(v.getDate())}`
    return String(v)
  }
  
  function addDays(iso, days) {
    const d = new Date(iso + 'T00:00:00')
    d.setDate(d.getDate() + days)
    return isoDate(d)
  }
  
  const allText = grid => grid.map(r => r.filter(v => v !== '' && v !== null && v !== undefined).join(' ')).join('\n')
  
  // ============================================================
  // MYOB PO export
  // ============================================================
  const PO_COLUMNS = {
    po: ['seqno', 'po', 'ponumber', 'purchaseorder', 'orderno'],
    order_date: ['orderdate'],
    due_date: ['duedate'],
    supplier: ['name', 'suppliername'],
    currency: ['currcode', 'currency'],
    stock_code: ['stockcode'],
    supplier_code: ['suppliercode', 'supplierstockcode'],
    desc: ['description'],
    qty: ['ord_quant', 'ordquant', 'qtyordered', 'qty'],
    price: ['unitprice'],
    bin: ['bincode', 'bin'],
    line_id: ['polineid', 'lineid'],
    gtin: ['gtin', 'barcode', 'barcode1', 'ean', 'upc'],
  }
  const headKey = h => String(h ?? '').toLowerCase().replace(/[^a-z0-9_]/g, '')
  
  function findPoHeader(grid) {
    for (let r = 0; r < Math.min(10, grid.length); r++) {
      const keys = (grid[r] || []).map(headKey)
      const cols = {}
      for (const [field, names] of Object.entries(PO_COLUMNS)) {
        const i = keys.findIndex(k => names.includes(k))
        if (i >= 0) cols[field] = i
      }
      if ('po' in cols && 'stock_code' in cols && 'qty' in cols) return { row: r, cols }
    }
    return null
  }
  
  function readPoExport(grid, hdr, source) {
    const out = []
    for (const row of grid.slice(hdr.row + 1)) {
      const get = f => (f in hdr.cols ? row[hdr.cols[f]] : null)
      const po = codeStr(get('po')), stock = codeStr(get('stock_code'))
      if (!po || !stock) continue
      out.push({
        po, stock_code: stock,
        order_date: isoDate(get('order_date')), due_date: isoDate(get('due_date')),

        const joined = row.filter(v => v !== '' && v != null).join(' ')
        if (/^\s*Total\s*:/i.test(joined) || row.some(v => String(v ?? '').trim().toLowerCase().startsWith('total:'))) {
          const nums = row.filter(isNum)
          invoice_total = nums.length ? nums[nums.length - 1] : null

        if (nums.length < 3) { notes.push(`Item ${code}: could not read qty/price/amount.`); continue }
        const [qty, price, amount] = nums
        const pm = joined.match(/P\/?O\s*No\.?\s*(\w+)/i)

        lines.push({
          po: pm ? pm[1] : '', code,
          our_code: cols.our_code != null ? codeStr(row[cols.our_code]) : '',
          desc: codeStr(row[cols.desc]), qty, price, total: amount,
        })
      }
      const pos = [...new Set(lines.map(l => l.po).filter(Boolean))]
      const count = p => lines.filter(l => l.po === p).length
      const main = pos.length ? pos.reduce((a, b) => (count(b) > count(a) ? b : a)) : ''
      const po = pos.length ? [main, ...pos.filter(p => p !== main)].join(', ') : ''

    },

  // HTS Spares Ltd (UK) commercial invoice, Excel. Values are stored as text

  const cellText = v => (v === null || v === undefined ? '' : String(v).trim())

  function findLabel(grid, re) {
    for (let r = 0; r < grid.length; r++) for (let c = 0; c < (grid[r] || []).length; c++) if (re.test(cellText(grid[r][c]))) return { r, c }
    return null

    return null

  const dmyToIso = s => { const m = String(s || '').match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/); return m ? `${m[3]}-${pad(+m[2])}-${pad(+m[1])}` : '' }
  
  const HTS = {

        if ('product' in labels && 'description' in labels && 'quantity' in labels) {

        lines.push({ po, code: first, our_code: '', desc: cellText(row[cols.desc]), qty, price, total })

      } else notes.push('No invoice total found.')
      if (!po) notes.push('No PO number found on the invoice.')

    },

  // Desert Rotary Corporation: the air-freight line list they send as a spreadsheet (a query export, "CAMA PRODUCTS / AIR FREIGHT").
  // It is not one invoice: every row carries the Rotary invoice number (INV#) it comes from, so each INV# becomes its own invoice
  // (numbered as Rotary prints them on the PDF invoice: IN + the INV#), all on the same PO. The sheet has no PO, date, currency or totals, so: the PO (a 5-digit number) and the date (Oct_16_2026)
  // are read from the FILE NAME, the currency is assumed USD, and each invoice's total is added up from its lines.
  const ROTARY_LIST = {
    name: 'Rotary Corporation',
    detect: grid => grid.slice(0, 12).some(r => {

    parse(grid, source) {
      let hdr = -1, cols = {}
      for (let i = 0; i < Math.min(grid.length, 12); i++) {
        const labels = {}
        ;(grid[i] || []).forEach((v, c) => { const t = cellText(v).toUpperCase(); if (t && !(t in labels)) labels[t] = c })
        if (['INV#', 'ITEM', 'QTY', 'DESCRIPTION', 'PRICE', 'TOTAL'].every(h => h in labels)) { hdr = i; cols = { inv: labels['INV#'], item: labels['ITEM'], qty: labels['QTY'], desc: labels['DESCRIPTION'], price: labels['PRICE'], total: labels['TOTAL'] }; break }
      }
      if (hdr < 0) throw new Error('Could not find the Rotary heading row')
      const name = String(source || '')
      const po = (name.match(/(?<![0-9])(\d{5})(?![0-9])/) || [])[1] || ''
      const dm = name.match(/(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*[ _-]+(\d{1,2})[ _,-]+(\d{4})/i)
      const invoice_date = dm ? isoDate(new Date(+dm[3], MONTHS[dm[1].toUpperCase()], +dm[2])) : ''
      const groups = new Map(), problems = []
      for (const row of grid.slice(hdr + 1)) {
        const inv = codeStr(row[cols.inv]), code = codeStr(row[cols.item]), qty = num(row[cols.qty])
        if (!inv || !code || qty === null) continue
        const price = num(row[cols.price]), total = num(row[cols.total])
        if (price !== null && total !== null && Math.abs(qty * price - total) > 0.011) problems.push(`Invoice ${inv} item ${code}: ${qty} x ${price} = ${(qty * price).toFixed(2)}, the list shows ${total.toFixed(2)}.`)
        if (!groups.has(inv)) groups.set(inv, [])
        groups.get(inv).push({ po, code, our_code: '', desc: cellText(row[cols.desc]), qty, price, total })
      }
      const out = [...groups].map(([invoice_no, lines]) => ({
        supplier: this.name, po, invoice_no: 'IN' + invoice_no, invoice_date, due_date: '', currency: 'USD',
        invoice_total: Math.round(lines.reduce((a, l) => a + (l.total || 0), 0) * 100) / 100,
        lines, notes: [], source,
      }))
      if (out.length) {
        out[0].notes.push(`This file lists ${out.length} Rotary invoice${out.length === 1 ? '' : 's'} (the INV# column), each added as its own invoice. The same notes apply to all of them.`,
          po ? `PO ${po} was taken from the file name.` : 'No PO number found: put the 5-digit PO number in the file name.',
          invoice_date ? `Invoice date ${invoice_date} was taken from the file name.` : 'No date found in the file name.',
          'The list has no currency, so USD is assumed. Invoice totals are added up from the lines.', ...problems)

  const EXCEL_PROFILES = [BBT, HTS, ROTARY_LIST]
  
  // ============================================================
  // ratioparts PDF (text layer, via pdf.js lines [{text, x0}])
  // ============================================================
  const euNum = s => (s ? parseFloat(s.replace(/\./g, '').replace(',', '.')) : null)
  const euDate = s => { const m = (s || '').match(/^(\d{2})\.(\d{2})\.(\d{2,4})$/); if (!m) return s || ''; const y = m[3].length === 2 ? '20' + m[3] : m[3]; return `${y}-${m[2]}-${m[1]}` }
  const firstToken = (text, label) => {
    const esc = label.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')
    const m = text.match(new RegExp(esc + '\\s*([^\\n]*?)(?:\\s{2,}|\\n|$)'))
    return m && m[1].trim() ? m[1].trim().split(/\s+/)[0] : ''
  }
  const ROW_RE = /^(\d+)\s+(?:(\*)\s+)?(\S+)\s+(.*?)\s+(\d+(?:,\d+)?)\s+(\d{8})\s+([A-Z]{2})\s+([\d.]*\d,\d+)\s+([\d.]*\d,\d+)\s+([\d.]*\d,\d+)$/
  
  const RATIOPARTS = {
    name: 'ratioparts Ersatzteile-Vertriebs GmbH',
    detect: firstPageText => /ratioparts/i.test(firstPageText),
    parse(pages, source) {
      const invoices = new Map()
      pages.forEach((page, pi) => {
        const text = page.text
        let invNo = ''
        for (const l of page.lines) { const m = l.text.match(/^(\d+)\/(\d+)$/); if (m) { invNo = m[2]; break } }
        if (!invNo) invNo = firstToken(text, 'Invoice No.:')
        if (!invNo) return
        if (!invoices.has(invNo)) {
          let po = firstToken(text, 'External Document No.:').replace(/^#/, '') || firstToken(text, 'Reference No.:').replace(/^#/, '')
          const cur = text.match(/Total ([A-Z]{3}) without/)
          invoices.set(invNo, {
            supplier: this.name, invoice_no: invNo, po,
            invoice_date: euDate(firstToken(text, 'Document Date:')), due_date: euDate(firstToken(text, 'Due Date:')),
            currency: cur ? cur[1] : 'EUR', invoice_total: null, lines: [], notes: [], source, _pages: [],
          })
        }
        const inv = invoices.get(invNo)
        const tot = text.match(/Total [A-Z]{3} without VAT\s+([\d.]*\d,\d+)/)
        if (tot) inv.invoice_total = euNum(tot[1])
        const pg = text.match(/Page (\d+) of (\d+)/)
        if (pg) inv._pages.push([+pg[1], +pg[2]])
  
        let inTable = false, current = null
        for (const l of page.lines) {
          const t = l.text.trim()
          if (t.startsWith('Pos LTA Itemno.')) { inTable = true; continue }
          if (!inTable) continue
          if (/^(Total |Bank|VAT Amount)/.test(t) || t.includes('Itemposition')) break
          if (t === 'y') continue
          const m = t.match(ROW_RE)
          if (m) {
            current = {
              po: inv.po, pos: +m[1], code: m[3].replace(/\/\d+$/, '').toUpperCase(), our_code: '',
              desc: m[4].trim(), qty: euNum(m[5]), price: euNum(m[8]), total: euNum(m[10]),
            }
            inv.lines.push(current)
          } else if (current && l.x0 > 100 && l.x0 < 290) {
            current.desc = (current.desc + (current.desc.endsWith('-') ? '' : ' ') + t).trim()
          }
        }
      })
      const out = [...invoices.values()]
      for (const inv of out) {
        if (inv._pages.length) {
          const exp = inv._pages[0][1], seen = new Set(inv._pages.map(p => p[0]))
          const missing = []; for (let i = 1; i <= exp; i++) if (!seen.has(i)) missing.push(i)
          if (missing.length) inv.notes.push(`Missing page(s) ${missing.join(', ')} of ${exp}.`)
        }
        delete inv._pages
        if (!inv.po) inv.notes.push('No PO number found on the invoice.')
        const sum = inv.lines.reduce((s, l) => s + (l.total || 0), 0)
        if (inv.invoice_total == null) inv.notes.push('No invoice total found.')
        else if (Math.abs(sum - inv.invoice_total) > 0.005) inv.notes.push(`Lines add up to ${sum.toFixed(2)} but the invoice total is ${inv.invoice_total.toFixed(2)}.`)
        for (const l of inv.lines) {
          const tol = Math.max(0.02, l.qty * 0.005)
          if (Math.abs(l.qty * l.price - l.total) > tol + 1e-9) inv.notes.push(`Item ${l.code}: ${l.qty} x ${l.price} = ${(l.qty * l.price).toFixed(2)}, invoice shows ${l.total}.`)
        }
      }
      return out
    },
  }
  
  // Rotary Corporation PDF invoice (text layer). The column headings on this form are drawn graphics, not text, so the
  // columns are found by where each word sits on the page. Only the VENDOR ITEM column is the part number: the line number, the
  // item class ("Clss:19"), the HS code and the unit weight on the line underneath are all ignored. The Customer Ref # column is
  // kept as our_code (it is the code Cama uses). Lines on the "Back Order Summary" were not shipped, so they are not read as lines.
  const ROTARY_COLS = [['coo', 56], ['line', 74], ['item', 130], ['ref', 205], ['ord', 250], ['ship', 300], ['canc', 318], ['desc', 472], ['price', 515], ['amt', Infinity]]
  const rotaryCol = x => ROTARY_COLS.find(([, max]) => x < max)[0]
  const rotaryNum = t => { const n = parseFloat(String(t || '').replace(/,/g, '')); return Number.isFinite(n) ? n : null }
  const rotaryDate = s => { const m = (s || '').match(/(\d{2})\/(\d{2})\/(\d{4})/); return m ? `${m[3]}-${m[1]}-${m[2]}` : '' }
  const rotaryAddDays = (iso, n) => { if (!iso) return ''; const d = new Date(iso + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10) }
  function rotaryCells(line) {
    const cells = {}
    for (const it of line.items || []) { const c = rotaryCol(it.x); cells[c] = cells[c] ? cells[c] + ' ' + it.str.trim() : it.str.trim() }
    return cells
  }
  
  // The row of figures under the heading band on a Rotary invoice (the headings are graphics, so only the figures are text):
  // Order Total, Discount, Sales Tax, Freight, Svc Chg and Total, found by where each sits across the page.
  function rotaryBand(page) {
    const row = page.lines.find(l => l.items.length >= 2 && l.items.every(i => /^[\d,]*\.\d{2}$/.test(i.str.trim())) && l.items.at(-1).x >= 500)   // ".76" is a number too
    if (!row) return null
    const b = { orderTotal: 0, discount: 0, tax: 0, freight: 0, svc: 0 }
    for (const it of row.items.slice(0, -1)) {
      const v = rotaryNum(it.str)
      if (it.x < 150) b.orderTotal = v; else if (it.x < 240) b.discount = v; else if (it.x < 330) b.tax = v; else if (it.x < 395) b.freight = v; else b.svc = v
    }
    b.total = rotaryNum(row.items.at(-1).str)
    return b
  }
  
  const ROTARY_PDF = {
    name: 'Rotary Corporation',
    detect: firstPageText => /Rotary Corporation/i.test(firstPageText) && /\bIN\d{6,}\b/.test(firstPageText),
    parse(pages, source) {
      const invoices = new Map()
      for (const page of pages) {
        const invNo = (page.text.match(/\bIN\d{6,}\b/) || [])[0]
        if (!invNo) continue
        if (!invoices.has(invNo)) {
          const invoice_date = rotaryDate(page.text)
          const po = (page.text.match(new RegExp(invNo + '\\s+(\\d{4,})\\b')) || [])[1] || ''
          const terms = page.text.match(/NET\s+(\d+)\s+DAY/i)
          const tot = page.lines.map(l => l.text.match(/^([\d,]+\.\d{2})(?:\s+([\d,]+\.\d{2}))?$/)).find(Boolean)
          invoices.set(invNo, {
            supplier: this.name, po, invoice_no: invNo, invoice_date, due_date: terms ? rotaryAddDays(invoice_date, +terms[1]) : '', currency: 'USD',
            invoice_total: tot ? rotaryNum(tot[2] || tot[1]) : null, lines: [], notes: [], source, _backorder: [],
            _band: rotaryBand(page),
          })
        }
        const inv = invoices.get(invNo)
        if (inv.due_date === '') { const t = page.text.match(/NET\s+(\d+)\s+DAY/i); if (t) inv.due_date = rotaryAddDays(inv.invoice_date, +t[1]) }
        let backOrder = false
        for (const line of page.lines) {
          if (/Back Order Summary/i.test(line.text)) { backOrder = true; continue }
          if (/\*\*\* INVOICE END \*\*\*/.test(line.text)) break
          const c = rotaryCells(line)
          if (!/^\d{1,4}$/.test(c.line || '') || !c.item || /^Clss:/i.test(c.item)) continue
          if (backOrder) {   // if the heading is ever real text: "line, item, customer ref, B/O qty, description", not shipped on this invoice
            const q = rotaryNum(c.canc); if (q) inv._backorder.push(`${c.item} x${q}`)
            continue
          }
          const qty = rotaryNum(c.ship), price = rotaryNum(c.price), total = rotaryNum(c.amt)
          if (qty === null && price === null && total === null) {   // a back-order row: only a B/O quantity, nothing shipped or priced (the heading is a graphic, not text)
            const q = rotaryNum(c.canc); if (q) inv._backorder.push(`${c.item} x${q}`)
            continue
          }
          if (qty === null || price === null || total === null) continue
          inv.lines.push({
            po: inv.po, pos: +c.line, code: c.item, our_code: (c.ref || '').replace(/\.$/, ''),
            desc: (c.desc || '').trim(), qty, price, total,
          })

      }
      const out = [...invoices.values()]
      for (const inv of out) {
        if (!inv.po) inv.notes.push('No PO number found on the invoice.')
        inv.notes.push('The currency is not in the invoice text, so USD is assumed.')
        const sum = Math.round(inv.lines.reduce((a, l) => a + l.total, 0) * 100) / 100
        // Under the heading band: Order Total, Discount, Sales Tax, Freight, Svc Chg, then the invoice Total. The lines add up to the
        // Order Total; a discount comes off it, and tax, freight and a service charge are added, to reach the Total.
        const band = inv._band
        let adjust = 0
        if (band && band.total != null) inv.invoice_total = band.total
        if (band) {
          const parts = [['discount', -band.discount], ['sales tax', band.tax], ['freight', band.freight], ['service charge', band.svc]].filter(([, v]) => v)
          const explained = Math.round((sum + parts.reduce((a, [, v]) => a + v, 0)) * 100) / 100
          if (parts.length && inv.invoice_total != null && Math.abs(explained - inv.invoice_total) <= 0.015 && Math.abs(sum - band.orderTotal) <= 0.015) {
            adjust = Math.round(parts.reduce((a, [, v]) => a + v, 0) * 100) / 100
            inv.adjust = { amount: adjust, label: parts.map(([l]) => l).join(' and ') }
            inv.notes.push(`The lines add up to the order total of ${band.orderTotal.toFixed(2)}. ${parts.map(([l, v]) => v < 0 ? `A ${l} of ${Math.abs(v).toFixed(2)} is taken off it` : `${l[0].toUpperCase()}${l.slice(1)} of ${Math.abs(v).toFixed(2)} is added`).join(', ')}, so the invoice total is ${inv.invoice_total.toFixed(2)}.`)
          }
        }
