      shipOptionsCache = { at: Date.now(), rows: all }
      const data = all.filter(s => s.status !== 'received')   // finished shipments are in Completed Shipments
      if (!data.length) {
        content.innerHTML = all.length
          ? `<div class="empty-state">Nothing to reconcile right now. Finished shipments are in <a href="#/completed">Completed Shipments</a>.</div>`
          : `<div class="empty-state">No shipments yet. <a href="#/invoices">Add invoices in Invoice Creation</a>.</div>`
        return
      }
      const group = (title, list) => !list.length ? '' : `<div class="group-title">${title}<span class="count">${list.length}</span></div>${list.map(s => listCardHtml(s, 'reconcile')).join('')}`
      content.innerHTML = group('Counted: ready to reconcile', data.filter(s => s.status === 'counted'))
        + group('Open: still being counted', data.filter(s => s.status === 'open'))
      wireCardClicks()
    } catch (e) { content.innerHTML = `<div class="notice err">${esc(friendlyDbError(e))}</div>` }
  }

  async function showReconcile(id) {
    rememberShipment(id)
    renderSidebar('reconcile')
    setTop('Loading…')
    content.innerHTML = `<div class="empty-state">Loading shipment…</div>`
    try {
      const [sh, lines] = await Promise.all([getFullShipment(id), fetchLines(id), shipmentOptions()])
      if (!shipOptionsCache.rows.some(r => r.id === id)) shipOptionsCache.rows.unshift(sh)
      recon = { shipment: sh, lines }
      renderReconcile()
    } catch (e) { setTop('Shipment Reconciliation'); content.innerHTML = `<div class="notice err">${esc(friendlyDbError(e))}</div>` }
  }

  function invoiceGroups() {
    const { shipment: sh, lines } = recon
    const map = new Map()
    for (const l of lines) { const k = `${l.supplier}|${l.invoice_no}`; if (!map.has(k)) map.set(k, []); map.get(k).push(l) }
    const order = sortInvoicesForReconciliation(sh.invoices || [], sh.po_lines || []).map(invKey)   // oldest PO first, then lowest value
    for (const k of map.keys()) if (!order.includes(k)) order.push(k)
    return order.filter(k => map.has(k)).map(k => {
      const inv = (sh.invoices || []).find(i => invKey(i) === k) || {}
      const ls = map.get(k).slice().sort((a, b) => comparePoThenPart(a, b, recon.shipment.invoices))
      return { key: k, inv, lines: ls, invoice_no: inv.invoice_no || ls[0].invoice_no, supplier: inv.supplier || ls[0].supplier }
    })
  }

  function renderReconcile() {
    const { shipment: sh, lines } = recon
    const groups = invoiceGroups()
    const tagCount = t => lines.filter(l => lineTags(l).includes(t)).length
    const goods = lines.filter(l => !isFreightFlags(l.flags))
    const counted = goods.filter(isCounted).length
    const frByCur = new Map()
    for (const inv of sh.invoices || []) for (const ln of inv.lines) if (ln.is_freight) frByCur.set(inv.currency || '', (frByCur.get(inv.currency || '') || 0) + (+ln.freight_amount || 0))
    const freightText = [...frByCur].map(([c, n]) => moneyText(c, n)).join(' + ')
    const received = sh.status === 'received'
    setTop(shipName(sh), `Shipment Reconciliation · ${plural(groups.length, 'invoice')} · ${statusTag(sh.status).replace(/<[^>]+>/g, '')}`,
      `${pickerHtml(sh.id, 'reconcile')}
       <button class="btn" id="dlBtn">Download reconciliation</button>
       <button class="btn ghost" id="printBtn">Print</button>
       ${sh.status === 'open' ? `<a class="btn ghost" href="#/count/${sh.id}">← Count</a>` : sh.status === 'counted' ? '<button class="btn ghost" id="reopenCountBtn" type="button">Reopen count</button>' : ''}
       <button class="btn ${received ? 'ghost' : ''}" id="statusBtn">${received ? 'Reopen shipment' : 'Complete shipment'}</button>`)
    wirePicker('reconcile')

    const chip = (f, label, n, issue) => `<button class="chip ${issue && n ? 'issue' : ''}" data-f="${f}" aria-pressed="false">${label}<b>${n}</b></button>`
    content.innerHTML = `
      <a class="back-link" href="#/reconcile">← All shipments</a>
      ${received ? `<div class="notice ok">This shipment is completed${sh.summary?.completed_at ? ` (${esc(fmtWhen(sh.summary.completed_at))}${sh.summary.completed_by ? ` by ${esc(sh.summary.completed_by)}` : ''})` : ''}. It is listed in <a href="#/completed">Completed Shipments</a>.</div>` : ''}
      ${counted < goods.length ? `<div class="notice warn" id="uncountedNotice">${uncountedNoticeHtml(goods.length - counted, sh)}</div>` : ''}
      <div class="facts">
        <div class="fact"><div class="label">Invoices</div><div class="value">${groups.length}</div></div>
        <div class="fact"><div class="label">Lines</div><div class="value">${lines.length}</div></div>
        <div class="fact"><div class="label">Counted</div><div class="value" id="fCounted">${counted} of ${goods.length}</div></div>
        <div class="fact"><div class="label">Quantity variances</div><div class="value" id="fQty" style="color:${tagCount('qty') ? 'var(--err)' : 'inherit'}">${tagCount('qty')}</div></div>
        <div class="fact"><div class="label">PO exceptions</div><div class="value" id="fPo" style="color:${tagCount('po') ? 'var(--err)' : 'inherit'}">${tagCount('po')}</div></div>
        <div class="fact"><div class="label">Price changes</div><div class="value">${tagCount('price')}</div></div>
        ${freightText ? `<div class="fact freight-fact"><div class="label">Freight</div><div class="value">${esc(freightText)}</div></div>` : ''}
      </div>
      <div class="filters" role="group" aria-label="Show lines">
        ${chip('all', 'All lines', lines.length, false).replace('aria-pressed="false"', 'aria-pressed="true"')}
        ${chip('qty', 'Quantity variances', tagCount('qty'), true)}
        ${chip('po', 'PO exceptions', tagCount('po'), true)}
        ${chip('price', 'Price changes', tagCount('price'), false)}
        ${chip('uncounted', 'Not counted', tagCount('uncounted'), false)}
        ${chip('noted', 'With notes', tagCount('noted'), false)}
        ${tagCount('freight') ? chip('freight', 'Freight', tagCount('freight'), false).replace('class="chip ', 'class="chip freight-chip ') : ''}
        <span class="switches">
          <label class="switch" title="Hide or show the Received column"><input type="checkbox" id="recvToggle" ${showRecv ? 'checked' : ''}> Show received</label>
          <label class="switch" title="Hide or show the PO qty column"><input type="checkbox" id="poqToggle" ${showPoq ? 'checked' : ''}> Show PO qty</label>
        </span>
      </div>
      <div id="invCards" class="${[showRecv ? '' : 'hide-recv', showPoq ? '' : 'hide-poq'].join(' ').trim()}">${groups.map(invCardHtml).join('') || '<div class="empty-state">No invoices in this shipment.</div>'}</div>
      ${stillOpenHtml(sh.still_open)}
      <details class="notes">
        <summary>Files and notes</summary>
        <ul>
          ${(sh.files || []).map(f => `<li>${f.path ? `<a href="#" data-path="${esc(f.path)}" class="file-link">${esc(f.name)}</a>` : esc(f.name)}: ${esc(f.summary)}</li>`).join('')}
          ${(sh.problems || []).map(p => `<li>${esc(p.name)}: ${esc(p.error)}</li>`).join('')}
          ${(sh.invoices || []).flatMap(inv => (inv.notes || []).map(n => `<li>Invoice ${esc(inv.invoice_no)}: ${esc(n)}</li>`)).join('')}
        </ul>
      </details>`
    content.querySelectorAll('.filters .chip').forEach(b => b.onclick = () => {
      content.querySelectorAll('.filters .chip').forEach(x => x.setAttribute('aria-pressed', x === b))
      applyReconFilter(b.dataset.f)
    })
    wireReconInputs(content)
    wireStillOpenSort()
    applyReconSort(content)   // a sort chosen earlier carries over
    if ($('reopenCountBtn')) $('reopenCountBtn').onclick = () => reopenCount(sh.id, shipName(sh))
    content.querySelectorAll('.file-link').forEach(a => a.onclick = async ev => {
      ev.preventDefault()
      const { data, error } = await supabase.storage.from(BUCKET).createSignedUrl(a.dataset.path, 300)
      if (data?.signedUrl) window.open(data.signedUrl, '_blank'); else alert(error?.message || 'File not found')
    })
    $('recvToggle').onchange = ev => {
      showRecv = ev.target.checked
      $('invCards').classList.toggle('hide-recv', !showRecv)
      try { sessionStorage.setItem('rx_show_recv', showRecv ? '1' : '0') } catch {}
    }
    $('poqToggle').onchange = ev => {
      showPoq = ev.target.checked
      $('invCards').classList.toggle('hide-poq', !showPoq)
      try { sessionStorage.setItem('rx_show_poq', showPoq ? '1' : '0') } catch {}
    }
    $('dlBtn').onclick = downloadReconciliation
    $('printBtn').onclick = () => window.print()
    $('statusBtn').onclick = toggleReceived
  }

  function invCardHtml(g) {
    const ls = g.lines
    const gl = ls.filter(l => !isFreightFlags(l.flags))   // goods lines: freight is a charge, not pieces
    const invoiced = gl.reduce((s, l) => s + (+l.inv_qty || 0), 0)
    const got = gl.filter(isCounted).reduce((s, l) => s + (+l.received || 0), 0)
    const n = t => ls.filter(l => lineTags(l).includes(t)).length
    const value = gl.filter(l => isCounted(l) && l.inv_price !== null).reduce((s, l) => s + qtyDiff(l) * +l.inv_price, 0)
    const frTotal = (g.inv.lines || []).filter(x => x.is_freight).reduce((s, x) => s + (+x.freight_amount || 0), 0)
    const cur = g.inv.currency || ls[0].currency || ''
    const pill = (cls, text) => `<span class="pill ${cls}">${text}</span>`
    const stats = [
      n('qty') ? pill('bad', plural(n('qty'), 'quantity variance')) : (n('uncounted') === gl.length ? '' : pill('good', 'Quantities match')),
      n('po') ? pill('bad', plural(n('po'), 'PO exception')) : '',
      n('price') ? pill('warn', plural(n('price'), 'price change')) : '',
      n('uncounted') ? pill('', `${n('uncounted')} not counted`) : '',
      n('freight') ? pill('freightpill', `Freight ${esc(moneyText(cur, frTotal))}`) : '',
      Math.abs(value) >= 0.005 ? pill(value < 0 ? 'bad' : 'warn', `${value < 0 ? 'Short' : 'Over'} ${esc(cur)} ${fmtMoney(Math.abs(value))}`) : '',
    ].join('')
    const lineSum = Math.round(ls.reduce((s, l) => s + (reconLineTotal(l) || 0), 0) * 100) / 100
    const { adj, printed } = invoiceExtras(g.inv)
    const amountRow = (label, amt, cls = '') => `<tr class="${cls}"><td></td><td>${esc(label)}</td><td colspan="7"></td><td class="num">${esc(reconMoney(amt, cur))}</td><td colspan="2"></td></tr>`
    let extraRows = ''
    if (adj) extraRows += amountRow(`${adj.amount < 0 ? 'Less' : 'Plus'} ${adj.label}`, adj.amount, 'tot-sub')
    if (printed !== null) {
      const diff = Math.round((lineSum + (adj ? adj.amount : 0) - printed) * 100) / 100
      extraRows += amountRow('Invoice total (printed on the invoice)', printed)
      extraRows += `<tr class="tot-verdict"><td></td><td colspan="11">${Math.abs(diff) <= 0.015 ? '<span class="tot-ok">&#10003; The line total is the same as the invoice total.</span>' : `<span class="tot-warn">&#10007; The line total is ${esc(reconMoney(Math.abs(diff), cur))} ${diff > 0 ? 'more' : 'less'} than the invoice total.</span>`}</td></tr>`
    }
    const meta = [g.inv.po ? `PO ${esc(g.inv.po)}` : '', g.inv.invoice_date ? esc(g.inv.invoice_date) : '', g.inv.invoice_total != null ? `Total ${esc(cur)} ${fmtMoney(g.inv.invoice_total)}` : '', `${plural(ls.length, 'line')}`].filter(Boolean).join(' · ')
    return `<details class="inv-card" open data-key="${esc(g.key)}">
      <summary>
        <div><div class="inv-title">Invoice ${esc(g.invoice_no)} · ${esc(g.supplier)}</div><div class="inv-sub">${meta}</div></div>
        <div class="inv-stats">${stats}</div>
      </summary>
      <div class="table-wrap"><table class="grid">
        <thead><tr><th>Stock code</th><th>Description</th><th>PO</th><th class="num col-poq">PO qty</th><th class="num">Invoiced</th><th class="num col-recv">Received</th><th class="num sortable" data-sort="var" tabindex="0" role="button" title="Sort by variance">Variance</th>
          <th class="num hide-sm">PO price</th><th class="num hide-sm">Inv price</th><th class="num">Line total</th><th class="num hide-sm sortable" data-sort="chg" tabindex="0" role="button" title="Sort by price change">Change</th><th>Note</th></tr></thead>
        <tbody>${poGrouped(ls)}</tbody>
        <tfoot><tr><td></td><td>Invoice total</td><td></td><td class="num col-poq"></td><td class="num">${fmtQty(invoiced)}</td><td class="num col-recv">${fmtQty(got)}</td>
          <td class="num var">${n('uncounted') === gl.length ? '' : fmtQty(got - gl.filter(isCounted).reduce((s, l) => s + (+l.inv_qty || 0), 0))}</td>
          <td class="num hide-sm"></td><td class="num hide-sm"></td><td class="num">${esc(reconMoney(lineSum, cur))}</td><td colspan="2"></td></tr>${extraRows}</tfoot>
      </table></div>
    </details>`
  }

  // What the Variance column sorts by: quantity received less invoiced (short is negative); blank for freight and uncounted lines
  const sortVariance = l => (isFreightFlags(l.flags) || !isCounted(l)) ? '' : qtyDiff(l)
  // Click Variance or Change to sort every invoice by it: smallest first, then largest first, then back to the usual order.
  // Blank cells always go last. PO headings are hidden while a sort is on (the sort ignores the PO groups).
  let reconSort = null   // { col: 'var' | 'chg', dir: 1 | -1 }
  function applyReconSort(root) {
    const cards = root.matches && root.matches('.inv-card') ? [root] : root.querySelectorAll('.inv-card')   // one redrawn card, or the whole page
    cards.forEach(card => {
      const tbody = card.querySelector('tbody'), rows = [...tbody.children]
      rows.forEach((tr, i) => { if (tr.dataset.ord === undefined) tr.dataset.ord = i })
      const idx = reconSort ? [...card.querySelectorAll('thead th')].findIndex(th => th.dataset.sort === reconSort.col) : -1
      const key = tr => { const v = idx >= 0 && tr.children[idx] ? tr.children[idx].dataset.sort : ''; return v === '' || v === undefined ? null : +v }
      rows.sort((x, y) => {
        if (!reconSort || idx < 0) return x.dataset.ord - y.dataset.ord
        const kx = key(x), ky = key(y)
        if (kx === null || ky === null) return kx === ky ? x.dataset.ord - y.dataset.ord : (kx === null ? 1 : -1)
        return (kx - ky) * reconSort.dir || x.dataset.ord - y.dataset.ord
      })
      rows.forEach(tr => tbody.appendChild(tr))
      card.classList.toggle('sorted', !!reconSort)
      card.querySelectorAll('thead th.sortable').forEach(th => { if (reconSort && th.dataset.sort === reconSort.col) th.setAttribute('aria-sort', reconSort.dir === 1 ? 'ascending' : 'descending'); else th.removeAttribute('aria-sort') })
    })
  }
  function varHtml(l) {
    if (isFreightFlags(l.flags)) return '<span class="pill freightpill">Freight</span>'
    if (!isCounted(l)) return '<span class="muted">Not counted</span>'
    const d = qtyDiff(l)
    if (d === 0) return '<span class="diff-ok">✓</span>'
    return d < 0 ? `<span class="var-short">${fmtQty(d)} short</span>` : `<span class="var-over">+${fmtQty(d)} over</span>`
  }
  // The invoice's amount for a line (printed on the invoice, or the freight amount): see lineAmountFor in core
  const reconLineTotal = l => lineAmountFor(l, recon.shipment.invoices)
  const reconMoney = (n, cur) => `${cur ? cur + ' ' : ''}${(+n).toLocaleString('en-NZ', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`
  // An invoice on several POs is listed PO by PO (lowest first, lines not on a PO last), each PO with its own heading row;
  // within a PO the lines are in part number order. An invoice on one PO just lists its lines.
  function poGrouped(ls) {
    if (new Set(ls.map(poOf).filter(Boolean)).size < 2) return ls.map(reconRowHtml).join('')   // headings only when the invoice is on two or more POs
    let out = '', cur = null
    for (const l of ls) {
      if (poOf(l) !== cur) {
        cur = poOf(l)
        const grp = ls.filter(x => poOf(x) === cur)
        const cur$ = grp.reduce((s, x) => s + (reconLineTotal(x) || 0), 0)
        out += `<tr class=\"po-head\" data-tags=\"\"><td colspan=\"12\"><strong>${cur ? `PO ${esc(cur)}` : 'Not on a PO'}</strong> <span class=\"muted\">· ${plural(grp.length, 'line')} · ${esc(reconMoney(cur$))}</span></td></tr>`
      }
      out += reconRowHtml(l)
    }
    return out
  }
  function reconRowHtml(l) {
    const tags = lineTags(l)
    const showSub = l.stock_code && l.supplier_code && normCode(l.stock_code) !== normCode(l.supplier_code)
    const pv = priceVarOf(l)   // rounding differences (0.53 against 0.525) are not price changes
    const fr = freightAmountFor(l, recon.shipment.invoices)       // freight amount, or null
    const poq = poQtyForLine(l, recon.shipment.po_lines)           // quantity on the PO line(s), or null
    return `<tr class="${esc(l.status)} ${tags.includes('qty') ? 'has-qty-var' : ''} ${tags.includes('freight') ? 'is-freight' : ''}" data-id="${l.id}" data-tags="${tags.join(' ')}">
      <td class="code">${esc(l.stock_code || l.supplier_code)}${showSub ? `<span class="sub">${esc(l.supplier_code)}</span>` : ''}</td>
      <td>${esc(l.description)}${(l.flags || []).filter(f => /^(Freight charge|Quantity changed in|Part number changed in|Price changed in|Line total changed in|Line added in)/.test(f)).map(f => `<span class="flag ${/^Freight charge/.test(f) ? 'freight' : 'edited'}">${esc(f)}</span>`).join('')}</td>
      <td class="po">${esc(poListOf(l)) || '<span class="muted">—</span>'}</td>
      <td class="num col-poq">${poq === null ? '—' : fmtQty(poq)}</td>
      <td class="num"><strong>${fmtQty(l.inv_qty)}</strong></td>
      <td class="num col-recv recv-edit">${isFreightFlags(l.flags) ? '—' : `<input type="number" inputmode="decimal" min="0" step="any" value="${isCounted(l) ? esc(l.received) : ''}" placeholder="—" ${recon.shipment.status === 'received' ? 'disabled title="Reopen the shipment to change this"' : ''} aria-label="Received quantity for ${esc(l.stock_code || l.supplier_code)}">`}</td>
      <td class="num var" data-sort="${sortVariance(l)}">${varHtml(l)}</td>
      <td class="num hide-sm">${fmtMoney(l.po_price)}</td>
      <td class="num hide-sm ${fr !== null ? 'freight-amt' : ''}">${fr !== null ? fmtMoney(fr) : fmtPrice2(l.inv_price)}</td>
      <td class="num">${reconLineTotal(l) === null ? '—' : esc(reconMoney(reconLineTotal(l)))}</td>
      <td class="num hide-sm chg ${fr === null && pv > 0 ? 'up' : fr === null && pv < 0 ? 'down' : ''}" data-sort="${fr === null && Number.isFinite(pv) ? pv : ''}">${fr === null ? fmtPct(pv) : ''}</td>
      <td class="note"><input type="text" maxlength="300" value="${esc(l.variance_note || '')}" placeholder="Add a note" aria-label="Note for ${esc(l.stock_code || l.supplier_code)}"></td>
    </tr>`
  }

  // The Still on order table: click a heading to sort by it (PO in number order, stock code in MYOB order), again for the other way,
  // a third time for the usual order.
  function wireStillOpenSort() {
    const table = $('stillOpenTable'); if (!table) return
    const tbody = table.querySelector('tbody'); let state = null
    const cmp = { text: (x, y) => x.localeCompare(y, 'en', { numeric: true, sensitivity: 'base' }), po: (x, y) => x.localeCompare(y, 'en', { numeric: true }), code: (x, y) => compareOurCode(x, y), num: (x, y) => +x - +y }
    const valueOf = (tr, th) => { const td = tr.children[+th.dataset.col]; return th.dataset.type === 'num' ? td.dataset.n : td.textContent.trim() }
    const go = th => {
      state = state && state.th === th ? (state.dir === 1 ? { th, dir: -1 } : null) : { th, dir: 1 }
      const rows = [...tbody.children]
      rows.sort((x, y) => state ? (cmp[th.dataset.type](valueOf(x, state.th), valueOf(y, state.th)) * state.dir || x.dataset.ord - y.dataset.ord) : x.dataset.ord - y.dataset.ord)
      rows.forEach(tr => tbody.appendChild(tr))
      table.querySelectorAll('th').forEach(h => { if (state && h === state.th) h.setAttribute('aria-sort', state.dir === 1 ? 'ascending' : 'descending'); else h.removeAttribute('aria-sort') })
    }
    table.querySelectorAll('th').forEach(th => {
      th.addEventListener('click', () => go(th))
      th.addEventListener('keydown', ev => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); go(th) } })
    })
  }
  function stillOpenHtml(list) {
    if (!list?.length) return ''
    return `<div class="section-title">Still on order</div>
      <p class="muted" style="margin-top:-4px">On the PO but not on this shipment's invoices. These stay open in MYOB.</p>
      <div class="table-card"><table class="grid" id="stillOpenTable">
        <thead><tr><th data-col="0" data-type="text" tabindex="0" role="button">Bin</th><th data-col="1" data-type="code" tabindex="0" role="button">Stock code</th><th data-col="2" data-type="text" tabindex="0" role="button">Description</th><th data-col="3" data-type="po" tabindex="0" role="button" title="Sort by PO">PO</th><th class="num" data-col="4" data-type="num" tabindex="0" role="button">Outstanding</th></tr></thead>
        <tbody>${list.map((p, i) => `<tr data-ord="${i}"><td>${esc(p.bin)}</td><td class="code">${esc(p.stock_code)}</td><td>${esc(p.desc)}</td><td>${esc(p.po)}</td><td class="num" data-n="${+p.outstanding || 0}">${fmtQty(p.outstanding)}</td></tr>`).join('')}</tbody>
      </table></div>`
  }

  function applyReconFilter(f) {
    content.querySelectorAll('.inv-card').forEach(card => {
      let any = false
      card.querySelectorAll('tbody tr:not(.po-head)').forEach(tr => {
        const show = f === 'all' || tr.dataset.tags.split(' ').includes(f)
        tr.hidden = !show; if (show) any = true
      })
      // a PO heading shows only while some line under it shows
      card.querySelectorAll('tbody tr.po-head').forEach(h => {
        let n = h.nextElementSibling, vis = false
        while (n && !n.classList.contains('po-head')) { if (!n.hidden) vis = true; n = n.nextElementSibling }
        h.hidden = !vis
      })
      card.hidden = f !== 'all' && !any
    })
  }

  const uncountedNoticeHtml = (n, sh) => sh.status === 'open'
    ? `${plural(n, 'line')} not counted yet. Finish the count in <a href="#/count/${sh.id}">Shipment Count</a> so the variances below are complete.`
    : `${plural(n, 'line')} not counted. Type the quantity received in the Received column, or reopen the count.`
  function wireReconInputs(root) {
    root.querySelectorAll('th.sortable').forEach(th => {
      const go = () => { const col = th.dataset.sort; reconSort = reconSort && reconSort.col === col ? (reconSort.dir === 1 ? { col, dir: -1 } : null) : { col, dir: 1 }; applyReconSort(content); applyReconFilter(content.querySelector('.filters .chip[aria-pressed="true"]')?.dataset.f || 'all') }
      th.addEventListener('click', go)
      th.addEventListener('keydown', ev => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); go() } })
    })
    root.querySelectorAll('td.note input').forEach(inp => inp.addEventListener('change', () => saveNote(inp)))
    root.querySelectorAll('td.recv-edit input').forEach(inp => {
      inp.addEventListener('change', () => saveReceived(inp))
      inp.addEventListener('keydown', ev => {
        if (ev.key !== 'Enter') return
        ev.preventDefault()
        const all = [...root.querySelectorAll('tr:not([hidden]) td.recv-edit input:not([disabled])')]
        const next = all[all.indexOf(inp) + 1]
        inp.blur(); if (next) next.focus()
      })
    })
  }
  // Change the quantity received on a line (the quantity counted can be wrong, or the count was never done). The card is drawn again
  // so its totals and variances are right; the cursor stays on the next quantity box.
  async function saveReceived(inp) {
    const tr = inp.closest('tr'), line = recon.lines.find(l => String(l.id) === tr.dataset.id)
    if (!line) return
    const raw = inp.value.trim(), value = raw === '' ? null : Number(raw)
    inp.classList.remove('saved', 'failed')
    if (value !== null && (!Number.isFinite(value) || value < 0)) { inp.classList.add('failed'); inp.title = 'Enter a number, 0 or more.'; return }
    if ((line.received ?? null) === value) return
    const patch = { received: value, counted_by: value === null ? null : me.staffno, counted_at: value === null ? null : new Date().toISOString() }
    const { error } = await supabase.from('shipment_lines').update(patch).eq('id', line.id)
    if (error) { inp.classList.add('failed'); inp.title = friendlyDbError(error); return }
    Object.assign(line, patch)
    const card = tr.closest('.inv-card')
    const act = document.activeElement
    const focusId = act && act.closest && act.closest('td.recv-edit') ? act.closest('tr').dataset.id : null
    const group = invoiceGroups().find(g => g.key === card.dataset.key)
    const wrap = document.createElement('div'); wrap.innerHTML = invCardHtml(group)
    const fresh = wrap.firstElementChild
    fresh.open = card.open
    card.replaceWith(fresh)
    wireReconInputs(fresh)
    applyReconSort(fresh)
    applyReconFilter(content.querySelector('.filters .chip[aria-pressed="true"]')?.dataset.f || 'all')
    fresh.querySelector(`tr[data-id="${line.id}"] td.recv-edit input`)?.classList.add('saved')
    if (focusId) fresh.querySelector(`tr[data-id="${focusId}"] td.recv-edit input`)?.focus()
    updateReconFacts()
  }
  // the figures above the invoices follow the edits
  function updateReconFacts() {
    const lines = recon.lines, goods = lines.filter(l => !isFreightFlags(l.flags))
    const tc = t => lines.filter(l => lineTags(l).includes(t)).length
    const counted = goods.filter(isCounted).length
    if ($('fCounted')) $('fCounted').textContent = `${counted} of ${goods.length}`
    for (const [id, t] of [['fQty', 'qty'], ['fPo', 'po']]) if ($(id)) { $(id).textContent = tc(t); $(id).style.color = tc(t) ? 'var(--err)' : 'inherit' }
    content.querySelectorAll('.filters .chip').forEach(c => { const b = c.querySelector('b'), f = c.dataset.f; if (b) b.textContent = f === 'all' ? lines.length : tc(f) })
    const n = $('uncountedNotice')
    if (n) { if (counted >= goods.length) n.remove(); else n.innerHTML = uncountedNoticeHtml(goods.length - counted, recon.shipment) }
    else if (counted < goods.length) {   // a quantity was cleared: the notice appears
      const d = document.createElement('div'); d.className = 'notice warn'; d.id = 'uncountedNotice'
      d.innerHTML = uncountedNoticeHtml(goods.length - counted, recon.shipment)
      content.querySelector('.facts')?.before(d)
    }
  }

  async function saveNote(inp) {
    const tr = inp.closest('tr')
    const line = recon.lines.find(l => String(l.id) === tr.dataset.id)
    const note = inp.value.trim()
    inp.classList.remove('saved', 'failed')
    const { error } = await supabase.from('shipment_lines').update({ variance_note: note }).eq('id', line.id)
    if (error) { inp.classList.add('failed'); inp.title = friendlyDbError(error); return }
    line.variance_note = note
    inp.classList.add('saved')
    tr.dataset.tags = lineTags(line).join(' ')
    const nc = content.querySelector('.chip[data-f="noted"] b'); if (nc) nc.textContent = recon.lines.filter(l => l.variance_note).length
  }

  // Complete shipment: the reconciliation is finished. The shipment moves to Completed Shipments (stored as status 'received').
  // Reopen shipment puts it back in Shipment Reconciliation.
  let completedNotice = ''
  async function toggleReceived() {
    const sh = recon.shipment
    const completing = sh.status !== 'received'
    const goodsLines = recon.lines.filter(l => !isFreightFlags(l.flags))
    const un = goodsLines.filter(l => !isCounted(l)).length
    if (completing) {
      const warn = [sh.status === 'open' ? 'The count has not been confirmed.' : '', un ? `${plural(un, 'line')} not counted.` : ''].filter(Boolean)
      if (!confirm(`Complete "${shipName(sh)}"?${warn.length ? `\n\n${warn.join(' ')}` : ''}\n\nDo this once the goods receipt has been entered in MYOB. The shipment moves to Completed Shipments, where it can be searched for and reopened.`)) return
    }
    const all = goodsLines.length > 0 && un === 0
    const status = completing ? 'received' : (all ? 'counted' : 'open')
    const summary = { ...(sh.summary || {}) }
    if (completing) { summary.completed_at = new Date().toISOString(); summary.completed_by = me.name } else { delete summary.completed_at; delete summary.completed_by }
    const { error } = await supabase.from('shipments').update({ status, summary }).eq('id', sh.id)
    if (error) return alert(`Couldn't update the shipment: ${friendlyDbError(error)}`)
    sh.status = status; sh.summary = summary; shipOptionsCache.at = 0
    if (completing && lastShipmentId === sh.id) { lastShipmentId = null; try { sessionStorage.removeItem('rx_last_shipment') } catch {} }
    if (completing) { completedNotice = `"${shipName(sh)}" is complete. It has moved here from Shipment Reconciliation.`; location.hash = '#/completed' } else renderReconcile()
  }

  // ============================================================
  // COMPLETED SHIPMENTS: finished shipments, searchable by invoice number, order (PO) number or supplier name
  // ============================================================
  const doneAt = s => (s.summary && s.summary.completed_at) || s.created_at
  // PO numbers of a shipment: the ones found in MYOB, plus the ones named on its invoices (they differ when a PO wasn't synced)
  const shipPOs = s => [...new Set([...(s.pos || []), ...(s.invoice_list || []).flatMap(i => String(i.po || '').match(/\d{4,}/g) || [])])]
  const clipList = (arr, n = 3) => { const l = arr || []; return l.length <= n ? l.join(', ') : `${l.slice(0, n).join(', ')} +${l.length - n} more` }
  async function showCompleted() {
    renderSidebar('completed')
    setTop('Completed Shipments', 'Search for finished shipments')
    content.innerHTML = `<div class="empty-state">Loading shipments…</div>`
    try {
      const rows = await fetchAll((x, y) => supabase.from('shipments').select('id, created_at, name, status, suppliers, invoice_nos, pos, summary, invoice_list').eq('status', 'received').order('created_at', { ascending: false }).range(x, y))
      rows.sort((p, q) => String(doneAt(q)).localeCompare(String(doneAt(p))))
      renderCompleted(rows)
    } catch (e) { content.innerHTML = `<div class="notice err">${esc(friendlyDbError(e))}</div>` }
  }
  function renderCompleted(rows) {
    const notice = completedNotice ? `<div class="notice ok">${esc(completedNotice)}</div>` : ''
    completedNotice = ''
    if (!rows.length) { content.innerHTML = notice + `<div class="empty-state">No completed shipments yet. Press <strong>Complete shipment</strong> on a shipment in <a href="#/reconcile">Shipment Reconciliation</a> when it is finished.</div>`; return }
    content.innerHTML = `${notice}
      <div class="search-row">
        <input id="doneSearch" type="search" placeholder="Search by invoice number, order (PO) number or supplier name" autocomplete="off" aria-label="Search completed shipments">
        <span class="muted" id="doneCount"></span>
      </div>
      <div class="table-card"><table class="grid" id="doneTable">
        <thead><tr><th>Shipment</th><th>Supplier</th><th>Invoices</th><th>PO</th><th>Completed</th><th class="num">Lines</th><th class="num">Pieces</th><th></th></tr></thead>
        <tbody id="doneBody"></tbody>
      </table></div>`
    // what is searched: shipment name, supplier names, invoice numbers and PO numbers. Case does not matter, and spacing and
    // punctuation are ignored (am0910 finds AM-0910/26). Several words must all be found.
    const hay = s => [shipName(s), ...(s.suppliers || []), ...(s.invoice_nos || []), ...shipPOs(s)].join(' ')
    const index = rows.map(s => ({ s, text: hay(s).toLowerCase(), norm: normCode(hay(s)) }))
    const LIMIT = 100
    const draw = () => {
      const terms = $('doneSearch').value.toLowerCase().split(/\s+/).filter(Boolean)
      const hits = index.filter(x => terms.every(t => x.text.includes(t) || (normCode(t) && x.norm.includes(normCode(t))))).map(x => x.s)
      $('doneCount').textContent = terms.length ? `${hits.length} of ${rows.length} shipments` : `${rows.length} shipment${rows.length === 1 ? '' : 's'}`
      $('doneBody').innerHTML = hits.slice(0, LIMIT).map(s => `<tr data-id="${s.id}" class="done-row" tabindex="0">
          <td><strong>${esc(shipName(s))}</strong></td>
          <td>${esc((s.suppliers || []).join(', '))}</td>
          <td title="${esc((s.invoice_nos || []).join(', '))}">${esc(clipList(s.invoice_nos))}</td>
          <td title="${esc(shipPOs(s).join(', '))}">${esc(clipList(shipPOs(s), 4))}</td>
          <td>${esc(fmtWhen(doneAt(s)))}${s.summary?.completed_by ? `<span class="sub">${esc(s.summary.completed_by)}</span>` : ''}</td>
          <td class="num">${fmtQty((s.summary || {}).lines || 0)}</td><td class="num">${fmtQty((s.summary || {}).pcs || 0)}</td>
          <td class="act"><a class="btn ghost" href="#/reconcile/${s.id}">View</a> <button class="btn ghost" type="button" data-reopen="${s.id}">Reopen</button></td>
        </tr>`).join('') + (hits.length > LIMIT ? `<tr><td colspan="8" class="muted">Showing the first ${LIMIT} of ${hits.length}. Type more of the invoice number, PO number or supplier to narrow it down.</td></tr>` : '')
        || `<tr><td colspan="8" class="empty-state" style="border:0">No completed shipment matches "${esc($('doneSearch').value.trim())}".</td></tr>`
    }
    $('doneSearch').oninput = draw
    $('doneBody').onclick = async ev => {
      const rb = ev.target.closest('[data-reopen]')
      if (rb) {
        const s = rows.find(r => r.id === rb.dataset.reopen)
        if (!confirm(`Reopen "${shipName(s)}"?\n\nIt goes back to Shipment Reconciliation.`)) return
        const summary = { ...(s.summary || {}) }; delete summary.completed_at; delete summary.completed_by
        const { error } = await supabase.from('shipments').update({ status: 'counted', summary }).eq('id', s.id)
        if (error) return alert(`Couldn't reopen the shipment: ${friendlyDbError(error)}`)
        shipOptionsCache.at = 0
        rows.splice(rows.indexOf(s), 1)
        completedNotice = `"${shipName(s)}" is back in Shipment Reconciliation.`
        return renderCompleted(rows)
      }
      if (ev.target.closest('a, button')) return
      const tr = ev.target.closest('tr[data-id]'); if (tr) location.hash = `#/reconcile/${tr.dataset.id}`
    }
    $('doneBody').onkeydown = ev => { if (ev.key === 'Enter' && ev.target.matches('tr[data-id]')) location.hash = `#/reconcile/${ev.target.dataset.id}` }
    draw()
    $('doneSearch').focus()
  }

  function downloadReconciliation() {
    const { shipment: sh, lines } = recon
    const wb = reconciliationWorkbook(XLSX, { name: shipName(sh), invoices: sh.invoices || [], lines, poLines: sh.po_lines || [] })
    XLSX.writeFile(wb, `Reconciliation_${shipName(sh).replace(/[^A-Za-z0-9 _.-]+/g, '').trim().slice(0, 50) || 'shipment'}.xlsx`)
  }

  const lblSettingsFor = type => (lblStore.get(LBL_SETTINGS_KEY) || {})[type] || {}
  const lblSaveSettings = (type, s) => { const all = lblStore.get(LBL_SETTINGS_KEY) || {}; all[type] = s; lblStore.set(LBL_SETTINGS_KEY, all) }
  const lblEmpty = () => ({ barcode: '', partNo: '', description: '', oem1: '', oem2: '', oem3: '', bin: '' })

    content.innerHTML = `

  async function showLabelSync() {
    const el = $('lblSync'); if (!el) return
    const { data, error } = await supabase.from('labels_sync').select('last_ok, row_count, message').eq('id', 1).maybeSingle()
    if (!$('lblSync')) return
    if (error || !data || !data.last_ok) { el.innerHTML = `<strong>MYOB label data hasn't been synced yet.</strong> Searches will find nothing until the sync program has run.`; return }
    const ageH = (Date.now() - new Date(data.last_ok)) / 3600000
    el.textContent = `Label data from MYOB: ${fmtQty(data.row_count)} items, last synced ${fmtTime(data.last_ok)}.${ageH > 3 ? ' This is more than 3 hours old: check the sync program.' : ''}`
  }

  function fillSettings() {
    const s = lblSettingsFor(lbl.type), t = LABEL_TYPES[lbl.type]
    const set = (id, k, ph) => { const el = $(id); if (el) { el.value = s[k] ?? ''; if (ph !== undefined) el.placeholder = ph } }
    set('lsW', 'pageW', t.page.w); set('lsH', 'pageH', t.page.h); set('lsX', 'offsetX', '0'); set('lsY', 'offsetY', '0')
    set('lsScale', 'scale', `Automatic (${Math.round(labelGeometry(lbl.type, {}).scale * 100)})`); set('lsBcW', 'barcodeW', '100'); set('lsBcH', 'barcodeH', '100')
  }
  function syncLabelFields() {
    const d = lbl.data
    ;[['lblPartNo', 'partNo'], ['lblDesc', 'description'], ['lblOem1', 'oem1'], ['lblOem2', 'oem2'], ['lblOem3', 'oem3'], ['lblBin', 'bin'], ['lblBarcode', 'barcode']].forEach(([id, k]) => { const el = $(id); if (el) el.value = d[k] || '' })
    const pre = preLabelColour(lbl.pre), tool = $('labelTool')
    if (tool) tool.style.background = pre.rgb
    const banner = $('ltPre'); if (banner) { banner.hidden = !pre.name; banner.textContent = pre.name ? `Pre-label: ${pre.name}` : '' }
    const notes = $('lblNotes'); if (notes) { notes.hidden = !lbl.notes; notes.textContent = lbl.notes ? `Additional notes: ${lbl.notes}` : '' }
    const also = $('lblAlso')
    if (also) {
      also.hidden = lbl.matches.length < 2
      also.innerHTML = lbl.matches.length < 2 ? '' : `${lbl.matches.length} items matched. Showing ${esc(lbl.data.partNo)}.` + lbl.matches.filter(c => c !== lbl.data.partNo).map(c => `<button type="button" data-code="${esc(c)}">${esc(c)}</button>`).join('')
      also.querySelectorAll('button').forEach(b => b.onclick = () => { $('lblScan').value = b.dataset.code; lookupLabel(b.dataset.code) })
    }

  }

  function clearLabel() {
    lbl.data = lblEmpty(); lbl.notes = ''; lbl.pre = 0; lbl.myobDesc = ''; lbl.matches = []
    $('lblScan').value = ''; $('lblQty').value = ''
    setLabelMsg('')
    syncLabelFields(); renderLabelPreview()
  }

  // Look the scanned barcode or typed part number up: stock code or any of the item's three barcodes
  async function lookupLabel(term) {
    const t = String(term || '').trim()
    if (!t) return false
    setLabelMsg('Looking up…')
    const { data, error } = await supabase.rpc('find_labels', { term: t })
    if (error) {
      setLabelMsg(/find_labels|stock_labels|does not exist|schema cache/i.test(error.message) ? 'The label data tables are not set up yet. Run migration_3.sql in Supabase.' : `Couldn't search: ${error.message}`, 'err')
      return false
    }
    if (!data || !data.length) {
      clearLabel()
      setLabelMsg(`No label found with Barcode/Part No ${t}.`, 'err')
      $('lblScan').focus()
      return false
    }
    const r = data[0]
    lbl.data = { barcode: r.barcode1 || '', partNo: r.stock_code || '', description: r.label_description || '', oem1: r.oem1 || '', oem2: r.oem2 || '', oem3: r.oem3 || '', bin: r.bin || '' }
    lbl.notes = r.notes || ''; lbl.pre = +r.pre_label || 0; lbl.myobDesc = r.description || ''; lbl.matches = data.map(x => x.stock_code)
    $('lblScan').value = r.stock_code
    setLabelMsg(!r.label_description && r.description ? `No label description in MYOB. The item description is: ${r.description}` : '')
    syncLabelFields(); renderLabelPreview()
    $('lblQty').focus()
    return true
  }

  // Shrink any text that would run past its box (the workbook just clips it). Anything still too long at half size is
  // clipped at its box, as in Excel, so it can't run over the barcode. Returns {shrunk, clipped} field keys.
  function fitLabelText(root) {
    const shrunk = [], clipped = []
    root.querySelectorAll('.lbl-tx[data-fit]').forEach(el => {
      const span = el.firstElementChild, pt = +el.dataset.fit, wrap = el.classList.contains('lbl-wrap')
      if (el.dataset.cut) {   // descriptions are never shrunk: cut off at the box, as in Excel
        if (span.scrollWidth > el.clientWidth + 0.5 || (wrap && span.scrollHeight > span.clientHeight + 0.5)) clipped.push(el.dataset.k)
        return
      }
      const over = () => span.scrollWidth > el.clientWidth + 0.5 || (wrap && span.offsetHeight > el.clientHeight + 0.5)
      let f = 1
      while (over() && f > 0.5) { f -= 0.03; el.style.fontSize = (pt * f).toFixed(2) + 'pt' }
      if (f < 1) shrunk.push(el.dataset.k)
      if (over()) clipped.push(el.dataset.k)
    })
    return { shrunk, clipped }
  }

  function renderLabelPreview() {
    const box = $('lblPreview'); if (!box) return
    const t = LABEL_TYPES[lbl.type], s = lblSettingsFor(lbl.type), g = labelGeometry(lbl.type, s)
    const html = labelPageHtml(lbl.type, lbl.data, s, { preview: true })
    // show the label and a little paper round it: the whole label stock for the small printer, the top-left corner of the A4 sheet for the laser
    const vw = Math.min(g.pageW, g.x + t.area.w * g.scale + 3), vh = Math.min(g.pageH, g.y + t.area.h * g.scale + 3)
    const pxmm = 96 / 25.4, zoom = Math.min(2, 480 / (vw * pxmm))
    box.innerHTML = `<div class="lt-paper" style="width:${(vw * pxmm * zoom).toFixed(1)}px;height:${(vh * pxmm * zoom).toFixed(1)}px"><div style="width:${vw}mm;height:${vh}mm;overflow:hidden;transform:scale(${zoom.toFixed(3)});transform-origin:0 0">${html}</div></div>`
    const fit = fitLabelText(box)
    const notes = []
    notes.push(`${t.name} label · ${t.printer} · ${g.pageW}×${g.pageH} mm · printed at ${Math.round(g.scale * 100)}%`)
    if (t.note) notes.push(t.note)
    if (lbl.data.barcode && !ean13Digits(lbl.data.barcode)) notes.push('This barcode is not 12 or 13 digits, so no barcode will print.')
    if (ean13Digits(lbl.data.barcode) && barcodeBox(lbl.type, s).capped) notes.push('The barcode width is held back so the text beside it keeps enough room.')
    if (fit.clipped.length) notes.push(`${fit.clipped.map(k => LABEL_FIELD_NAMES[k] || k).join(', ')} ${fit.clipped.length > 1 ? 'are' : 'is'} too long for this label and will be cut off.`)
    else if (fit.shrunk.length) notes.push('Some text was made smaller to fit the label.')
    const el = $('lblPreviewNote'); if (el) el.textContent = notes.join(' · ')
  }

  // ---------- printing ----------
  function labelsHaveContent(d) { return Object.values(d).some(v => String(v || '').trim()) }
  function printLabels() {
    const raw = $('lblQty').value.trim(), n = Math.floor(+raw)
    if (!labelsHaveContent(lbl.data)) { setLabelMsg('Scan or type a barcode or part number first.', 'err'); $('lblScan').focus(); return }
    if (!raw || !Number.isFinite(n) || n < 1 || n > 99999) { setLabelMsg('Enter how many labels to print (1 to 99999).', 'err'); $('lblQty').focus(); return }
    if (n > 500 && !confirm(`Print ${n.toLocaleString()} labels?`)) return
    const data = { ...lbl.data }, type = lbl.type
    lblLast = { type, data, qty: n }
    printLabelPages(type, data, n, () => { clearLabel(); updateAgainButton(); $('lblScan')?.focus() })
  }

  // Build n label pages and open the print window. Each label is one page, as the workbook's Copies setting did.
  function printLabelPages(type, data, n, after) { printLabelJobs(type, [{ data, n }], after) }

  // jobs = [{data, n}]: n copies of each item's label, one after another, in a single print job
  function printLabelJobs(type, jobs, after) {
    const s = lblSettingsFor(type), g = labelGeometry(type, s)
    // lay each label out once off-screen so the text fitting is worked out, then repeat it
    const probe = document.createElement('div')
    probe.style.cssText = 'position:absolute;left:-10000px;top:0;visibility:hidden'
    document.body.appendChild(probe)
    const pages = []
    for (const j of jobs) {
      probe.innerHTML = labelPageHtml(type, j.data, s)
      fitLabelText(probe)
      for (let i = 0; i < j.n; i++) pages.push(probe.innerHTML)
    }
    probe.remove()
    $('labelPrint').innerHTML = pages.join('')
    let st = $('labelPageStyle')
    if (!st) { st = document.createElement('style'); st.id = 'labelPageStyle'; document.head.appendChild(st) }
    st.textContent = `@page { size: ${g.pageW}mm ${g.pageH}mm; margin: 0 }`
    document.body.classList.add('printing-labels')
    let done = false
    const finish = () => {
      if (done) return
      done = true
      document.body.classList.remove('printing-labels')
      $('labelPrint').innerHTML = ''
      window.removeEventListener('afterprint', finish)
      if (after) after()
    }
    window.addEventListener('afterprint', finish)
    window.print()
    setTimeout(finish, 120000)   // in case this browser never reports the print window closing
  }

  // ============================================================
  // START
  // ============================================================
  ;(async () => {
    if (!CONFIGURED) return renderSetupNeeded()
    const { data } = await supabase.auth.getSession()
    if (data.session) {
      staffno = data.session.user.email.replace('staff', '').replace('@camarep.internal', '')
      enterApp(data.session.user)
    } else renderStaffEntry()
  })()
</script>
