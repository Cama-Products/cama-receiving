      const m = new Map()
      for (const r of rows) { const k = keyFn(r); if (!m.has(k)) m.set(k, []); m.get(k).push(r) }
      return m
    }
    const take = (m, k) => (m.get(k) || []).shift() || null
    const posBuckets = bucket(oldLines.filter(o => o.line_no > 0), posKey)
    const pairs = newRows.map((r, seq) => ({ row: r, seq, old: r.line_no > 0 ? take(posBuckets, posKey(r)) : null }))
    const claimed = new Set(pairs.filter(pr => pr.old).map(pr => pr.old))
    const contentBuckets = bucket(oldLines.filter(o => !claimed.has(o)), contentKey)
    for (const pr of pairs) if (!pr.old) pr.old = take(contentBuckets, contentKey(pr.row))
    const unpaired = [...contentBuckets.values()].flat()
  
    // counted totals per old item key. Only lines that stay count: when an invoice is removed or moved out,
    // the count that was allocated to its lines leaves with it.
    const staying = new Set(pairs.filter(pr => pr.old).map(pr => pr.old))
    const oldTotals = new Map()
    for (const o of oldLines) {
      if (!staying.has(o)) continue
      if (o.received === null || o.received === undefined) continue
      const k = itemKeyOf(o)
      const t = oldTotals.get(k) || { sum: 0, by: null, at: null }
      t.sum += +o.received
      if (!t.at || (o.counted_at && o.counted_at > t.at)) { t.by = o.counted_by ?? t.by; t.at = o.counted_at ?? t.at }
      oldTotals.set(k, t)
    }
    // which old item keys feed each new item key
    const feeds = new Map()
    const feed = (newKey, oldKey) => { if (!feeds.has(newKey)) feeds.set(newKey, new Set()); feeds.get(newKey).add(oldKey) }
    for (const { row, old } of pairs) { const nk = itemKeyOf(row); feed(nk, nk); if (old) feed(nk, itemKeyOf(old)) }
  
    const used = new Set()
    const totals = new Map()   // new key -> { sum, by, at } | null
    for (const [nk, olds] of feeds) {
      let agg = null
      for (const ok of olds) {
        if (used.has(ok) || !oldTotals.has(ok)) continue
        used.add(ok)
        const t = oldTotals.get(ok)
        agg = agg ? { sum: agg.sum + t.sum, by: agg.by ?? t.by, at: agg.at && agg.at > (t.at || '') ? agg.at : t.at } : { ...t }
      }
      totals.set(nk, agg)
    }
    // split each item's total over its rows
    const byKey = new Map()
    for (const pr of pairs) { const nk = itemKeyOf(pr.row); if (!byKey.has(nk)) byKey.set(nk, []); byKey.get(nk).push(pr) }
    const out = []
    for (const [nk, prs] of byKey) {
      const t = totals.get(nk)
      const alloc = t ? allocateCount(t.sum, prs.map(p => +p.row.inv_qty)) : null
      prs.forEach((pr, i) => {
        pr.received = t ? alloc[i] : null
        pr.by = t ? t.by : null
        pr.at = t ? t.at : null
      })
    }
    for (const pr of pairs) {
      out.push({
        old: pr.old,
        fields: { ...lineFields(pr.row, pr.seq), received: pr.received, counted_by: pr.by ?? null, counted_at: pr.at ?? null,
                  variance_note: pr.old ? (pr.old.variance_note || '') : '' },
      })
    }
    return { items: out, deletes: unpaired.map(o => o.id) }
  }
  
  // ============================================================
  // Excel check-off sheet (SheetJS)
  // ============================================================
  function checkoffWorkbook(XLSX, sh) {
    const s = sh.summary
    const aoa = [
      [`Receiving: ${s.suppliers.join(', ') || 'shipment'}`],
      [`Invoice ${s.invoices.join(', ')}   PO ${s.pos.join(', ') || '-'}   ${s.lines} lines   ${s.pcs} pcs`],
      ['Count each line and enter the quantity in the Received column. Lines without a bin are at the end.'],
      [],
      ['Bin', 'Stock Code', 'Supplier Code', 'Description', 'PO', 'Inv Qty', 'Received', 'Diff', 'PO Price', 'Inv Price', 'Price Var', 'Check', 'Invoices'],
    ]
    const first = aoa.length + 1
    sh.result.rows.forEach((r, k) => {
      const n = first + k
      aoa.push([
        r.bin, r.stock_code, r.supplier_code, r.desc,
        r.pos.length === 1 ? r.pos[0][0] : r.pos.map(([p, q]) => `${p} x${q}`).join(', '),
        r.inv_qty, r.received ?? null, null, r.po_price, r.inv_price, null, r.flags.join('; '), r.invoices_text || '',
      ])
    })
    const last = aoa.length
    const ws = XLSX.utils.aoa_to_sheet(aoa)
    for (let n = first; n <= last; n++) {
      ws[`H${n}`] = { t: 'n', f: `IF(G${n}="","",G${n}-F${n})` }
      ws[`K${n}`] = { t: 'n', f: `IF(OR(I${n}="",I${n}=0,J${n}="",ABS(J${n}-I${n})<=0.005000001),"",(J${n}-I${n})/I${n})`, z: '0%' }
    }
    XLSX.utils.sheet_add_aoa(ws, [
      [],
      ['', '', '', 'Totals', '', { t: 'n', f: `SUM(F${first}:F${last})` }, { t: 'n', f: `SUM(G${first}:G${last})` }],
      ['', '', '', `Invoice value (${s.currency})`, '', '', '', '', '', { t: 'n', f: `SUMPRODUCT(F${first}:F${last},J${first}:J${last})`, z: '#,##0.00' }],
    ], { origin: `A${last + 1}` })
    if (sh.result.still_open.length) {
      const start = last + 5
      XLSX.utils.sheet_add_aoa(ws, [
        ['Still on order (on the PO, not on this shipment\'s invoices)'],
        ['Bin', 'Stock Code', 'Supplier Code', 'Description', 'PO', 'Outstanding'],
        ...sh.result.still_open.map(p => [p.bin, p.stock_code, p.supplier_code, p.desc, p.po, p.outstanding]),
      ], { origin: `A${start}` })
    }
    ws['!cols'] = [12, 15, 15, 34, 13, 8, 10, 7, 10, 10, 9, 44, 24].map(w => ({ wch: w }))
    const wb = XLSX.utils.book_new()
    XLSX.utils.book_append_sheet(wb, ws, 'Check-off')
    return wb
  }
  
  // ============================================================
  // Check-off sheet for counting by hand: one sheet per invoice, its items sorted by Cama code A to Z.
  // Columns: Cama Code, Supplier Code, Description, PO Number, Inv Price, Inv Total; then Inv Qty and a blank Counted
  // column to write in. Freight lines are left out (they aren't counted).
  // ============================================================
  const sheetName = (taken, base) => {
    const clean = String(base || 'Invoice').replace(/[\\/?*[\]:]/g, '-').trim().slice(0, 28) || 'Invoice'
    let n = clean, k = 2
    while (taken.has(n.toLowerCase())) n = `${clean.slice(0, 26)} ${k++}`
    taken.add(n.toLowerCase())
    return n
  }
  function invoiceCheckoffWorkbook(XLSX, { name, invoices, lines }) {
    const wb = XLSX.utils.book_new()
    const taken = new Set(['shipment'])
    const pack = []
    const order = [...invoices]
    // any saved lines whose invoice isn't in the list (shouldn't happen) still get a sheet
    for (const l of lines) if (!order.some(i => i.supplier === l.supplier && i.invoice_no === l.invoice_no)) order.push({ supplier: l.supplier, invoice_no: l.invoice_no, po: '', currency: '', lines: [] })
    for (const inv of order) {
      const mine = lines.filter(l => l.supplier === inv.supplier && l.invoice_no === inv.invoice_no && !isFreightFlags(l.flags) && +l.inv_qty > 0)
      const rows = mine.map(l => {
        const invLine = invoiceLineFor(l, invoices)
        const pos = l.pos || []
        return {
          cama: String(l.stock_code || (invLine && invLine.our_code) || '').trim(), supplier_code: l.supplier_code || '', desc: l.description || '',
          po: pos.length === 1 ? String(pos[0][0]) : pos.map(([p, q]) => `${p} x${q}`).join(', '),
          price: l.inv_price === null || l.inv_price === undefined || l.inv_price === '' ? null : +l.inv_price, qty: +l.inv_qty, amount: lineAmountFor(l, invoices),
        }
      }).sort((a, b) => compareOurCode(a.cama, b.cama, a.supplier_code, b.supplier_code))
      const cur = inv.currency || ''
      const first = 6, last = first + rows.length - 1
      const aoa = [
        [`${inv.supplier || 'Supplier'}   Invoice ${inv.invoice_no}`],
        [`${name}   PO ${inv.po || '-'}${inv.invoice_date ? '   ' + inv.invoice_date : ''}   ${rows.length} line${rows.length === 1 ? '' : 's'}   ${rows.reduce((a, r) => a + r.qty, 0)} pcs${cur ? '   prices in ' + cur : ''}`],
        ['Sorted by Cama code, A to Z. Write the quantity you count in the Counted column.'],
        [],
        ['Cama Code', 'Supplier Code', 'Description', 'PO Number', 'Inv Price', 'Inv Total', 'Inv Qty', 'Counted'],
      ]
      for (const r of rows) aoa.push([r.cama, r.supplier_code, r.desc, r.po, r.price, null, r.qty, null])
      const ws = XLSX.utils.aoa_to_sheet(aoa)
      rows.forEach((r, k) => {
        const n = first + k
        if (r.amount !== null) ws[`F${n}`] = { t: 'n', v: r.amount, z: '#,##0.00' }   // the amount printed on the invoice line
        if (r.price !== null) ws[`E${n}`].z = '#,##0.00##'
      })
      if (rows.length) {
        const totalValue = Math.round(rows.reduce((a, r) => a + (r.amount || 0), 0) * 100) / 100
        XLSX.utils.sheet_add_aoa(ws, [[], ['', '', '', 'Total', '', { t: 'n', f: `SUM(F${first}:F${last})`, v: totalValue, z: '#,##0.00' }, { t: 'n', f: `SUM(G${first}:G${last})`, v: rows.reduce((a, r) => a + r.qty, 0) }, { t: 'n', f: `SUM(H${first}:H${last})` }]], { origin: `A${last + 1}` })
        const { adj, printed } = invoiceExtras(inv)
        const more = []
        if (adj) more.push(['', '', '', `${adj.amount < 0 ? 'Less' : 'Plus'} ${adj.label}`, '', { t: 'n', v: adj.amount, z: '#,##0.00' }])
        if (printed !== null) more.push(['', '', '', 'Invoice total (printed)', '', { t: 'n', v: printed, z: '#,##0.00' }])
        if (more.length) XLSX.utils.sheet_add_aoa(ws, more, { origin: `A${last + 3}` })
      }
      ws['!cols'] = [15, 17, 42, 14, 10, 11, 9, 10].map(w => ({ wch: w }))
      const sn = sheetName(taken, inv.invoice_no)
      XLSX.utils.book_append_sheet(wb, ws, sn)
      pack.push({ sn, inv, rows, value: Math.round(rows.reduce((a, r) => a + (r.amount || 0), 0) * 100) / 100 })
    }
    // an overview first, so a shipment with many invoices is easy to find your way around
    const cur0 = [...new Set(pack.map(p => p.inv.currency).filter(Boolean))]
    const sum = [
      [`Shipment: ${name}`],
      ['One sheet per invoice follows. Each is sorted by Cama code, A to Z.'],
      [],
      ['Sheet', 'Supplier', 'Invoice', 'PO', 'Lines', 'Pieces', `Value${cur0.length === 1 ? ' (' + cur0[0] + ')' : ''}`],
      ...pack.map(p => [p.sn, p.inv.supplier || '', p.inv.invoice_no, p.inv.po || '', p.rows.length, p.rows.reduce((a, r) => a + r.qty, 0), p.value]),
    ]
    const wsS = XLSX.utils.aoa_to_sheet(sum)
    wsS['!cols'] = [18, 30, 20, 22, 8, 9, 13].map(w => ({ wch: w }))
    wb.SheetNames.unshift('Shipment'); wb.Sheets.Shipment = wsS
    return wb
  }
  
  // ============================================================
  // PO quantity and freight amount for a saved line (used by Shipment Reconciliation and its Excel sheet)
  // ============================================================
  // PO qty = what was on the PO line(s) for this item when the shipment was matched (the shipment's saved PO lines).
  function poQtyForLine(line, poLines) {
    const pos = new Set((line.pos || []).map(p => String(p[0])))
    if (!pos.size) return null
    const key = normCode(line.stock_code)
    let sum = 0, found = false
    for (const p of poLines || []) {
      if (pos.has(String(p.po)) && normCode(p.stock_code) === key) { sum += +p.qty || 0; found = true }
    }
    return found ? sum : null
  }
  // The invoice line (from the shipment's saved invoices) that a saved line came from
  function invoiceLineFor(line, invoices) {
    const inv = (invoices || []).find(i => i.supplier === line.supplier && i.invoice_no === line.invoice_no)
    return inv && line.line_no > 0 ? inv.lines[line.line_no - 1] || null : null
  }
  // The freight amount entered in Shipment Edit for a saved line, or null if it isn't a freight line
  function freightAmountFor(line, invoices) {
    const ln = invoiceLineFor(line, invoices)
    return ln && ln.is_freight ? +ln.freight_amount || 0 : null
  }
  
  // Our part numbers are put in the order MYOB lists them: character by character, so 10-10225 comes before 10-1024 (the numbers are
  // NOT compared as numbers), letters after digits, upper and lower case alike. Lines with no code go last.
  const compareOurCode = (a, b, tieA = '', tieB = '') => {
    const x = String(a ?? '').trim().toUpperCase(), y = String(b ?? '').trim().toUpperCase()
    if ((x === '') !== (y === '')) return x === '' ? 1 : -1
    const plain = (p, q) => (p < q ? -1 : p > q ? 1 : 0)
    return plain(x, y) || plain(String(tieA ?? '').toUpperCase(), String(tieB ?? '').toUpperCase())
  }
  // Our part number for a saved line: the MYOB code once matched, otherwise the code the invoice printed or one was typed in for
  const ourPartFor = (line, invoices) => String(line.stock_code || (invoiceLineFor(line, invoices) || {}).our_code || '').trim()
  
  // The PO a saved line is on (its first PO), all of its POs as text, and the order Shipment Reconciliation lists lines in:
  // grouped by PO first (lowest PO first, lines not on a PO last), then by part number in MYOB order.
  const poOf = l => { const p = (l.pos || [])[0]; return p ? String(p[0]) : '' }
  const poListOf = l => (l.pos || []).map(p => String(p[0])).join(', ')
  function comparePoThenPart(a, b, invoices) {
    const pa = poOf(a), pb = poOf(b)
    if ((pa === '') !== (pb === '')) return pa === '' ? 1 : -1
    return pa.localeCompare(pb, 'en', { numeric: true }) || compareOurCode(ourPartFor(a, invoices), ourPartFor(b, invoices), a.supplier_code, b.supplier_code) || (a.line_no || 0) - (b.line_no || 0) || (a.seq - b.seq)
  }
  
  // Shipment Reconciliation lists a shipment's invoices by the oldest PO first (the earliest order date in MYOB of the POs named on the
  // invoice; where no date is known, the lower PO number, which is the older), and within that the lowest dollar value first.
  function invoiceValue(inv) {
    if (inv.invoice_total !== null && inv.invoice_total !== undefined && inv.invoice_total !== '') return +inv.invoice_total
    return (inv.lines || []).filter(l => !l.removed).reduce((t, l) => t + (l.total != null && l.total !== '' ? +l.total : (+l.qty || 0) * (+l.price || 0)), 0)
  }
  function sortInvoicesForReconciliation(invoices, poLines) {
    const dateOf = new Map()
    for (const p of poLines || []) if (p.order_date && (!dateOf.has(String(p.po)) || String(p.order_date) < dateOf.get(String(p.po)))) dateOf.set(String(p.po), String(p.order_date))
    const key = (inv, i) => {
      const pos = [...new Set([...(String(inv.po || '').match(/\d{4,}/g) || []), ...(inv.lines || []).flatMap(l => String(l.po || '').match(/\d{4,}/g) || [])])]
      const dates = pos.map(p => dateOf.get(p)).filter(Boolean).sort()
      return { date: dates[0] || '', pono: pos.length ? Math.min(...pos.map(Number)) : Infinity, value: invoiceValue(inv), i }
    }
    return invoices.map((inv, i) => ({ inv, k: key(inv, i) })).sort((a, b) =>
      (!a.k.date - !b.k.date) || a.k.date.localeCompare(b.k.date) || (a.k.pono - b.k.pono) || (a.k.value - b.k.value) || (a.k.i - b.k.i)).map(x => x.inv)
  }
  
  // The invoice's amount for a saved line. A freight line is the freight amount. Otherwise it is the amount printed on the
  // invoice line (suppliers work it out from an unrounded unit price, so it can differ by a few cents from qty x the printed
  // price, and those cents add up over a long invoice). It falls back to qty x price if the invoice line isn't there or its
  // quantity no longer matches the saved line.
  function lineAmountFor(line, invoices) {
    const fr = freightAmountFor(line, invoices)
    if (fr !== null) return fr
    const ln = invoiceLineFor(line, invoices)
    if (ln && ln.total != null && ln.total !== '' && +ln.qty === +line.inv_qty) return Math.round(+ln.total * 100) / 100
    if (line.inv_price === null || line.inv_price === undefined || line.inv_price === '') return null
    return Math.round((+line.inv_qty || 0) * +line.inv_price * 100) / 100
  }
  // What goes under an invoice's lines: the charge or discount outside the lines (GST, packing, a % discount) and the printed total
  function invoiceExtras(inv) {
    const adj = inv && inv.adjust && inv.adjust.amount ? { amount: +inv.adjust.amount, label: inv.adjust.label || (inv.adjust.amount < 0 ? 'discount' : 'charges') } : null
    const printed = inv && inv.invoice_total !== null && inv.invoice_total !== undefined && inv.invoice_total !== '' ? +inv.invoice_total : null
    return { adj, printed }
  }
  
  // ============================================================
  // Excel reconciliation sheet: every invoice's lines with PO qty, quantity and price variances, and notes
  // ============================================================
  function reconciliationWorkbook(XLSX, { name, invoices, lines, poLines }) {
    // columns: A Invoice, B PO, C Stock Code, D Supplier Code, E Description, F PO Qty, G Invoiced, H Received, I Variance,
    //          J PO Price, K Inv Price, L Line Total, M Price Var, N Check, O Note
    const NCOL = 15
    const aoa = [
      [`Shipment reconciliation: ${name}`],
      [`${invoices.length} invoice${invoices.length === 1 ? '' : 's'}`],
      [],
      ['Invoice', 'PO', 'Stock Code', 'Supplier Code', 'Description', 'PO Qty', 'Invoiced', 'Received', 'Variance', 'PO Price', 'Inv Price', 'Line Total', 'Price Var', 'Check', 'Note'],
    ]
    const formulas = []   // [rowNumber, kind, range]
    const custom = []     // [rowNumber, value, formula]: GST / printed total / difference rows, written into column L
    const groups = new Map()
    for (const l of lines) {
      const k = `${l.supplier}|${l.invoice_no}`
      if (!groups.has(k)) groups.set(k, [])
      groups.get(k).push(l)
    }
    const order = sortInvoicesForReconciliation(invoices, poLines).map(i => `${i.supplier}|${i.invoice_no}`)
    for (const k of groups.keys()) if (!order.includes(k)) order.push(k)
    for (const k of order) {
      const ls = (groups.get(k) || []).slice().sort((a, b) => comparePoThenPart(a, b, invoices))
      const inv = invoices.find(i => `${i.supplier}|${i.invoice_no}` === k)
      const head = ls[0] || {}
      aoa.push([`Invoice ${inv?.invoice_no || head.invoice_no}  ${inv?.supplier || head.supplier || ''}  PO ${inv?.po || ''}`])
      const first = aoa.length + 1
      const many = new Set(ls.map(poOf).filter(Boolean)).size > 1       // an invoice on two or more POs is grouped by PO, each group with its own heading
      let curPo = null
      for (const l of ls) {
        if (many && poOf(l) !== curPo) {
          curPo = poOf(l)
          const n = ls.filter(x => poOf(x) === curPo).length
          const r = new Array(NCOL).fill(null); r[1] = curPo ? `PO ${curPo}` : 'Not on a PO'; r[4] = `${n} line${n === 1 ? '' : 's'}`
          aoa.push(r)
        }
        const fr = freightAmountFor(l, invoices)
        const poq = poQtyForLine(l, poLines)
        if (fr !== null) {
          // freight: a charge, not goods. The freight amount goes in the invoice price column.
          aoa.push([l.invoice_no, poListOf(l), l.stock_code, l.supplier_code, l.description, poq, null, null, 'Freight', numOrNull(l.po_price), fr, fr, null, (l.flags || []).join('; '), l.variance_note || ''])
          formulas.push([aoa.length, 'freight'])
        } else {
          aoa.push([l.invoice_no, poListOf(l), l.stock_code, l.supplier_code, l.description, poq, +l.inv_qty, l.received === null || l.received === undefined ? null : +l.received,
            null, numOrNull(l.po_price), numOrNull(l.inv_price), null, null, (l.flags || []).join('; '), l.variance_note || ''])
          formulas.push([aoa.length, 'line', null, lineAmountFor(l, invoices)])
        }
      }
      const last = aoa.length
      const totalLabel = new Array(NCOL).fill(null); totalLabel[4] = 'Invoice total (goods)'
      aoa.push(totalLabel)
      formulas.push([aoa.length, 'total', [first, last]])
      const totalRow = aoa.length
      const { adj, printed } = invoiceExtras(inv)
      const at = label => { const r = new Array(NCOL).fill(null); r[4] = label; return r }
      let adjRow = null, printedRow = null
      if (adj) { aoa.push(at(`${adj.amount < 0 ? 'Less' : 'Plus'} ${adj.label}`)); adjRow = aoa.length; custom.push([adjRow, adj.amount]) }
      if (printed !== null) {
        aoa.push(at('Invoice total (printed)')); printedRow = aoa.length; custom.push([printedRow, printed])
        aoa.push(at('Lines and extras less printed total (0 = same)')); custom.push([aoa.length, null, `ROUND(L${totalRow}${adjRow ? `+L${adjRow}` : ''}-L${printedRow},2)`, [totalRow, adjRow, printedRow]])
      }
      aoa.push([])
    }
    const ws = XLSX.utils.aoa_to_sheet(aoa)
    for (const [n, kind, rng, val] of formulas) {
      if (kind === 'line') {
        ws[`I${n}`] = { t: 'n', f: `IF(H${n}="","",H${n}-G${n})` }
        if (val !== null && val !== undefined) ws[`L${n}`] = { t: 'n', v: val, z: '#,##0.00' }   // the amount printed on the invoice line
        ws[`M${n}`] = { t: 'n', f: `IF(OR(J${n}="",J${n}=0,K${n}="",ABS(K${n}-J${n})<=0.005000001),"",(K${n}-J${n})/J${n})`, z: '0%' }
        if (ws[`K${n}`]) ws[`K${n}`].z = '0.00'   // Inv Price shown to 2 decimals
      } else if (kind === 'total') {
        const sumCol = c => { let t = 0; for (let r = rng[0]; r <= rng[1]; r++) { const v = ws[`${c}${r}`]?.v; if (typeof v === 'number') t += v }; return Math.round(t * 100) / 100 }
        ws[`G${n}`] = { t: 'n', f: `SUM(G${rng[0]}:G${rng[1]})`, v: sumCol('G') }
        ws[`H${n}`] = { t: 'n', f: `SUM(H${rng[0]}:H${rng[1]})`, v: sumCol('H') }
        ws[`I${n}`] = { t: 'n', f: `H${n}-G${n}`, v: Math.round((sumCol('H') - sumCol('G')) * 100) / 100 }
        ws[`L${n}`] = { t: 'n', f: `SUM(L${rng[0]}:L${rng[1]})`, v: sumCol('L'), z: '#,##0.00' }

      const eom = date ? new Date(Date.UTC(+date.slice(0, 4), +date.slice(5, 7), 0)).toISOString().slice(0, 10) : ''
      const tax = usNum((txt.match(/OUTPUT TAX[^\n]*?([\d,]+\.\d{2})\s*$/m) || [])[1]) || 0
      const inv = {
        supplier: this.name, po: '', invoice_no: (p1.text.match(/INVOICE NO:\s*(\d+)/) || [])[1] || '', invoice_date: date,
        due_date: /30 DAYS END OF MONTH/i.test(p1.text) ? addDays(eom, 30) : '', currency: (p1.text.match(/CURRENCY\s*:\s*([A-Z]{3})/) || [])[1] || 'NZD',
        invoice_total: usNum((txt.match(/TOTAL AMOUNT\s+(?:[A-Z]{3}\s+)?([\d,]+\.\d{2})/) || [])[1]), lines: [], notes: [], source,
      }
      const COL = colsOf(['po', 100], ['qty', 140], ['part', 265], ['list', 335], ['disc', 385], ['unit', 480], ['net', Infinity])
      const pos = []
      let cur = null, inDesc = false
      for (const page of pages) for (const line of page.lines) {
        const c = cellsOf(line, COL)
        const po = (c.po || '').match(/^(\d{4,6})\b/)
        if (po && /^\d+$/.test(c.qty || '') && c.part && usNum(c.net) !== null) {
          const per = +((c.unit || '').match(/Per\s+(\d+)/i) || [])[1] || 1
          cur = addLine(inv, { po: po[1], code: c.part, qty: +c.qty, price: usNum(c.unit) / per, total: usNum(c.net) })
          if (!pos.includes(po[1])) pos.push(po[1])
          inDesc = true; continue
        }
        if (!cur || !c.part || c.po || c.qty) continue
        if (/^(Country of Origin|Delivery note|Sales Document)/i.test(c.part) || /^TOTAL|^OUTPUT/i.test(c.part)) { inDesc = false; continue }
        if (inDesc) appendDesc(cur, c.part)
      }
      inv.po = pos.join(', ')
      return [verify(inv, { extra: tax, extraLabel: 'GST' })]
    },
  }
  
  // ============================================================
  // PIX Germany GmbH (belts, EUR, numbers written 1,978.20). Each line takes three printed rows: the first has the Sr No, the first line
  // of "Description of Goods" (the PIX article name, A-35062000-B), Cama's own code ("Customer Material Code", 78-41943), quantity, net
  // price and value; the next has PIX's material number (10006794); the third has the weight. The part number is the article name; the
  // material number is kept as an alternative code and in the description, and Cama's code is our code. Freight, insurance, packing and
  // other charges below the lines are carried.
  // ============================================================
  const PIX = {
    name: 'PIX Germany GmbH', short: 'PIX',
    detect: t => /PIX GERMANY GMBH/i.test(t) && /Customer Material/i.test(t),
    parse(pages, source) {
      const p1 = pages[0], txt = pages.map(p => p.text).join('\n')
      const date = (txt.match(/Date:\s*(\d{2}\/\d{2}\/\d{4})/) || [])[1]
      const inv = {
        supplier: this.name, po: (txt.match(/Cust\. Order No\.:\s*(\d{4,})/) || [])[1] || '',
        invoice_no: lastItem(p1.lines.find(l => /^Invoice\b/.test(l.text) && /^\d{8,}$/.test(lastItem(l)))) || (p1.text.match(/\b3\d{9}\b/) || [])[0] || '',
        invoice_date: parseDate(date), due_date: parseDate((txt.match(/Due Date:\s*(\d{2}\/\d{2}\/\d{4})/) || [])[1]),
        currency: (txt.match(/amounts are in\s+([A-Z]{3})/i) || [])[1] || 'EUR', invoice_total: null, lines: [], notes: [], source,
      }
      const COL = colsOf(['sr', 38], ['desc', 120], ['cust', 205], ['hsn', 300], ['so', 355], ['qty', 412], ['unit', 432], ['price', 465], ['disc', 500], ['net', 545], ['amt', Infinity])
      let cur = null, extras = 0
      const pos = []
      for (const page of pages) for (const line of page.lines) {
        const c = cellsOf(line, COL)
        if (/^\d{1,3}$/.test(c.sr || '') && usNum(c.qty) !== null && usNum(c.amt) !== null && c.unit) {
          cur = addLine(inv, { code: c.desc || '', our_code: c.cust || '', alt_codes: [], desc: '', qty: usNum(c.qty), price: usNum(c.net) ?? usNum(c.price), total: usNum(c.amt) })
          continue
        }
        // the row under it: PIX's material number
        if (cur && !cur.desc && !c.sr && /^\d{6,}$/.test(c.desc || '')) { cur.desc = `Material ${c.desc}`; cur.alt_codes.push(c.desc); continue }
        if (/^(Freight|Insurance|Packing Charges|Other Charges)$/i.test((c.sr ? '' : c.desc) || '') && line.items.at(-1).x >= 540 && usNum(lastItem(line)) !== null) extras += usNum(lastItem(line))
        if (/^Total$/.test(c.desc || '') && usNum(lastItem(line)) !== null) inv.invoice_total = usNum(lastItem(line))
      }
      extras = Math.round(extras * 100) / 100
      return [verify(inv, { extra: extras, extraLabel: 'freight, insurance and charges' })]
    },
  }
  
  // ============================================================
  // Cox Industries (Australia). A line reads "CSCKAIOU 9PJ710: SCARIFIER BELT 9PJ710": the part number is what comes before the colon
  // (Cox's prefix and the model), the model on its own (9PJ710) is kept as an alternative code, and the rest is the description. The price
  // has four decimals. "QTY SUP" is what was supplied (back-ordered lines are listed under "B/O" and are not on the invoice). Order No. is the PO.
  // Tax, if any, is carried as an amount outside the lines.
  // ============================================================
  const COX = {
    name: 'Cox Industries (Australia)', short: 'Cox',
    detect: t => /Cox Industries/i.test(t) && /Tax Invoice/i.test(t),
    parse(pages, source) {
      const p1 = pages[0], txt = pages.map(p => p.text).join('\n')
      const flat = txt.replace(/\s+/g, ' ')
      const valueOf = re => lastItem(p1.lines.find(l => re.test(l.text)))
      const poRow = valuesBelow(p1, /Order No\./, 2)
      const taxLine = pages.flatMap(p => p.lines).find(l => /^Tax\s+Total:/.test(l.text))
      const inv = {
        supplier: this.name, po: (poRow.find(i => i.x < 120 && /^\d{4,6}$/.test(i.str)) || {}).str || '',
        invoice_no: lastItem(p1.lines.find(l => l.items.some(i => i.str === 'No:' && i.x > 400))),
        invoice_date: parseDate(valueOf(/^Date:/) || valueOf(/\bDate:\s+\d/)), due_date: parseDate(lastItem(p1.lines.find(l => /Due\s+Date:/.test(l.text)))),
        currency: (flat.match(/Total\s+([A-Z]{3})\s*:/) || [])[1] || 'AUD', invoice_total: null, lines: [], notes: [], source,
      }
      const totLine = pages.flatMap(p => p.lines).find(l => /Total\s+[A-Z]{3}\s*:/.test(l.text))
      if (totLine) inv.invoice_total = usNum(lastItem(totLine))
      const tax = taxLine ? usNum(lastItem(taxLine)) || 0 : 0
      const COL = colsOf(['desc', 290], ['ord', 335], ['sup', 370], ['price', 430], ['disc', 500], ['total', Infinity])
      let cur = null
      for (const page of pages) {
        let inTable = false
        for (const line of page.lines) {
          if (/CODE\s*&\s*DESCRIPTION/.test(line.text)) { inTable = true; continue }
          if (/^Item\s+Description\s+B\/O|^Payment Terms|Sub\s+Total:/.test(line.text)) { inTable = false; cur = null }
          if (!inTable) continue
          const c = cellsOf(line, COL)
          const qty = usNum(c.sup), total = usNum(c.total)
          if (c.desc && qty !== null && total !== null) {
            if (!qty) { cur = null; continue }   // nothing supplied
            const m = c.desc.match(/^(.*?):\s*(.*)$/)
            const code = (m ? m[1] : c.desc).trim(), model = code.split(/\s+/).at(-1)
            const disc = usNum(c.disc) || 0
            cur = addLine(inv, { code, alt_codes: model && model !== code ? [model] : [], desc: m ? m[2] : '', qty, price: disc ? Math.round(total / qty * 10000) / 10000 : usNum(c.price), total })
          } else if (cur && c.desc && !c.ord && !c.sup && !c.total) appendDesc(cur, c.desc)
        }
      }
      // the offer is printed in the left half of the page, with the totals in the right half on the same lines: read the left half only
      const left = pages.flatMap(p => p.lines.map(l => l.items.filter(i => i.x < 410).map(i => i.str).join(' '))).join(' ').replace(/\s+/g, ' ')
      const es = left.match(/early Settlement Discount of ([\d.]+%).*?paid by the ([\d/]+).*?immediate saving of \$([\d,.]+).*?revised invoice amount is \$([\d,.]+)/i)
      if (es) inv.notes.push(`Early settlement: ${es[1]} off if paid by ${es[2]}, a saving of $${es[3]} (pay $${es[4]}).`)
      return [verify(inv, { extra: tax, extraLabel: 'tax' })]
    },
  }

  // Turn pdf.js text items into pdfplumber-like lines: [{text, x0, y, items:[{str, x, w}]}], with the page size
  // opts: extra getDocument options, e.g. cMapUrl so PDFs with Japanese (Shift-JIS) fonts such as Yamabiko's can be read
  async function pdfToPages(pdfjs, data, opts = {}) {
    const doc = await pdfjs.getDocument({ data, isEvalSupported: false, useSystemFonts: false, ...opts }).promise
    const pages = []
    for (let p = 1; p <= doc.numPages; p++) {
      const page = await doc.getPage(p)
      const tc = await page.getTextContent()
      const items = tc.items
        .filter(it => it.str && it.str.trim() !== '')
        .map(it => ({ str: it.str, x: it.transform[4], y: it.transform[5], w: it.width, h: Math.abs(it.transform[3]) || 8 }))
      // group into lines by y (top-down), tolerance ~ 3 units
      items.sort((a, b) => b.y - a.y || a.x - b.x)
      const rows = []
      for (const it of items) {
        const row = rows.find(r => Math.abs(r.y - it.y) <= 3)
        if (row) row.items.push(it); else rows.push({ y: it.y, items: [it] })
      }
      rows.sort((a, b) => b.y - a.y)
      const lines = rows.map(r => {
        r.items.sort((a, b) => a.x - b.x)
        let text = ''
        let lastEnd = null
        for (const it of r.items) {
          if (lastEnd !== null) {
            const gap = it.x - lastEnd
            if (gap > 1.5 && !text.endsWith(' ') && !it.str.startsWith(' ')) text += ' '
          }
          text += it.str
          lastEnd = it.x + it.w
        }
        return { text: text.replace(/\s+/g, ' ').trim(), x0: r.items[0].x, y: r.y, items: r.items.map(it => ({ str: it.str, x: it.x, w: it.w })) }
      })
      pages.push({ lines, text: lines.map(l => l.text).join('\n'), width: page.view[2] - page.view[0], height: page.view[3] - page.view[1] })
    }
    return pages
  }

  // Works out, in the browser and for free, how a file will be read: by one of the readers in this page, or by Azure (a paid service).
  // Same decision as readFile makes, so what the alert says is what happens.
  async function routeOf(file) {
    const ext = file.name.split('.').pop().toLowerCase()
    const buf = await file.arrayBuffer()
    if (['xlsx', 'xls', 'xlsm', 'csv'].includes(ext)) {
      const wb = XLSX.read(buf, { type: 'array', cellDates: true })
      const grid = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: true, defval: '' })
      if (findPoHeader(grid)) return { route: 'free', label: 'MYOB PO export' }
      const profile = EXCEL_PROFILES.find(p => p.detect(grid))
      return profile ? { route: 'free', label: `${profile.name} reader` } : { route: 'none' }
    }
    if (ext === 'json') return { route: 'free', label: 'saved Azure result' }
    if (ext === 'pdf') {
      const pages = await pdfToPages(pdfjs, new Uint8Array(buf.slice(0)), { cMapUrl: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/cmaps/', cMapPacked: true })
      const firstText = pages[0]?.text || ''
      const profile = firstText.trim() && PDF_PROFILES.find(p => p.detect(firstText))
      if (profile) { try { if (profile.parse(pages, file.name).some(i => i.lines.length)) return { route: 'free', label: `${profile.name} reader` } } catch { /* falls through to Azure, as readFile does */ } }
      return { route: 'azure', pages: pages.length, text: firstText.trim().length > 40 }
    }
    return { route: 'none' }
  }
  function addFiles(list) {
    const added = []
    for (const f of list) if (!picked.some(p => p.file.name === f.name && p.file.size === f.size)) { const p = { file: f, status: 'waiting', routing: true }; picked.push(p); added.push(p) }
    renderFileList()
    for (const p of added) routeOf(p.file).then(r => { p.route = r }).catch(() => { p.route = { route: 'unknown' } }).finally(() => { p.routing = false; renderFileList() })
  }
  const azureFiles = () => picked.filter(p => p.route && p.route.route === 'azure')
  const azureText = files => {
    const pages = files.reduce((s, p) => s + (p.route.pages || 0), 0)
    return `${files.length === 1 ? 'This file' : `${files.length} files`} will be sent to Azure to be read, which is a paid service (about 1 cent a page, ${pages} page${pages === 1 ? '' : 's'} here). A file that has been read before uses its saved copy at no charge.`
  }
  function renderFileList(busy = false) {
    $('fileList').innerHTML = picked.map((p, i) => {
      const ext = p.file.name.split('.').pop().toUpperCase()
      const status = p.status === 'waiting' ? 'Ready'
        : p.status === 'reading' ? 'Reading…'
        : p.status === 'done' ? esc(p.summary) : esc(p.error)
      const cls = p.status === 'done' ? 'ok' : p.status === 'error' ? 'err' : ''
      const r = p.route
      const pill = p.routing ? '<span class="route-pill">Checking…</span>'
        : r && r.route === 'free' ? `<span class="route-pill free" title="Read in this page: free">Free · ${esc(r.label)}</span>`
        : r && r.route === 'azure' ? `<span class="route-pill azure" title="Sent to Azure to be read: a paid service">Azure · paid · ${r.pages} page${r.pages === 1 ? '' : 's'}</span>`
        : r && r.route === 'none' ? '<span class="route-pill none">Not recognised</span>' : ''
      return `<div class="file-row ${r && r.route === 'azure' ? 'file-azure' : ''}">
        <div class="file-ext">${esc(ext)}</div>
        <div><div class="file-name">${esc(p.file.name)} ${pill}</div><div class="file-status ${cls}">${status}</div></div>
        ${busy ? '<span></span>' : `<button class="file-remove" data-i="${i}" aria-label="Remove ${esc(p.file.name)}">×</button>`}
      </div>`
    }).join('')
    $('fileList').querySelectorAll('.file-remove').forEach(b => b.onclick = () => { picked.splice(+b.dataset.i, 1); renderFileList() })
    const az = azureFiles()
    if ($('azureAlert')) $('azureAlert').innerHTML = az.length && !busy ? `<div class="notice warn azure-alert" role="alert"><strong>&#9888; Azure charge.</strong> ${esc(azureText(az))}<br><span class="muted">${az.map(p => esc(p.file.name)).join(', ')}. Remove ${az.length === 1 ? 'it' : 'them'} to avoid the charge. If you want these read free, send a sample so a reader can be built for the supplier.</span></div>` : ''
    $('matchBtn').disabled = busy || !picked.length || picked.some(p => p.routing)
  }

  const safeName = n => n.replace(/[^A-Za-z0-9._-]+/g, '_')
  // crypto.randomUUID needs https; fall back for other cases
  const uuid = () => crypto.randomUUID ? crypto.randomUUID()
    : ([1e7] + -1e3 + -4e3 + -8e3 + -1e11).replace(/[018]/g, c => (c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4).toString(16))

  async function invokeError(error) {
    try { const body = await error.context.json(); return body.error || error.message } catch { return error.message }
  }

  // Read one file. Returns {kind, invoices, po_lines, summary}
  async function readFile(file, path) {
    const ext = file.name.split('.').pop().toLowerCase()
    const buf = await file.arrayBuffer()
    if (['xlsx', 'xls', 'xlsm', 'csv'].includes(ext)) {
      const wb = XLSX.read(buf, { type: 'array', cellDates: true })
      const grid = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: true, defval: '' })
      const hdr = findPoHeader(grid)
      if (hdr) {
        const po_lines = readPoExport(grid, hdr, file.name)
        const pos = [...new Set(po_lines.map(l => l.po))]
        return { kind: 'po', invoices: [], po_lines, summary: `MYOB PO export: PO ${pos.join(', ')} (${plural(po_lines.length, 'line')})` }
      }
      const profile = EXCEL_PROFILES.find(p => p.detect(grid))
      if (!profile) throw new Error('Spreadsheet not recognised: not a MYOB PO export, and no supplier profile matches it yet.')
      const parsed = profile.parse(grid, file.name)
      return invoiceResult((Array.isArray(parsed) ? parsed : [parsed]).map(inv => finishInvoice(inv, 'Excel')))
    }
    if (ext === 'json') {
      return invoiceResult(parseAzureResult(JSON.parse(new TextDecoder().decode(buf)), file.name).map(i => finishInvoice(i, 'Azure')))
    }
    if (ext === 'pdf') {
      const pages = await pdfToPages(pdfjs, new Uint8Array(buf.slice(0)), { cMapUrl: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/cmaps/', cMapPacked: true })
      const firstText = pages[0]?.text || ''
      const profile = firstText.trim() && PDF_PROFILES.find(p => p.detect(firstText))
      if (profile) {
        const read = profile.parse(pages, file.name)
        if (read.some(i => i.lines.length)) return invoiceResult(read.map(i => finishInvoice(i, profile.short || profile.name.split(' ')[0])))
      }
      const { data, error } = await supabase.functions.invoke('read-invoice', { body: { path } })
      if (error) throw new Error(await invokeError(error))
      const textPdf = firstText.trim().length > 40   // a PDF with real (selectable) text could be read free, if this supplier had a reader here
      return invoiceResult(parseAzureResult(data.result, file.name).map(i => {
        if (textPdf) i.notes = [...(i.notes || []), 'Read by Azure. This PDF has real text, so a free in-app reader could be built for this supplier: send a sample PDF to have one made.']
        return finishInvoice(i, data.cached ? 'Azure, saved copy' : 'Azure')
      }))
    }
    throw new Error(`.${ext} files aren't supported. Use PDF, Excel, CSV or Azure JSON.`)
  }
  function invoiceResult(invoices) {
    if (!invoices.length) throw new Error('No invoice found in this file.')
    const summary = invoices.map(i => `${i.supplier || 'Unknown supplier'} invoice ${i.invoice_no} (${plural(i.lines.length, 'line')})`).join('; ')
    return { kind: 'invoice', invoices, po_lines: [], summary }
  }

  // ---------- MYOB data synced into Supabase by the sync program ----------
  async function loadMyobPOs(poNumbers) {
    const rows = []
    for (let from = 0; ; from += 1000) {
      // ORDER BY the key: without it a database may return pages that overlap or skip rows, which loses PO lines on big POs
      const { data, error } = await supabase.from('myob_po_lines').select('*').in('po', poNumbers).order('line_id').range(from, from + 999)
      if (error) throw new Error(error.message)
      rows.push(...data)
      if (data.length < 1000) break
    }
    const seen = new Set()
    return rows.filter(r => !r.line_id || (seen.has(r.line_id) ? false : seen.add(r.line_id))).map(r => ({
      po: r.po, order_date: r.order_date || '', due_date: r.due_date || '', supplier: r.supplier || '', currency: r.currency || '',
      stock_code: r.stock_code, supplier_code: r.supplier_code || '', desc: r.description || '', qty: +r.qty || 0,
      price: r.price === null ? null : +r.price, bin: r.bin || '', line_id: r.line_id || '', gtin: r.gtin || '', source: 'MYOB',
    }))
  }
  const poNumbersOn = invoices => [...new Set((invoices.flatMap(i => [i.po, ...i.lines.map(l => l.po)]).join(' ').match(/\d{4,}/g)) || [])]
  const fmtTime = iso => new Date(iso).toLocaleString('en-NZ', { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' })

  // POs named on the invoices that no PO lines cover yet: look them up in the MYOB sync.
  // Adds lines to poLines, and adds a note to files / problems.
  async function addMyobLookup(invoices, poLines, files, problems, say = () => {}) {
    const wanted = poNumbersOn(invoices).filter(n => !poLines.some(l => l.po === n))
    if (!wanted.length) return
    say('Looking up POs in MYOB…')
    try {
      const found = await loadMyobPOs(wanted)
      const { data: st } = await supabase.from('myob_sync').select('last_ok').eq('id', 1).maybeSingle()
      const when = st?.last_ok ? ` (MYOB data from ${fmtTime(st.last_ok)})` : ''
      const got = [...new Set(found.map(l => l.po))]
      if (found.length) {
        poLines.push(...found)
        files.push({ name: 'MYOB', path: '', kind: 'myob', summary: `PO ${got.join(', ')} from MYOB, ${plural(found.length, 'line')}${when}` })
      }
      const missing = wanted.filter(n => !got.includes(n))
      if (missing.length) problems.push({ name: 'MYOB', error: `PO ${missing.join(', ')} not found among the open POs synced from MYOB${when}. It may be fully received, or the number on the invoice may be wrong.` })
    } catch (e) {
      problems.push({ name: 'MYOB', error: `Couldn't look up POs in MYOB: ${e.message}` })
    }
  }

  // The 60 most recent shipments with their invoice lists (used by Invoice Creation and Shipment Reconciliation)
  async function loadShipmentCards() {

      .select('id, created_at, name, status, suppliers, invoice_nos, pos, summary, invoice_list').order('created_at', { ascending: false }).limit(60)
    if (error) throw new Error(error.message)

    const legacy = data.filter(s => !(s.invoice_list || []).length && (s.invoice_nos || []).length)
    if (legacy.length) {
      const { data: full } = await supabase.from('shipments').select('id, invoices').in('id', legacy.map(s => s.id))
      for (const f of full || []) { const s = data.find(x => x.id === f.id); if (s) s.invoice_list = (f.invoices || []).map(invoiceBrief) }
    }
    return data
  }

  async function refreshShipmentList() {
    const box = $('shipmentList'); if (!box) return
    try {
      const data = await loadShipmentCards()
      shipList = data
      const sel = $('shipSel')
      if (sel) {
        const keep = sel.value
        sel.innerHTML = `<option value="new">A new shipment</option>` + data.filter(s => s.status !== 'received')
          .map(s => `<option value="${s.id}">${esc(shipName(s))}</option>`).join('')
        sel.value = [...sel.options].some(o => o.value === keep) ? keep : 'new'
        $('newNameRow').style.display = sel.value === 'new' ? '' : 'none'
      }
      const open = data.filter(s => s.status !== 'received')   // completed shipments are in Completed Shipments, not here
      box.innerHTML = open.length ? open.map(shipCardHtml).join('') : `<div class="empty-state">No open shipments. Add invoices above to start one.</div>`
    } catch (e) { box.innerHTML = `<div class="notice err">${esc(friendlyDbError(e))}</div>` }
  }

          <button class="btn ghost" data-act="refreshpo" data-id="${s.id}" title="Reload the PO lines from the latest MYOB sync, then match again. Use it if the PO changed in MYOB after the invoice was added. Counts are kept.">Refresh PO from MYOB</button>
          ${me.is_manager ? `<button class="btn danger" data-act="delete" data-id="${s.id}">Delete</button>` : ''}
        </div>

      <div class="ship-meta">${esc(fmtWhen(s.created_at))} · ${plural(invs.length || (s.invoice_nos || []).length, 'invoice')} · ${plural(sm.lines || 0, 'line')} · ${fmtQty(sm.pcs || 0)} pcs${toCheck ? ` · <a class="warn-text" href="#/edit/${s.id}" title="Open Shipment Edit on these lines">${toCheck} to check</a>` : ''}</div>
      <div class="table-wrap"><table class="grid inv-table">
        <thead><tr><th>Invoice</th><th>Supplier</th><th>PO</th><th class="num">Lines</th><th class="num">Pieces</th><th class="num">Total</th><th></th></tr></thead>
        <tbody>${rows}</tbody></table></div>
    </div>`
  }

  function onShipmentClick(ev) {
    const b = ev.target.closest('[data-act]'); if (!b) return
    const id = b.dataset.id, act = b.dataset.act
    if (act === 'rename') return startRename(id)
    if (act === 'rename-save') return saveRename(id)
    if (act === 'rename-cancel') return refreshShipmentList()
    if (act === 'rematch') return rematchShipment(id)
    if (act === 'refreshpo') return refreshPoShipment(id)
    if (act === 'delete') return deleteShipment(id)
    if (act === 'remove') return removeInvoice(id, b.dataset.key)
  }
  function onShipmentChange(ev) {
    const sel = ev.target.closest('.move-sel'); if (!sel || !sel.value) return
    const to = sel.value, from = sel.dataset.id, key = sel.dataset.key
    sel.value = ''
    moveInvoice(from, key, to)
  }

  // ---------- rename ----------
  function startRename(id) {
    const card = $('shipmentList').querySelector(`.ship-card[data-id="${id}"]`); if (!card) return
    const s = shipList.find(x => x.id === id)
    card.querySelector('.ship-title').innerHTML = `<span class="ship-name"><input type="text" class="rename-input" maxlength="80" value="${esc(shipName(s))}" aria-label="Shipment name"></span>
      <button class="btn" data-act="rename-save" data-id="${id}">Save</button> <button class="btn ghost" data-act="rename-cancel" data-id="${id}">Cancel</button>`
    const inp = card.querySelector('.rename-input'); inp.focus(); inp.select()
  }
  async function saveRename(id) {
    const inp = $('shipmentList').querySelector(`.ship-card[data-id="${id}"] .rename-input`); if (!inp) return
    const name = inp.value.trim()
    if (!name) { inp.focus(); return }
    const { error } = await supabase.from('shipments').update({ name }).eq('id', id)
    if (error) { alert(`Couldn't rename: ${friendlyDbError(error)}`); return }
    shipOptionsCache.at = 0
    await refreshShipmentList()
  }

  // ---------- running an operation on the shipment list ----------
  async function runOp(label, fn) {
    if (listBusy) return
    listBusy = true
    $('shipmentList')?.classList.add('busy')
    if ($('opMsg')) $('opMsg').textContent = label
    let ok = '', err = ''
    try { ok = await fn() } catch (e) { err = friendlyDbError(e) }
    listBusy = false
    shipOptionsCache.at = 0
    if ($('shipmentList')) {
      $('shipmentList').classList.remove('busy')
      if ($('opMsg')) $('opMsg').textContent = ''
      if ($('opNote')) $('opNote').innerHTML = err ? `<div class="notice err">${esc(label.replace(/…$/, ''))} failed: ${esc(err)}</div>` : (ok ? `<div class="notice ok">${ok}</div>` : '')
      await refreshShipmentList()
    }
  }

  // ---------- create / sync ----------
  async function createShipmentRow(name = '', id = uuid()) {
    const row = { id, created_by: me.staffno, name, status: 'open', suppliers: [], invoice_nos: [], pos: [], summary: {}, invoices: [], invoice_list: [], po_lines: [], still_open: [], files: [], problems: [] }
    const { error } = await supabase.from('shipments').insert(row)
    if (error) throw new Error(error.message)
    return { ...row, created_at: new Date().toISOString() }
  }

  // Match every invoice in the shipment together and bring the saved lines up to date.
  // Counts are carried over per item (see planLineSync).
  async function syncShipment(ship, say = () => {}) {
    const invoices = ship.invoices, poLines = ship.po_lines, files = ship.files
    const problems = (ship.problems || []).filter(p => p.name !== 'MYOB')
    await addMyobLookup(invoices, poLines, files, problems, say)
    const result = matchShipment(invoices, poLines)
    const summary = summarise(invoices, poLines, result)
    const oldLines = await fetchLines(ship.id, true)
    const plan = planLineSync(oldLines, result.rows)
    const goods = plan.items.filter(i => !isFreightFlags(i.fields.flags))   // freight is a charge, it isn't counted
    const allCounted = goods.length > 0 && goods.every(i => i.fields.received !== null && i.fields.received !== undefined)
    // The status is only changed by Confirm shipment, Complete shipment and Reopen. The one exception: new goods added to a counted
    // shipment have not been counted, so it goes back to open.
    const status = ship.status === 'counted' && goods.some(i => !i.old) ? 'open' : (ship.status || 'open')
    if (ship.summary && ship.summary.completed_at) { summary.completed_at = ship.summary.completed_at; summary.completed_by = ship.summary.completed_by }
    const name = (ship.name && ship.name.trim()) || autoName(summary.suppliers)
    const { error: shErr } = await supabase.from('shipments').update({
      name, status, suppliers: summary.suppliers, invoice_nos: summary.invoices, pos: summary.pos, summary, invoices,
      invoice_list: invoices.map(invoiceBrief), po_lines: poLines, still_open: result.still_open, files, problems,
    }).eq('id', ship.id)
    if (shErr) throw new Error(shErr.message)

    const inserts = plan.items.filter(i => !i.old).map(i => ({ shipment_id: ship.id, ...i.fields }))
    const updates = plan.items.filter(i => i.old && lineChanged(i.old, i.fields)).map(i => ({ id: i.old.id, patch: i.fields }))
    for (let k = 0; k < updates.length; k += 8) {
      const res = await Promise.all(updates.slice(k, k + 8).map(u => supabase.from('shipment_lines').update(u.patch).eq('id', u.id)))
      const bad = res.find(r => r.error); if (bad) throw new Error(`Couldn't save some lines (${bad.error.message}). Run Re-match to finish.`)
    }
    for (let k = 0; k < inserts.length; k += 500) {
      const { error } = await supabase.from('shipment_lines').insert(inserts.slice(k, k + 500))
      if (error) throw new Error(`Couldn't save the lines (${error.message}). Run Re-match to finish.`)
    }
    for (let k = 0; k < plan.deletes.length; k += 100) {
      const { error } = await supabase.from('shipment_lines').delete().in('id', plan.deletes.slice(k, k + 100))
      if (error) throw new Error(`Couldn't remove old lines (${error.message}). Run Re-match to finish.`)
    }
    const changed = plan.items.filter(i => i.old && (i.old.stock_code !== i.fields.stock_code || i.old.status !== i.fields.status || JSON.stringify(i.old.flags) !== JSON.stringify(i.fields.flags))).length
    const newlyMatched = plan.items.filter(i => i.old && i.old.status === 'not_on_po' && i.fields.status !== 'not_on_po').length
    return { name, result, summary, changed, newlyMatched, added: inserts.length, removed: plan.deletes.length }
  }

  // ---------- add invoices ----------
  // The same invoice can arrive twice in one drop (for example Rotary's PDF and the Excel list that holds the same invoice). Keep one,
  // preferring the PDF (the invoice itself) over a spreadsheet, and say so on the invoice, so it isn't counted twice.
  function dedupeBatch(list) {
    const kept = new Map(), out = []
    for (const inv of list) {
      const key = inv.invoice_no ? `${String(inv.supplier || '').toUpperCase()}|${inv.invoice_no}` : null
      if (!key) { out.push(inv); continue }
      const have = kept.get(key)
      if (!have) { kept.set(key, inv); out.push(inv); continue }
      const rank = i => (i.reader === 'Excel' ? 1 : 2)
      const [win, lose] = rank(inv) > rank(have) ? [inv, have] : [have, inv]
      if (win === inv) { out[out.indexOf(have)] = inv; kept.set(key, inv) }
      win.notes = [...(win.notes || []), `This invoice was also in ${lose.source} (${lose.reader}). That copy was not added, so the invoice isn't counted twice.`]
    }
    return out
  }

  async function dropDuplicates(newInvoices) {
    const keep = []
    for (const inv of newInvoices) {
      if (inv.invoice_no) {
        const { data } = await supabase.from('shipments').select('id, name, suppliers, invoice_nos').contains('invoice_nos', [inv.invoice_no])
        const hit = (data || [])[0]
        if (hit && !confirm(`Invoice ${inv.invoice_no} (${inv.supplier || 'unknown supplier'}) is already in the shipment "${shipName(hit)}".\n\nAdd it again anyway?`)) continue
      }
      keep.push(inv)
    }
    return keep
  }

  async function runMatch() {
    const az = azureFiles()
    if (az.length && !confirm(`${azureText(az)}\n\n${az.map(p => '• ' + p.file.name).join('\n')}\n\nSend ${az.length === 1 ? 'it' : 'them'} to Azure and carry on?`)) return
    const choice = $('shipSel').value
    const typedName = ($('newName')?.value || '').trim()
    const isNew = choice === 'new'
    const msg = t => { if ($('matchMsg')) $('matchMsg').textContent = t }
    renderFileList(true); msg('Reading files…')
    let ship = null
    try {
      ship = isNew ? null : await getFullShipment(choice)
    } catch (e) { msg(friendlyDbError(e)); renderFileList(false); return }
    const shipId = isNew ? uuid() : ship.id

    let newInvoices = [], newPoLines = []
    const newFiles = [], problems = []
    for (const p of picked) {
      p.status = 'reading'; renderFileList(true)
      const path = `${shipId}/${safeName(p.file.name)}`
      try {
        const { error: upErr } = await supabase.storage.from(BUCKET).upload(path, p.file, { upsert: true })
        if (upErr) throw new Error(`Upload failed: ${upErr.message}`)
        const r = await readFile(p.file, path)
        p.status = 'done'; p.summary = r.summary
        newInvoices.push(...r.invoices); newPoLines.push(...r.po_lines)
        newFiles.push({ name: p.file.name, path, kind: r.kind, summary: r.summary })
      } catch (e) {
        p.status = 'error'; p.error = e.message || String(e)
        problems.push({ name: p.file.name, error: p.error })
      }
      renderFileList(true)
    }
    if (!newInvoices.length) {
      msg(problems.length ? 'No invoice could be read. See the messages above.' : 'Add at least one supplier invoice.')
      renderFileList(false); return
    }
    // an invoice that prints no PO number takes the one typed in the PO box, if there is one
    const poHint = ($('poHint')?.value || '').trim().match(/\d{4,}/)?.[0]
    if (poHint) for (const inv of newInvoices) if (!String(inv.po || '').match(/\d{4,}/) && !inv.lines.some(l => String(l.po || '').match(/\d{4,}/))) {
      inv.po = poHint; inv.lines.forEach(l => { l.po = poHint })
      inv.notes = [...(inv.notes || []).filter(n => !/PO number/.test(n)), `PO ${poHint} was entered when the invoice was added.`]
    }
    newInvoices = await dropDuplicates(dedupeBatch(newInvoices))
    if (!newInvoices.length) { msg('Nothing to add.'); renderFileList(false); return }

    msg('Matching and saving…')
    try {
      if (isNew) ship = await createShipmentRow(typedName, shipId)
      // an uploaded PO export replaces what the shipment held for those POs
      if (newPoLines.length) {
        const covered = new Set(newPoLines.map(l => l.po))
        ship.po_lines = ship.po_lines.filter(l => !covered.has(l.po)).concat(newPoLines)
      }
      ship.invoices = [...ship.invoices, ...newInvoices]
      ship.files = [...ship.files, ...newFiles]
      ship.problems = [...(ship.problems || []), ...problems]
      const r = await syncShipment(ship, msg)
      rememberShipment(shipId)
      shipOptionsCache.at = 0
      const fails = [...problems, ...(await currentMyobProblems(shipId))]
      invoiceNote = {
        cls: fails.length ? 'warn' : 'ok',
        html: `Added ${plural(newInvoices.length, 'invoice')} to <strong>${esc(r.name)}</strong>. `
          + (r.summary.not_on_po ? `${plural(r.summary.not_on_po, 'line')} not on a PO: <a href="#/edit/${shipId}">add our codes in Shipment Edit</a>, or ` : '')
          + `<a href="#/count/${shipId}">open Shipment Count</a>`
          + fails.map(f => `<div class="fail">${esc(f.name)}: ${esc(f.error)}</div>`).join(''),
      }
    } catch (e) {
      msg(`Couldn't save: ${friendlyDbError(e)}`)
      renderFileList(false)
      return
    }
    await showInvoices()
  }
  async function currentMyobProblems(id) {
    const { data } = await supabase.from('shipments').select('problems').eq('id', id).maybeSingle()
    return ((data && data.problems) || []).filter(p => p.name === 'MYOB')
  }

  // ---------- re-match / move / remove / delete ----------
  // Matching uses the PO lines SAVED with the shipment when its invoices were added (so entering the goods receipt in MYOB later
  // can't un-match anything). If the PO changed in MYOB since (a supplier part number added or corrected, lines added), this reloads
  // the PO lines from the latest MYOB sync and matches again. Counts are kept. POs the sync no longer has keep their saved lines.
  async function refreshPoLines(id) {
    const ship = await getFullShipment(id)
    const wanted = poNumbersOn(ship.invoices)
    if (!wanted.length) throw new Error('This shipment has no PO numbers to look up.')
    const found = await loadMyobPOs(wanted)
    const got = [...new Set(found.map(l => l.po))]
    const { data: st } = await supabase.from('myob_sync').select('last_ok').eq('id', 1).maybeSingle()
    const when = st?.last_ok ? ` (MYOB data from ${fmtTime(st.last_ok)})` : ''
    if (!got.length) throw new Error(`PO ${wanted.join(', ')} isn't in the MYOB sync${when}. It may be fully received or closed in MYOB, so the saved lines were kept.`)
    const kept = wanted.filter(n => !got.includes(n) && ship.po_lines.some(l => l.po === n))
    const before = ship.po_lines.filter(l => got.includes(l.po)).length
    ship.po_lines = ship.po_lines.filter(l => !got.includes(l.po)).concat(found)
    ship.files = (ship.files || []).filter(f => f.kind !== 'myob').concat([{ name: 'MYOB', path: '', kind: 'myob', summary: `PO ${got.join(', ')} from MYOB, ${plural(found.length, 'line')}${when}` }])
    const r = await syncShipment(ship)
    return `Reloaded the PO lines for <strong>${esc(r.name)}</strong>: PO ${esc(got.join(', '))} now has ${plural(found.length, 'line')} (it had ${before})${st?.last_ok ? `, MYOB data from ${esc(fmtTime(st.last_ok))}` : ''}. `
      + (r.newlyMatched ? `<strong>${plural(r.newlyMatched, 'line')}</strong> newly matched to a PO. ` : 'No line changed to matched. ')
      + (kept.length ? `PO ${esc(kept.join(', '))} isn't in the MYOB sync any more, so its saved lines were kept. ` : '')
      + 'Counts were kept.'
  }
  function refreshPoShipment(id) {
    if (!confirm("Reload this shipment's PO lines from MYOB?\n\nUse this if the PO has changed in MYOB since the invoice was added (a supplier part number added or corrected, or lines added). The invoices are then matched again and counts are kept.\n\nDon't use it after the goods receipt has been entered in MYOB: received lines drop off the PO there, so they would stop matching.")) return
    return runOp('Reloading PO lines from MYOB…', () => refreshPoLines(id))
  }

  function rematchShipment(id) {
    if (!confirm('Re-match this shipment?\n\nAll its invoices are matched to the PO lines again, using the latest matching rules. Counts already entered are kept.\n\nMake sure nobody is counting this shipment right now.')) return
    return runOp('Re-matching…', async () => {
      const r = await syncShipment(await getFullShipment(id))
      return r.changed === 0 && !r.added && !r.removed
        ? `Re-matched <strong>${esc(r.name)}</strong>. Nothing changed.`
        : `Re-matched <strong>${esc(r.name)}</strong>. ${plural(r.changed, 'line')} changed${r.newlyMatched ? `, ${r.newlyMatched} newly matched to a PO` : ''}. Counts already entered were kept.`
    })
  }

  function moveInvoice(fromId, key, toId) {
    const label = toId === 'new' ? 'a new shipment' : `"${shipName(shipList.find(s => s.id === toId) || {})}"`
    if (!confirm(`Move this invoice to ${label}?\n\nBoth shipments are matched again. Counts already entered for this invoice's lines do not move with it, so move invoices before counting.`)) return
    return runOp('Moving invoice…', async () => {
      const from = await getFullShipment(fromId)
      const inv = from.invoices.find(i => invKey(i) === key)
      if (!inv) throw new Error('That invoice is no longer in the shipment.')
      const to = toId === 'new' ? await createShipmentRow('') : await getFullShipment(toId)
      // the invoice brings the PO lines it needs
      const needed = new Set(poNumbersOn([inv])), have = new Set(to.po_lines.map(l => l.po))
      to.po_lines = to.po_lines.concat(from.po_lines.filter(l => needed.has(l.po) && !have.has(l.po)))
      to.invoices = [...to.invoices, inv]
      from.invoices = from.invoices.filter(i => i !== inv)
      const stays = from.invoices.some(i => i.source === inv.source)
      const file = !stays && from.files.find(f => f.name === inv.source)
      if (file) { from.files = from.files.filter(f => f !== file); to.files = [...to.files, file] }
      const t = await syncShipment(to)
      await syncShipment(from)
      return `Moved invoice <strong>${esc(inv.invoice_no)}</strong> to <strong>${esc(t.name)}</strong>.`
    })
  }

  function removeInvoice(id, key) {
    const s = shipList.find(x => x.id === id)
    const inv = (s?.invoice_list || []).find(i => i.key === key)
    if (!confirm(`Remove invoice ${inv?.invoice_no || ''} from this shipment?\n\nThe shipment is matched again without it. Counts allocated to this invoice's lines are removed with it; counts for other invoices stay.`)) return
    return runOp('Removing invoice…', async () => {
      const ship = await getFullShipment(id)
      const found = ship.invoices.find(i => invKey(i) === key)
      if (!found) throw new Error('That invoice is no longer in the shipment.')
      ship.invoices = ship.invoices.filter(i => i !== found)
      await syncShipment(ship)
      return `Removed invoice <strong>${esc(found.invoice_no)}</strong>. Add it to another shipment by dropping the file in above.`
    })
  }

  function deleteShipment(id) {
    const s = shipList.find(x => x.id === id)
    if (!confirm(`Delete "${shipName(s || {})}", its invoices, counts and uploaded files? This can't be undone.`)) return
    return runOp('Deleting…', async () => {
      const ship = await getFullShipment(id)
      const paths = (ship.files || []).map(f => f.path).filter(Boolean)
      if (paths.length) await supabase.storage.from(BUCKET).remove(paths)
      const { error } = await supabase.from('shipments').delete().eq('id', id)
      if (error) throw new Error(error.message)
      if (lastShipmentId === id) { lastShipmentId = null; try { sessionStorage.removeItem('rx_last_shipment') } catch {} }
      return 'Shipment deleted.'
    })
  }

  // ============================================================
  // TAB 2: SHIPMENT EDIT
  // Add "our code" beside a supplier code, for this shipment only (freight, one-off codes, a code the
  // supplier used just for this order). The code is stored on the invoice line inside the shipment and
  // nowhere else: nothing is remembered for future invoices. It is only editable here.
  // ============================================================
  let editState = null   // {shipment, byPos}
  let editFilter = 'check'
  let editMsg = null     // {cls, html} shown once at the top
  let editBusy = false

  // A completed shipment can't be edited. If one is opened by a link, say where it is.
  function renderEditClosed(sh) {
    setTop(shipName(sh), 'Shipment Edit', '')
    content.innerHTML = `<a class="back-link" href="#/edit">← All shipments</a>
      <div class="notice ok">This shipment is completed, so it can't be edited. ${me.is_manager ? 'It is in <a href="#/completed">Completed Shipments</a>, where it can be reopened if it needs a change.' : ''}</div>`
  }
  async function showEdit(id) {
    rememberShipment(id)
    renderSidebar('edit')
    setTop('Loading…')
    content.innerHTML = `<div class="empty-state">Loading shipment…</div>`
    try {
      await loadEdit(id)
      if (editState.shipment.status === 'received') return renderEditClosed(editState.shipment)
      renderEdit()
      checkPoDrift()
    } catch (e) { setTop('Shipment Edit'); content.innerHTML = `<div class="notice err">${esc(friendlyDbError(e))}</div>` }
  }
  // When Shipment Edit opens with lines that aren't on a PO: has a PO named on the invoices gained lines in MYOB since this shipment was
  // matched, lines that would match them? If so, say so up front, with a button to reload that PO.
  async function checkPoDrift() {
    const st = editState
    if (!st || st.driftChecked) return
    st.driftChecked = true
    const needing = editRows().filter(needsCode)
    if (!needing.length) return
    try {
      const sh = st.shipment
      const pos = poNumbersOn(sh.invoices || [])
      if (!pos.length) return
      const fresh = await loadMyobPOs(pos)
      const held = new Set((sh.po_lines || []).map(l => String(l.line_id)).filter(Boolean))
      const added = fresh.filter(l => !held.has(String(l.line_id)))
      if (!added.length) return
      const index = new Map()
      for (const l of added) for (const k of new Set([normCode(l.stock_code), normCode(l.supplier_code)])) if (k) { if (!index.has(k)) index.set(k, []); index.get(k).push(l) }
      const byPo = new Map()
      for (const r of needing) {
        const keys = [r.ln.code, r.ln.our_code, ...(r.ln.alt_codes || [])].map(normCode).filter(Boolean)
        for (const po of new Set(keys.flatMap(k => (index.get(k) || []).map(l => l.po)))) { if (!byPo.has(po)) byPo.set(po, []); byPo.get(po).push(r.ln.code) }
      }
      if (!byPo.size || editState !== st) return
      st.drift = [...byPo].map(([po, codes]) => ({ po, codes: [...new Set(codes)] }))
      renderEdit()
    } catch { /* the notice is a help, not a requirement */ }
  }
  function driftHtml() {
    const d = editState.drift
    if (!d || !d.length) return ''
    return d.map(x => `<div class="notice warn" style="max-width:900px"><strong>PO ${esc(x.po)} has changed in MYOB since this shipment was matched.</strong> It now has ${x.codes.length === 1 ? 'a line' : 'lines'} for ${esc(x.codes.slice(0, 12).join(', '))}${x.codes.length > 12 ? ` and ${x.codes.length - 12} more` : ''} that this shipment doesn't hold yet.
      <button class="btn" type="button" data-addpo="${esc(x.po)}" style="margin-left:6px;padding:5px 10px;font-size:12px">Reload PO ${esc(x.po)} from MYOB</button></div>`).join('')
  }
  async function loadEdit(id) {
    let [sh, lines] = await Promise.all([getFullShipment(id), fetchLines(id), shipmentOptions()])
    // shipments saved before line positions were recorded: match once more so every line can be found
    if (lines.length && lines.some(l => !l.line_no)) {
      await syncShipment(sh);
      [sh, lines] = await Promise.all([getFullShipment(id), fetchLines(id)])
    }
    if (!shipOptionsCache.rows.some(r => r.id === id)) shipOptionsCache.rows.unshift(sh)
    const byPos = new Map()
    for (const l of lines) byPos.set(`${l.supplier}|${l.invoice_no}|${l.line_no}`, l)
    editState = { shipment: sh, byPos }
  }

  function editRows() {
    const { shipment: sh, byPos } = editState
    const out = []
    for (const inv of sh.invoices || []) {
      inv.lines.forEach((ln, idx) => { if (!ln.removed) out.push({ inv, ln, idx, db: byPos.get(`${inv.supplier}|${inv.invoice_no}|${idx + 1}`) || null }) })
    }
    return out
  }
  const needsCode = r => !!r.db && r.db.status === 'not_on_po' && !r.ln.manual_code
  // "to check" is the count on the shipment card: lines not on any PO plus lines for more than is on order
  const toCheck = r => !!r.db && (r.db.status === 'not_on_po' || r.db.status === 'over')
  const overText = r => ((r.db && r.db.flags) || []).find(f => /more than still on order/.test(f)) || 'More than is on order'
  const isManual = r => !!r.ln.manual_code
  // what changed on a line since the invoice was read (quantity, price, line total, part number), kept in the line's orig_* fields
  const qtyChanged = ln => ln.orig_qty !== undefined && +ln.orig_qty !== +ln.qty
  const priceChanged = ln => ln.orig_price !== undefined && (ln.orig_price ?? null) !== (ln.price ?? null)
  const totalChanged = ln => ln.orig_total !== undefined && (ln.orig_total ?? null) !== (ln.total ?? null)
  const isChanged = r => !!r.ln.added || qtyChanged(r.ln) || priceChanged(r.ln) || totalChanged(r.ln) || (!!r.ln.orig_code && r.ln.orig_code !== r.ln.code)
  // Shipment Edit shows each invoice A-Z by our part number (the MYOB code once matched, else the code typed in or printed), or in invoice order
  let editSort = 'az'
  const ourPartOf = r => (r.db && r.db.stock_code) || r.ln.our_code || ''
  const sortEditRows = rows => editSort === 'az' ? [...rows].sort((x, y) => compareOurCode(ourPartOf(x), ourPartOf(y), x.ln.code, y.ln.code) || x.idx - y.idx) : rows

  function renderEdit() {
    const { shipment: sh } = editState
    const rows = editRows()
    const nNeeds = rows.filter(needsCode).length, nManual = rows.filter(isManual).length, nChanged = rows.filter(isChanged).length, nCheck = rows.filter(toCheck).length
    const note = editMsg; editMsg = null
    setTop(shipName(sh), `Shipment Edit · ${plural((sh.invoices || []).length, 'invoice')}`,

       <a class="btn" href="#/count/${sh.id}">Shipment Count →</a>`)
    wirePicker('edit')
    if (editFilter === 'check' && !nCheck) editFilter = nNeeds ? 'needs' : nManual ? 'manual' : nChanged ? 'changed' : 'all'
    if (editFilter === 'needs' && !nNeeds) editFilter = nCheck ? 'check' : nManual ? 'manual' : nChanged ? 'changed' : 'all'
    const chip = (f, label, n, issue) => `<button class="chip ${issue && n ? 'issue' : ''}" data-f="${f}" aria-pressed="${editFilter === f}">${label}<b>${n}</b></button>`
    const groups = []
    for (const inv of sh.invoices || []) groups.push({ inv, rows: sortEditRows(rows.filter(r => r.inv === inv)) })
    content.innerHTML = `
      ${note ? `<div class="notice ${note.cls}" style="max-width:900px">${note.html}</div>` : ''}
      <p class="edit-intro">Fix up this shipment's invoice lines: type our code next to a supplier code (freight, one-off codes), change a part number or a quantity, or add a line that is missing. Everything here applies to <strong>this shipment only</strong>. It isn't remembered for future invoices, and it can only be changed here.</p>
      ${driftHtml()}
      ${nNeeds ? `<div class="notice warn" style="max-width:900px">
        <div>Lines match against the PO lines saved when the invoice was added: ${esc(poLoadedText(sh))}</div>
        <div style="margin-top:6px">If a part is on the PO in MYOB but still shows "Not on any loaded PO", the PO may have changed in MYOB since (a supplier part number added or corrected, or lines added). <button class="btn ghost" id="refreshPoBtn" type="button" style="margin-left:6px">Refresh PO from MYOB</button></div>
        <div style="margin-top:6px">Or the part may be on a different PO from the one named on the invoice (lines added to an order later are often on another PO). <button class="btn ghost" id="elsewhereBtn" type="button" style="margin-left:6px">Look for these parts on other POs</button></div>
        ${elsewhereHtml()}
      </div>` : ''}
      <div class="filters" role="group" aria-label="Show lines">
        ${chip('check', 'To check', nCheck, true)}
        ${chip('needs', 'Needs a code', nNeeds, true)}
        ${chip('manual', 'Entered manually', nManual, false)}
        ${chip('changed', 'Edited or added', nChanged, false)}
        ${chip('all', 'All lines', rows.length, false)}
        <label class="sort-pick">Order <select id="editSort"><option value="az" ${editSort === 'az' ? 'selected' : ''}>Our part number, A to Z</option><option value="invoice" ${editSort === 'invoice' ? 'selected' : ''}>Invoice order</option></select></label>
      </div>
      <div id="editBody">
        ${groups.length ? groups.map(editCardHtml).join('') : '<div class="empty-state">This shipment has no invoices yet. Add them in <a href="#/invoices">Invoice Creation</a>.</div>'}
        <div class="empty-state" id="editEmpty" hidden></div>
      </div>`
    $('editSort').onchange = ev => { editSort = ev.target.value; renderEdit() }
    content.querySelectorAll('.filters .chip').forEach(b => b.onclick = () => { editFilter = b.dataset.f; applyEditFilter(); content.querySelectorAll('.filters .chip').forEach(x => x.setAttribute('aria-pressed', x === b)) })
    const body = $('editBody')
    const rowOf = (key, idx) => editRows().find(x => invKey(x.inv) === key && x.idx === idx)
    body.addEventListener('change', async ev => {
      const inp = ev.target.closest('td.ourcode input'); if (!inp) return
      const tr = inp.closest('tr'), key = tr.dataset.inv, idx = +tr.dataset.idx
      const code = inp.value.trim()
      if (code && looksLikeFreight(code)) {
        // a freight line: ask for the amount first
        const r = rowOf(key, idx)
        if (r.ln.is_freight && r.ln.our_code === code) return
        const amount = await askFreightAmount({ code: r.ln.code, invoiceNo: r.inv.invoice_no, currency: r.inv.currency, suggested: r.ln.freight_amount ?? lineAmount(r.ln) })
        if (amount === null) { renderEdit(); return }
        return saveOurCode(key, idx, code, { amount })
      }
      saveOurCode(key, idx, code)
    })
    if ($('refreshPoBtn')) $('refreshPoBtn').onclick = editRefreshPo
    if ($('elsewhereBtn')) $('elsewhereBtn').onclick = findElsewhere
    content.querySelectorAll('[data-addpo]').forEach(b => b.onclick = () => addPoToShipment(b.dataset.addpo))
    // part number and quantity are edited in place; the line is saved when you leave the box
    body.addEventListener('change', ev => {
      const inp = ev.target.closest('td.partno input, td.qtycell input, td.pricecell input, td.totalcell input'); if (!inp) return
      const tr = inp.closest('tr'), key = tr.dataset.inv, idx = +tr.dataset.idx
      if (inp.closest('td.partno')) changePartNumber(key, idx, inp.value)
      else if (inp.closest('td.pricecell')) changePrice(key, idx, inp.value)

    body.addEventListener('click', async ev => {
      const b = ev.target.closest('[data-act]'); if (!b) return
      if (b.dataset.act === 'add-line') { ev.preventDefault(); return addInvoiceLine(b.dataset.key) }   // button sits in the card header
      if (['save-adjust', 'remove-adjust', 'adjust-diff'].includes(b.dataset.act)) {
        const row = b.closest('tr'), ikey = row.dataset.inv
        if (b.dataset.act === 'remove-adjust') return setAdjust(ikey, null)
        if (b.dataset.act === 'adjust-diff') { const amt = +b.dataset.amount; return setAdjust(ikey, { amount: amt, label: amt < 0 ? 'discount' : 'charges' }) }
        const kind = row.querySelector('[data-adj="kind"]').value, v = parseFloat(row.querySelector('[data-adj="amount"]').value)
        if (!Number.isFinite(v) || v <= 0) { alert('Enter the amount as a number greater than 0.'); return }
        return setAdjust(ikey, kind === 'discount' ? { amount: -v, label: 'discount' } : { amount: v, label: kind === 'freight' ? 'freight' : kind === 'tax' ? 'sales tax' : 'charges' })
      }
      const tr = b.closest('tr'), key = tr.dataset.inv, idx = +tr.dataset.idx
      if (b.dataset.act === 'reset-line') return resetLine(key, idx)
      if (b.dataset.act === 'remove-added') return removeAddedLine(key, idx)
      if (b.dataset.act === 'clear-code') return saveOurCode(key, idx, '')
      if (b.dataset.act === 'edit-freight') {
        const r = rowOf(key, idx)
        const amount = await askFreightAmount({ code: r.ln.code, invoiceNo: r.inv.invoice_no, currency: r.inv.currency, suggested: r.ln.freight_amount ?? lineAmount(r.ln) })
        if (amount !== null) saveOurCode(key, idx, r.ln.our_code, { amount })
      }
    })
    body.addEventListener('keydown', ev => {
      if (ev.key !== 'Enter' || !ev.target.closest('td.ourcode input, td.partno input, td.qtycell input, td.pricecell input, td.totalcell input')) return
      ev.preventDefault()
      const cls = ev.target.closest('td').className.split(' ')[0]
      const all = [...body.querySelectorAll(`tr:not([hidden]) td.${cls} input`)]
      const next = all[all.indexOf(ev.target) + 1]
      ev.target.blur(); if (next) setTimeout(() => { if (!document.querySelector('.modal-back')) next.focus() }, 400)
    })
    applyEditFilter()
  }

  function editCardHtml(g) {
    const inv = g.inv
    const cur = inv.currency || ''
    const meta = [inv.po ? `PO ${esc(inv.po)}` : '', inv.invoice_date ? esc(inv.invoice_date) : '', plural(inv.lines.filter(l => !l.removed).length, 'line')].filter(Boolean).join(' · ')
    return `<details class="inv-card" open data-key="${esc(invKey(inv))}">
      <summary><div><div class="inv-title">Invoice ${esc(inv.invoice_no)} · ${esc(inv.supplier)}</div><div class="inv-sub">${meta}</div></div>
        <button class="btn ghost add-line" type="button" data-act="add-line" data-key="${esc(invKey(inv))}">+ Add line</button></summary>
      <div class="table-wrap"><table class="grid">
        <thead><tr><th>Part number</th><th>Description</th><th class="num">Qty</th><th class="num">Inv price</th><th class="num">Line total</th><th>Matched to</th><th>Our code</th></tr></thead>
        <tbody>${g.rows.map(editRowHtml).join('')}</tbody>
        ${editTotalsHtml(inv, g.rows)}
      </table></div>
    </details>`
  }
  // Under each invoice: what its lines add up to now, the total printed on the invoice, and whether they agree.
  // Edits count (a changed quantity, an added or removed line), so this is a double check of the saved invoice.
  function editTotalsHtml(inv, rows) {
    const cur = inv.currency || ''
    const money = n => esc(`${cur ? cur + ' ' : ''}${(+n).toLocaleString('en-NZ', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`)
    const live = inv.lines.filter(l => !l.removed)
    const sum = Math.round(live.reduce((t, l) => t + (lineAmount(l) || 0), 0) * 100) / 100
    const unpriced = live.filter(l => lineAmount(l) == null).length
    const qtyTotal = live.reduce((t, l) => t + (+l.qty || 0), 0)
    const adj = inv.adjust && inv.adjust.amount ? inv.adjust : null
    const expected = Math.round((sum + (adj ? adj.amount : 0)) * 100) / 100
    const printed = inv.invoice_total
    const edited = inv.lines.some(l => l.removed || l.added || qtyChanged(l) || priceChanged(l) || totalChanged(l))
    let verdict
    if (printed === null || printed === undefined || printed === '') verdict = `<span class="tot-warn">No invoice total was read from this invoice, so the lines can't be checked against it.</span>`
    else {
      const diff = Math.round((expected - +printed) * 100) / 100
      verdict = Math.abs(diff) <= 0.015
        ? `<span class="tot-ok">&#10003; The line total is the same as the invoice total.</span>`
        : `<span class="tot-warn">&#10007; The line total is ${money(Math.abs(diff))} ${diff > 0 ? 'more' : 'less'} than the invoice total.</span>`
      if (Math.abs(diff) > 0.015 && edited) verdict += ` <span class="muted">(includes your edits. Reset the edited lines to see whether the invoice itself added up.)</span>`
    }
    return `<tfoot>
