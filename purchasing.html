<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cama - Purchasing</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2314265A'/%3E%3Ctext x='32' y='45' font-family='Arial,Helvetica,sans-serif' font-size='36' font-weight='800' fill='%23B5D334' text-anchor='middle'%3EP%3C/text%3E%3C/svg%3E">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
  :root {
    --navy: #21409A; --navy-dark: #14265A; --navy-darker: #0D1B40;
    --lime: #B5D334; --lime-dark: #93AC29; --lime-tint: rgba(181,211,52,0.16);
    --surface: #F4F6FA; --paper: #FFFFFF; --border: #DEE3EC; --ink: #1A2340; --slate: #5A6380; --slate-dim: #9099B0;
    --err: #B3261E; --err-tint: rgba(179,38,30,0.09); --ok: #1F7A45; --ok-tint: rgba(31,122,69,0.09);
    --warn: #B26A00; --warn-tint: rgba(178,106,0,0.10);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Verdana, sans-serif;
         background: var(--surface); color: var(--ink); font-size: 14px; line-height: 1.45; }
  a { color: var(--navy); text-decoration: none; } a:hover { text-decoration: underline; }
  button, input, select { font-family: inherit; font-size: inherit; }
  :focus-visible { outline: 2px solid var(--navy); outline-offset: 2px; }

  /* login */
  .login-screen { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; background: var(--navy-darker); padding: 24px; }
  .login-wordmark { font-size: 22px; font-weight: 800; letter-spacing: 0.16em; color: #fff; }
  .login-wordmark span { color: var(--lime); }
  .login-card { background: var(--paper); border-radius: 16px; padding: 36px 32px; width: 100%; max-width: 360px; display: flex; flex-direction: column; align-items: center; gap: 22px; }
  .prompt { font-size: 16px; color: var(--slate); }
  .display { font-size: 38px; font-weight: 700; letter-spacing: 0.08em; min-height: 50px; display: flex; align-items: center; justify-content: center; font-variant-numeric: tabular-nums; }
  .pin-dots { display: flex; gap: 14px; }
  .pin-dot { width: 15px; height: 15px; border-radius: 50%; border: 2px solid var(--border); }
  .pin-dot.filled { background: var(--navy); border-color: var(--navy); }
  .error-msg { color: var(--err); font-size: 14px; min-height: 18px; text-align: center; }
  .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; width: 100%; max-width: 300px; }
  .key { background: var(--surface); border: 1px solid var(--border); color: var(--ink); font-size: 24px; font-weight: 500; border-radius: 12px; aspect-ratio: 1.3 / 1; display: flex; align-items: center; justify-content: center; user-select: none; cursor: pointer; }
  .key:active { background: #EAEDF2; }
  .key.func.primary { background: var(--navy); border-color: var(--navy); color: #fff; font-size: 14px; font-weight: 700; }
  .key.func.plain { background: transparent; border-color: transparent; font-size: 14px; color: var(--slate); }
  .switch-user { background: none; border: none; color: var(--navy); font-size: 13px; padding: 8px; font-weight: 600; cursor: pointer; }

  /* shell */
  .topbar { background: var(--navy-dark); color: #fff; padding: 0 24px; min-height: 58px; display: flex; align-items: center; gap: 18px; position: sticky; top: 0; z-index: 20; }
  .brand { font-weight: 800; letter-spacing: 0.14em; font-size: 15px; }
  .brand span { color: var(--lime); }
  .topbar .grow { flex: 1; }
  .sync { font-size: 12px; color: rgba(255,255,255,0.75); }
  .sync.stale { color: #FFC56B; font-weight: 600; }
  .who { font-size: 13px; color: rgba(255,255,255,0.85); }
  .linkbtn { background: none; border: 1px solid rgba(255,255,255,0.3); color: #fff; border-radius: 8px; padding: 6px 10px; cursor: pointer; font-size: 12px; font-weight: 600; }
  .content { padding: 22px 24px 80px; max-width: 1500px; margin: 0 auto; }

  /* common */
  .btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--navy); background: var(--navy); color: #fff; font-size: 13px; font-weight: 600; padding: 8px 13px; border-radius: 8px; cursor: pointer; }
  .btn:hover { background: var(--navy-dark); }
  .btn.ghost { background: var(--paper); color: var(--navy); border-color: var(--border); }
  .btn.ghost:hover { border-color: var(--navy); }
  .btn.small { padding: 5px 9px; font-size: 12px; }
  .btn.on { background: var(--navy); color: #fff; border-color: var(--navy); }
  .btn:disabled { opacity: 0.5; cursor: default; }
  .panel { background: var(--paper); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; }
  .muted { color: var(--slate); } .dim { color: var(--slate-dim); }
  .notice { border-radius: 10px; padding: 11px 14px; margin-bottom: 14px; font-size: 13px; }
  .notice.err { background: var(--err-tint); color: var(--err); }
  .notice.warn { background: var(--warn-tint); color: var(--warn); }
  .notice.ok { background: var(--ok-tint); color: var(--ok); }
  .table-card { background: var(--paper); border: 1px solid var(--border); border-radius: 12px; overflow: auto; max-height: calc(100vh - 150px); }
  table.grid { width: 100%; border-collapse: collapse; }
  table.grid th { text-align: left; font-size: 11.5px; font-weight: 700; color: var(--slate); padding: 9px 9px; border-bottom: 1px solid var(--border); white-space: nowrap; position: sticky; top: 0; background: #F9FAFC; z-index: 2; }
  table.grid td { padding: 8px 9px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  table.grid .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  table.grid tr.click { cursor: pointer; } table.grid tr.click:hover td { background: #F5F7FC; }
  table.grid tr.group td { background: #EEF1F8; font-weight: 700; font-size: 12px; color: var(--navy-dark); position: sticky; top: 33px; z-index: 1; }
  .pill { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 700; white-space: nowrap; }
  .pill.red { background: var(--err-tint); color: var(--err); }
  .pill.amber { background: var(--warn-tint); color: var(--warn); }
  .pill.green { background: var(--ok-tint); color: var(--ok); }
  .pill.grey { background: #EDEFF4; color: var(--slate); }
  .tag { font-size: 11px; font-weight: 600; color: var(--warn); }
  h1 { font-size: 20px; margin: 0 0 4px; } h2 { font-size: 15px; margin: 0 0 10px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .card { background: var(--paper); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; }
  .card .big { font-size: 24px; font-weight: 700; }
  .card .lbl { font-size: 12px; color: var(--slate); }
  .toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--paper); }
  .seg button { border: none; background: none; padding: 7px 12px; cursor: pointer; font-size: 13px; color: var(--slate); font-weight: 600; }
  .seg button.on { background: var(--navy); color: #fff; }
  input.search { border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px; min-width: 240px; }

  /* supplier screen */
  .head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 14px; flex-wrap: wrap; }
  .settings { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px 18px; margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; font-weight: 700; color: var(--slate); margin-bottom: 5px; }
  .field .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .field input[type=number] { width: 90px; border: 1px solid var(--border); border-radius: 7px; padding: 6px 8px; }
  .field select { border: 1px solid var(--border); border-radius: 7px; padding: 6px 8px; background: #fff; }
  .field .hint { font-size: 11.5px; color: var(--slate-dim); margin-top: 4px; }
  .totals { position: sticky; top: 58px; z-index: 10; background: var(--navy-darker); color: #fff; border-radius: 10px; padding: 10px 16px; display: flex; gap: 22px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  .totals b { font-size: 17px; } .totals .grow { flex: 1; }
  .gauge { width: 160px; height: 8px; background: rgba(255,255,255,0.2); border-radius: 4px; overflow: hidden; }
  .gauge div { height: 100%; background: var(--lime); }
  td input.qty { width: 74px; text-align: right; border: 1px solid var(--border); border-radius: 6px; padding: 4px 6px; font-variant-numeric: tabular-nums; }
  td input.qty.locked { border-color: var(--navy); background: #EEF1FB; font-weight: 700; }
  .why { font-size: 12px; color: var(--slate); max-width: 260px; }
  .loading { padding: 40px; text-align: center; color: var(--slate); }
</style>
</head>
<body>

<div class="login-screen" id="loginScreen">
  <div class="login-wordmark">CAMA <span>PURCHASING</span></div>
  <div class="login-card" id="loginStage"></div>
</div>

<div id="appShell" style="display:none">
  <div class="topbar">
    <a class="brand" href="#/" style="color:#fff;text-decoration:none">CAMA <span>PURCHASING</span></a>
    <div class="grow"></div>
    <div class="sync" id="syncInfo"></div>
    <div class="who" id="whoInfo"></div>
    <button class="linkbtn" id="logoutBtn">Log out</button>
  </div>
  <div class="content" id="content"></div>
</div>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm'

  // Same Supabase project and logins as CAMA Receiving. The publishable key is safe in a web page:
  // everything is protected by staff logins and row level security (purchasing data = managers only).
  const SUPABASE_URL = 'https://ihvryjnepbnpfecbbkni.supabase.co'
  const SUPABASE_ANON_KEY = 'sb_publishable_qnPXnsbaxS8UFJQnGIe8Jg_7OVPtV7P'
  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

  const $ = id => document.getElementById(id)
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
  const loginStage = $('loginStage'), loginScreen = $('loginScreen'), appShell = $('appShell'), content = $('content')
  const num = (v, d = 0) => v == null || isNaN(v) ? '' : Number(v).toLocaleString('en-NZ', { minimumFractionDigits: d, maximumFractionDigits: d })
  const money = (v, cur) => v == null ? '' : `${cur ? cur + ' ' : ''}${Number(v).toLocaleString('en-NZ', { maximumFractionDigits: 0 })}`
  const DAY = 86400000
  const todayStr = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10) }
  const parseD = s => new Date(s + 'T00:00:00')
  const daysFromToday = s => s ? Math.round((parseD(s) - parseD(todayStr())) / DAY) : null
  const fmtD = s => s ? parseD(s).toLocaleDateString('en-NZ', { day: 'numeric', month: 'short', year: '2-digit' }) : ''
  const addDays = (s, n) => { const d = parseD(s); d.setDate(d.getDate() + n); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10) }
  const fmtWhen = iso => new Date(iso).toLocaleString('en-NZ', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })

  let me = { name: '', is_manager: false }
  let settings = { review_days: 30, service_z: 1.28 }

  // ============================================================ LOGIN (same staff number + PIN as Receiving)
  let staffno = '', pin = '', stepError = ''
  const fakeEmail = sno => `staff${sno}@camarep.internal`
  function renderStaffEntry() {
    loginStage.innerHTML = `<div class="prompt">Enter your staff number</div>
      <div class="display">${esc(staffno) || '&nbsp;'}</div><div class="error-msg">${esc(stepError)}</div>
      <div class="keypad" id="keypad"></div>`
    buildKeypad(onStaffKey, false)
  }
  function onStaffKey(k) {
    stepError = ''
    if (k === 'clear') staffno = ''
    else if (k === 'next') { if (!staffno) stepError = 'Enter your staff number'; else { pin = ''; return renderPinEntry() } }
    else if (staffno.length < 6) staffno += k
    renderStaffEntry()
  }
  function renderPinEntry(busy = false) {
    const dots = Array.from({ length: 6 }, (_, i) => `<div class="pin-dot ${i < pin.length ? 'filled' : ''}"></div>`).join('')
    loginStage.innerHTML = `<div class="prompt">Staff #${esc(staffno)} — enter PIN</div><div class="pin-dots">${dots}</div>
      <div class="error-msg">${busy ? 'Checking…' : esc(stepError)}</div><div class="keypad" id="keypad"></div>
      <button class="switch-user" id="switchUser">Not you? Switch staff number</button>`
    $('switchUser').onclick = () => { staffno = ''; pin = ''; stepError = ''; renderStaffEntry() }
    buildKeypad(onPinKey, true)
  }
  async function onPinKey(k) {
    stepError = ''
    if (k === 'clear') pin = ''
    else if (k === 'next') {
      if (pin.length < 6) { stepError = 'PIN must be 6 digits'; return renderPinEntry() }
      renderPinEntry(true)
      const { data, error } = await supabase.auth.signInWithPassword({ email: fakeEmail(staffno), password: pin })
      if (error) { stepError = 'Staff number or PIN not recognised. Try again.'; pin = ''; return renderPinEntry() }
      return enterApp(data.user)
    } else if (pin.length < 6) pin += k
    renderPinEntry()
  }
  function buildKeypad(onKey, isPin) {
    const keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', 'clear', '0', 'next']
    $('keypad').innerHTML = keys.map(k => k === 'clear' ? `<button class="key func plain" data-k="clear">Clear</button>`
      : k === 'next' ? `<button class="key func primary" data-k="next">${isPin ? 'Log in' : 'Next'}</button>`
      : `<button class="key" data-k="${k}">${k}</button>`).join('')
    $('keypad').querySelectorAll('.key').forEach(b => b.addEventListener('click', () => onKey(b.dataset.k)))
  }
  async function enterApp(user) {
    const { data: row } = await supabase.from('staff').select('staffno, name, is_manager').eq('auth_user_id', user.id).maybeSingle()
    const sno = parseInt(user.email.replace('staff', '').replace('@camarep.internal', ''), 10)
    me = { name: row?.name || `Staff #${sno}`, is_manager: !!row?.is_manager }
    loginScreen.style.display = 'none'; appShell.style.display = 'block'
    $('whoInfo').textContent = me.name
    if (!me.is_manager) {
      content.innerHTML = `<div class="notice err">Purchasing is for managers only. Ask for your staff login to be marked as a manager.</div>`
      return
    }
    await loadSettings()
    route()
  }
  $('logoutBtn').onclick = async () => {
    await supabase.auth.signOut(); staffno = ''; pin = ''
    appShell.style.display = 'none'; loginScreen.style.display = 'flex'; location.hash = ''; renderStaffEntry()
  }

  // ============================================================ DATA
  async function loadSettings() {
    const [{ data: s }, { data: sync }, { data: meta }] = await Promise.all([
      supabase.from('pur_settings').select('*').eq('id', 1).maybeSingle(),
      supabase.from('pur_sync').select('last_ok, message').eq('id', 1).maybeSingle(),
      supabase.from('pur_plan_meta').select('refreshed_at').eq('id', 1).maybeSingle()])
    if (s) settings = s
    const el = $('syncInfo')
    if (sync?.last_ok) {
      const ageMin = (Date.now() - new Date(sync.last_ok)) / 60000
      el.textContent = `MYOB data ${fmtWhen(sync.last_ok)}` + (meta?.refreshed_at ? ` · plan ${fmtWhen(meta.refreshed_at)}` : '')
      el.className = 'sync' + (ageMin > 120 ? ' stale' : '')
      if (ageMin > 120) el.textContent += ' — sync not running?'
    } else el.textContent = 'No MYOB sync yet'
  }
  async function fetchAll(q) {   // PostgREST returns at most 1000 rows per request
    const out = []
    for (let from = 0; ; from += 1000) {
      const { data, error } = await q().range(from, from + 999)
      if (error) throw error
      out.push(...data)
      if (data.length < 1000) return out
    }
  }

  // ============================================================ ROUTING
  window.addEventListener('hashchange', route)
  function route() {
    const m = location.hash.match(/^#\/supplier\/(\d+)/)
    if (m) return showSupplier(parseInt(m[1], 10))
    showSuppliers()
  }

  // ============================================================ SUPPLIER LIST (most urgent first)
  let listMode = 'attention', listSearch = '', suppliersCache = null
  async function showSuppliers() {
    content.innerHTML = `<div class="loading">Loading suppliers…</div>`
    try {
      const { data, error } = await supabase.from('pur_supplier_urgency').select('*')
      if (error) throw error
      suppliersCache = data
    } catch (e) {
      content.innerHTML = `<div class="notice err">Couldn't load suppliers: ${esc(e.message)}</div>`; return
    }
    drawSuppliers()
  }
  function urgency(s) {
    const d = daysFromToday(s.order_by)
    if (s.lines_order > 0 || (d != null && d <= 0)) return { cls: 'red', label: d != null && d < 0 ? `${-d} days overdue` : 'Order now', rank: 0 }
    if (d != null && d <= 14) return { cls: 'amber', label: `Order within ${d} days`, rank: 1 }
    if (s.lines_topup > 0 || s.lines_at_risk > 0) return { cls: 'amber', label: 'Coming up', rank: 2 }
    return { cls: 'green', label: 'OK', rank: 3 }
  }
  function drawSuppliers() {
    const all = suppliersCache.filter(s => s.items_selling > 0)
    let rows = all
    if (listMode === 'attention') rows = rows.filter(s => s.lines_order + s.lines_topup + s.lines_at_risk > 0)
    if (listSearch) rows = rows.filter(s => (s.name || '').toLowerCase().includes(listSearch.toLowerCase()) || String(s.accno) === listSearch)
    rows = rows.map(s => ({ ...s, u: urgency(s) })).sort((a, b) =>
      a.u.rank - b.u.rank || (a.order_by || '9999').localeCompare(b.order_by || '9999') || (b.monthly_value_at_risk || 0) - (a.monthly_value_at_risk || 0))
    const nowCount = all.filter(s => urgency(s).rank === 0).length
    const soonCount = all.filter(s => urgency(s).rank === 1).length
    const lines = all.reduce((t, s) => t + s.lines_order, 0)
    const noLead = all.filter(s => s.lead_default_used).length
    content.innerHTML = `
      <div class="cards">
        <div class="card"><div class="big" style="color:var(--err)">${nowCount}</div><div class="lbl">suppliers to order from now</div></div>
        <div class="card"><div class="big" style="color:var(--warn)">${soonCount}</div><div class="lbl">due in the next 2 weeks</div></div>
        <div class="card"><div class="big">${num(lines)}</div><div class="lbl">lines below their reorder point</div></div>
        <div class="card"><div class="big">${noLead}</div><div class="lbl">suppliers using a default lead time</div></div>
      </div>
      <div class="toolbar">
        <div class="seg"><button data-m="attention" class="${listMode === 'attention' ? 'on' : ''}">Needs attention</button><button data-m="all" class="${listMode === 'all' ? 'on' : ''}">All suppliers with sales</button></div>
        <input class="search" id="search" placeholder="Search supplier" value="${esc(listSearch)}">
        <span class="dim">${rows.length} shown · ranked by when the order has to be placed</span>
      </div>
      <div class="table-card"><table class="grid">
        <thead><tr><th>Supplier</th><th>Status</th><th>Order by</th><th class="num">Order now</th><th class="num">Top-ups</th>
          <th class="num">At risk</th><th class="num">Spiking</th><th class="num">Est. order</th><th class="num">Lead time</th></tr></thead>
        <tbody>${rows.map(s => `<tr class="click" data-acc="${s.accno}">
          <td><b>${esc(s.name)}</b> <span class="dim">#${s.accno}</span></td>
          <td><span class="pill ${s.u.cls}">${esc(s.u.label)}</span></td>
          <td>${s.order_by ? fmtD(s.order_by) : '<span class="dim">—</span>'}</td>
          <td class="num">${s.lines_order || ''}</td><td class="num">${s.lines_topup || ''}</td>
          <td class="num">${s.lines_at_risk ? `<span style="color:var(--err);font-weight:700">${s.lines_at_risk}</span>` : ''}</td>
          <td class="num">${s.lines_spiking || ''}</td>
          <td class="num">${s.value_with_topups ? money(s.value_with_topups, s.currency) : ''}</td>
          <td class="num">${leadLabel(s.lead_days_min, s.lead_days_max)}${s.lead_default_used ? ' <span class="tag">default</span>' : ''}${s.air_days ? `<div class="dim" style="font-size:11px">air ${s.air_days}d</div>` : ''}</td>
        </tr>`).join('') || `<tr><td colspan="9" class="muted" style="padding:30px;text-align:center">Nothing needs attention.</td></tr>`}</tbody>
      </table></div>`
    content.querySelectorAll('.seg button').forEach(b => b.onclick = () => { listMode = b.dataset.m; drawSuppliers() })
    const se = $('search'); se.oninput = () => { listSearch = se.value.trim(); drawSuppliers(); const n = $('search'); n.focus(); n.setSelectionRange(n.value.length, n.value.length) }
    content.querySelectorAll('tr.click').forEach(tr => tr.onclick = () => location.hash = `#/supplier/${tr.dataset.acc}`)
  }
  const leadLabel = (a, b) => a == null ? '' : (a === b ? `${a}d` : `${a}–${b}d`)

  // ============================================================ FORECAST MATHS (same as the database's)
  // fc[0] = expected units for the whole current month, fc[1] = next month, ...
  function demand(fc, from, days) {
    let total = 0, d = parseD(from), left = Math.max(0, Math.round(days)), i = 0
    while (left > 0) {
      const mEnd = new Date(d.getFullYear(), d.getMonth() + 1, 1), mLen = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate()
      const take = Math.min(left, Math.round((mEnd - d) / DAY))
      total += (fc[Math.min(i, fc.length - 1)] || 0) * take / mLen
      left -= take; d = mEnd; i++
    }
    return total
  }
  function daysCover(fc, from, stock) {
    if (stock <= 0) return 0
    let d = parseD(from), i = 0, days = 0, left = stock
    while (days < 730) {
      const mEnd = new Date(d.getFullYear(), d.getMonth() + 1, 1), mLen = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate()
      const span = Math.round((mEnd - d) / DAY), daily = (fc[Math.min(i, fc.length - 1)] || 0) / mLen
      if (daily > 0 && left <= daily * span) return Math.min(730, days + Math.floor(left / daily))
      left -= daily * span; days += span; d = mEnd; i++
    }
    return 730
  }

  // ============================================================ SUPPLIER ORDER SCREEN
  let S = null   // state for the open supplier
  async function showSupplier(accno) {
    content.innerHTML = `<div class="loading">Loading forecast…</div>`
    try {
      const [items, { data: sup }, { data: leads }] = await Promise.all([
        fetchAll(() => supabase.from('pur_plan').select('*').eq('supplier_accno', accno).order('stock_code')),
        supabase.from('pur_suppliers').select('*').eq('accno', accno).maybeSingle(),
        supabase.from('pur_supplier_settings').select('*').eq('accno', accno)])
      const mainLead = items.length ? mode(items.map(i => i.lead_days)) : (settings.default_lead_days || 90)
      S = {
        accno, sup: sup || { name: `Supplier #${accno}`, currency: '' }, leads: leads || [], items,
        lead: null, mainLead,
        coverDays: settings.review_days || 30, extraMonths: 0, z: Number(settings.service_z) || 1.28,
        adjust: 0, maxMonths: 12, target: 0, fill: false, show: 'topup', locked: {}, filled: {}, search: ''
      }
      items.forEach(it => {
        it.fc = (it.fc || []).map(Number)
        const z0 = Number(settings.service_z) || 1.28
        it.sigma = it.safety > 0 && it.lead_days > 0 ? it.safety / (z0 * Math.sqrt(it.lead_days / 30)) : 0
      })
    } catch (e) {
      content.innerHTML = `<div class="notice err">Couldn't load this supplier: ${esc(e.message)}</div>`; return
    }
    drawSupplier()
  }
  const mode = arr => { const c = {}; let best = arr[0], n = 0; arr.forEach(v => { c[v] = (c[v] || 0) + 1; if (c[v] > n) { n = c[v]; best = v } }); return best }

  function recalc() {
    const t = todayStr(), adj = 1 + (Number(S.adjust) || 0) / 100
    const after = S.coverDays + S.extraMonths * 30
    for (const it of S.items) {
      const fc = it.fc.map(x => x * adj)
      const L = S.lead ?? it.lead_days
      const level = Number(it.level) * adj
      const safety = S.z * it.sigma * Math.sqrt(L / 30)
      const pos = Number(it.position)
      const dts = daysCover(fc, t, pos - safety)
      const cover = daysCover(fc, t, pos)
      let status = (level <= 0 && pos >= 0) ? 'none' : dts - L <= 0 ? 'order' : dts - L <= after ? 'topup' : 'ok'
      const need = demand(fc, t, L + after) + safety - pos
      const moq = Math.max(1, Number(it.moq) || 1), pack = Math.max(1, Number(it.pack) || 1)
      let q = 0
      if (status === 'order' || status === 'topup') q = Math.max(moq, pack, Math.ceil(Math.max(need, 0) / pack) * pack)
      // cap: don't let one line end up with more than maxMonths of stock (unless the MOQ forces it)
      if (q > 0 && level > 0 && S.maxMonths > 0) {
        const cap = Math.floor((level * S.maxMonths - pos) / pack) * pack
        if (cap < q) q = Math.max(cap, moq, pack)
      }
      Object.assign(it, { _fc: fc, _L: L, _level: level, _safety: safety, _dts: dts, _cover: cover, _status: status, _sugg: q, _moq: moq, _pack: pack,
                          _orderBy: addDays(t, dts - L), _stockout: addDays(t, cover) })
    }
    // fill to a target order value: add packs to the lines with the least cover after ordering
    S.filled = {}
    if (S.fill && S.target > 0) {
      let total = S.items.reduce((s, it) => s + qtyOf(it) * cost(it), 0)
      const heap = []
      const monthsAfter = it => (Number(it.position) + qtyOf(it)) / it._level
      for (const it of S.items) if (it._level > 0 && !(it.stock_code in S.locked) && cost(it) > 0) heap.push(it)
      heap.sort((a, b) => monthsAfter(a) - monthsAfter(b))
      let guard = 0
      while (total < S.target && heap.length && guard++ < 50000) {
        const it = heap.shift()
        const cur = qtyOf(it), step = cur === 0 ? Math.max(it._moq, it._pack) : it._pack
        if (S.maxMonths > 0 && (Number(it.position) + cur + step) / it._level > S.maxMonths) continue   // full: drop it
        S.filled[it.stock_code] = (S.filled[it.stock_code] || 0) + step
        total += step * cost(it)
        const m = monthsAfter(it); let i = heap.findIndex(x => monthsAfter(x) > m); if (i < 0) i = heap.length
        heap.splice(i, 0, it)
      }
    }
  }
  const cost = it => Number(it.unit_cost) || 0
  const qtyOf = it => it.stock_code in S.locked ? S.locked[it.stock_code] : it._sugg + (S.filled[it.stock_code] || 0)

  function why(it) {
    const bits = []
    if (Number(it.position) < 0) bits.push('on back order')
    if (it._status === 'order') bits.push(`runs low ${fmtD(addDays(todayStr(), it._dts))}; ${it._L}d lead time`)
    else if (it._status === 'topup') bits.push(`would need ordering by ${fmtD(it._orderBy)}`)
    if (Number(it.spike_ratio) >= 2 && Number(it.sold_28d) >= 5) bits.push(`<b style="color:var(--err)">selling ${num(it.spike_ratio, 1)}× normal</b>`)
    if (Number(it.trend) >= 1.2) bits.push('growing')
    if (Number(it.trend) <= 0.8) bits.push('slowing')
    if (S.filled[it.stock_code]) bits.push(`+${S.filled[it.stock_code]} to fill`)
    if (it._moq > 1 && it._sugg === it._moq) bits.push(`MOQ ${it._moq}`)
    return bits.join(' · ')
  }

  function drawSupplier() {
    recalc()
    const s = S.sup, cur = s.currency || ''
    const sea = S.leads.filter(l => l.mode === 'sea' || l.mode === 'local')
    const air = S.leads.filter(l => l.mode === 'air'), other = S.leads.filter(l => l.mode === 'other')
    const chip = (l, label) => `<button class="btn ghost small ${S.lead === l.lead_days ? 'on' : ''}" data-lead="${l.lead_days}">${label} ${l.lead_days}d</button>`
    const showSel = { order: 'Order now', topup: '+ Top-ups', selling: 'Everything selling', all: 'All items' }
    content.innerHTML = `
      <div class="head">
        <div><a href="#/">← All suppliers</a><h1 style="margin-top:6px">${esc(s.name)} <span class="dim" style="font-size:14px">#${S.accno} · ${esc(cur)}</span></h1>
          <div class="muted">${num(S.items.length)} active items · ${num(S.items.filter(i => i.last12 > 0).length)} sold in the last 12 months</div></div>
        <div class="row" style="display:flex;gap:8px"><button class="btn ghost" id="exportBtn">Export order (CSV)</button></div>
      </div>
      <div class="panel">
        <h2>Order settings <span class="dim" style="font-weight:500;font-size:12px">— changes apply to this order only, unless you save them</span></h2>
        <div class="settings">
          <div class="field"><label>Lead time (days)</label>
            <div class="row"><input type="number" id="leadIn" min="0" value="${S.lead ?? S.mainLead}">
              ${sea.map(l => chip(l, l.category || (l.mode === 'local' ? 'Local' : 'Sea'))).join('')}${air.map(l => chip(l, 'Air')).join('')}${other.map(l => chip(l, 'Other')).join('')}</div>
            <div class="hint">${S.lead == null ? 'Using each line\'s normal lead time.' : `Using ${S.lead} days for every line.`} <a href="#" id="saveLead">Save as supplier default</a></div></div>
          <div class="field"><label>Order lasts after it arrives</label>
            <div class="row"><select id="coverSel">${[14, 30, 60, 90, 120, 180].map(d => `<option value="${d}" ${S.coverDays === d ? 'selected' : ''}>${d < 30 ? '2 weeks' : (d / 30) + ' month' + (d > 30 ? 's' : '')}</option>`).join('')}</select></div>
            <div class="hint">Time until the next order from this supplier.</div></div>
          <div class="field"><label>Extra stock</label>
            <div class="row">${[0, 1, 2, 3].map(m => `<button class="btn ghost small ${S.extraMonths === m ? 'on' : ''}" data-extra="${m}">${m ? '+' + m + ' mo' : 'None'}</button>`).join('')}</div>
            <div class="hint">e.g. while you're filling a container.</div></div>
          <div class="field"><label>Safety level</label>
            <div class="row">${[[0.84, 'Low'], [1.28, 'Normal'], [1.65, 'High']].map(([z, l]) => `<button class="btn ghost small ${Math.abs(S.z - z) < 0.01 ? 'on' : ''}" data-z="${z}">${l}</button>`).join('')}</div>
            <div class="hint">Bigger buffer for lines that sell unevenly.</div></div>
          <div class="field"><label>Demand adjustment</label>
            <div class="row"><input type="number" id="adjIn" step="5" value="${S.adjust}"> %</div>
            <div class="hint">For expected growth or a promotion.</div></div>
          <div class="field"><label>Max months of stock per line</label>
            <div class="row"><input type="number" id="maxIn" min="0" value="${S.maxMonths}"></div>
            <div class="hint">Stops slow lines being over-ordered. 0 = no limit.</div></div>
          <div class="field"><label>Fill to order value (${esc(cur)})</label>
            <div class="row"><input type="number" id="targetIn" min="0" step="1000" value="${S.target || ''}" placeholder="e.g. 20000">
              <button class="btn ${S.fill ? '' : 'ghost'} small" id="fillBtn">${S.fill ? 'Filled ✓' : 'Fill'}</button></div>
            <div class="hint">Adds packs to the lines that will run out soonest.</div></div>
        </div>
      </div>
      <div style="height:12px"></div>
      <div class="totals" id="totals"></div>
      <div class="toolbar">
        <div class="seg">${Object.entries(showSel).map(([k, l]) => `<button data-show="${k}" class="${S.show === k ? 'on' : ''}">${l}</button>`).join('')}</div>
        <input class="search" id="lineSearch" placeholder="Search code or description" value="${esc(S.search)}">
        <button class="btn ghost small" id="clearLocks">Clear my changes</button>
      </div>
      <div class="table-card" id="lines"></div>`

    content.querySelectorAll('[data-lead]').forEach(b => b.onclick = () => { const v = Number(b.dataset.lead); S.lead = S.lead === v ? null : v; drawSupplier() })
    $('leadIn').onchange = e => { const v = parseInt(e.target.value, 10); S.lead = isNaN(v) ? null : v; drawSupplier() }
    $('saveLead').onclick = async e => { e.preventDefault(); await saveLead() }
    $('coverSel').onchange = e => { S.coverDays = Number(e.target.value); drawSupplier() }
    content.querySelectorAll('[data-extra]').forEach(b => b.onclick = () => { S.extraMonths = Number(b.dataset.extra); drawSupplier() })
    content.querySelectorAll('[data-z]').forEach(b => b.onclick = () => { S.z = Number(b.dataset.z); drawSupplier() })
    $('adjIn').onchange = e => { S.adjust = Number(e.target.value) || 0; drawSupplier() }
    $('maxIn').onchange = e => { S.maxMonths = Math.max(0, Number(e.target.value) || 0); drawSupplier() }
    $('targetIn').onchange = e => { S.target = Number(e.target.value) || 0; if (S.fill) drawSupplier() }
    $('fillBtn').onclick = () => { S.target = Number($('targetIn').value) || 0; S.fill = !S.fill && S.target > 0; if (S.fill && S.show === 'order') S.show = 'selling'; drawSupplier() }
    content.querySelectorAll('[data-show]').forEach(b => b.onclick = () => { S.show = b.dataset.show; drawSupplier() })
    const ls = $('lineSearch'); ls.oninput = () => { S.search = ls.value.trim(); drawLines() }
    $('clearLocks').onclick = () => { S.locked = {}; drawSupplier() }
    $('exportBtn').onclick = exportCsv
    drawLines(); drawTotals()
  }

  function visibleItems() {
    const q = S.search.toLowerCase()
    return S.items.filter(it => {
      const qty = qtyOf(it)
      if (q && !(`${it.stock_code} ${it.description} ${it.supplier_code}`.toLowerCase().includes(q))) return false
      if (S.show === 'order') return it._status === 'order' || (qty > 0 && it.stock_code in S.locked)
      if (S.show === 'topup') return it._status === 'order' || it._status === 'topup' || qty > 0
      if (S.show === 'selling') return it._level > 0 || qty > 0
      return true
    })
  }
  function drawLines() {
    const groups = [['order', 'Order now — below reorder point'], ['topup', 'Top-ups — will need ordering before the next order could arrive'],
                    ['ok', 'Enough stock'], ['none', 'No sales in the last 12 months']]
    const vis = visibleItems()
    const LIMIT = 1500
    let shown = 0, html = ''
    for (const [g, label] of groups) {
      const rows = vis.filter(it => it._status === g).sort((a, b) => a._dts - b._dts || b._level - a._level)
      if (!rows.length) continue
      html += `<tr class="group"><td colspan="14">${label} (${rows.length})</td></tr>`
      for (const it of rows) {
        if (shown++ >= LIMIT) break
        const qty = qtyOf(it), locked = it.stock_code in S.locked
        const next3 = it._fc.slice(0, 3).reduce((a, b) => a + b, 0)
        const monthsNow = it._level > 0 ? Number(it.position) / it._level : null
        html += `<tr>
          <td><b>${esc(it.stock_code)}</b></td><td>${esc(it.description)}</td><td class="dim">${esc(it.supplier_code)}</td>
          <td class="num">${num(it.in_stock)}</td><td class="num">${num(it.on_order)}${it.next_po_due ? `<div class="dim" style="font-size:11px">due ${fmtD(it.next_po_due)}</div>` : ''}</td>
          <td class="num">${num(it.on_sales_order) || ''}</td><td class="num">${num(it.last12)}</td><td class="num">${num(next3)}</td>
          <td class="num">${monthsNow == null ? '' : num(monthsNow, 1)}</td>
          <td class="num">${it._status === 'none' ? '' : (it._orderBy <= todayStr() ? `<span style="color:var(--err);font-weight:700">${fmtD(it._orderBy)}</span>` : fmtD(it._orderBy))}</td>
          <td class="num dim">${it._moq > 1 ? 'MOQ ' + it._moq : ''}${it._pack > 1 ? ` /${it._pack}` : ''}</td>
          <td class="num"><input class="qty ${locked ? 'locked' : ''}" data-code="${esc(it.stock_code)}" type="number" min="0" step="${it._pack}" value="${qty || ''}" placeholder="0"></td>
          <td class="num">${qty ? money(qty * cost(it)) : ''}</td>
          <td class="why">${why(it)}</td></tr>`
      }
    }
    if (shown > LIMIT) html += `<tr><td colspan="14" class="muted" style="text-align:center;padding:14px">Showing the first ${LIMIT} lines. Search to find others.</td></tr>`
    $('lines').innerHTML = `<table class="grid"><thead><tr><th>Code</th><th>Description</th><th>Supp. code</th><th class="num">Stock</th><th class="num">On PO</th>
      <th class="num">On SO</th><th class="num">Sold 12m</th><th class="num">Next 3m</th><th class="num">Months cover</th><th class="num">Order by</th>
      <th class="num">MOQ/pack</th><th class="num">Order qty</th><th class="num">Value</th><th>Why</th></tr></thead>
      <tbody>${html || `<tr><td colspan="14" class="muted" style="text-align:center;padding:30px">No lines to show. Try "+ Top-ups" or "Everything selling".</td></tr>`}</tbody></table>`
    $('lines').querySelectorAll('input.qty').forEach(inp => inp.onchange = () => {
      const v = inp.value === '' ? 0 : Math.max(0, Math.round(Number(inp.value)))
      S.locked[inp.dataset.code] = v
      inp.classList.add('locked')
      if (S.fill) { drawSupplier(); return }
      const it = S.items.find(x => x.stock_code === inp.dataset.code)
      inp.closest('tr').children[12].textContent = v ? money(v * cost(it)) : ''
      drawTotals()
    })
  }
  function drawTotals() {
    const cur = S.sup.currency || ''
    const lines = S.items.filter(it => qtyOf(it) > 0)
    const units = lines.reduce((t, it) => t + qtyOf(it), 0), value = lines.reduce((t, it) => t + qtyOf(it) * cost(it), 0)
    const pct = S.target > 0 ? Math.min(100, value / S.target * 100) : null
    const runOut = S.items.filter(it => it._status === 'order' && qtyOf(it) === 0).length
    $('totals').innerHTML = `<div>Lines <b>${num(lines.length)}</b></div><div>Units <b>${num(units)}</b></div>
      <div>Order value <b>${money(value, cur)}</b></div>
      ${pct != null ? `<div>Target ${money(S.target, cur)} <div class="gauge"><div style="width:${pct}%"></div></div></div>` : ''}
      <div class="grow"></div>${runOut ? `<div style="color:#FFC56B;font-weight:600">${runOut} line${runOut > 1 ? 's' : ''} below reorder point set to 0</div>` : ''}`
  }
  async function saveLead() {
    const v = parseInt($('leadIn').value, 10)
    if (isNaN(v) || v < 0) return alertBox('Enter a lead time in days first.')
    const modeName = (S.sup.currency === 'NZD') ? 'local' : 'sea'
    const { error } = await supabase.from('pur_supplier_settings').upsert(
      { accno: S.accno, mode: modeName, category: '', lead_days: v, note: `Set on Purchasing screen by ${me.name}`, updated_at: new Date().toISOString() },
      { onConflict: 'accno,mode,category' })
    if (error) return alertBox('Not saved: ' + error.message)
    S.leads = S.leads.filter(l => !(l.mode === modeName && l.category === '')).concat([{ accno: S.accno, mode: modeName, category: '', lead_days: v }])
    alertBox(`Saved: ${S.sup.name} lead time is now ${v} days. The supplier list updates at the next sync (within 15 minutes).`, true)
  }
  function alertBox(msg, ok = false) {
    const d = document.createElement('div'); d.className = 'notice ' + (ok ? 'ok' : 'err'); d.textContent = msg
    content.prepend(d); setTimeout(() => d.remove(), 6000)
  }
  function exportCsv() {
    const rows = S.items.filter(it => qtyOf(it) > 0)
    if (!rows.length) return alertBox('There are no lines with an order quantity yet.')
    const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`
    const csv = ['StockCode,SupplierCode,Description,Qty,UnitCost,Value,Reason']
      .concat(rows.map(it => [it.stock_code, it.supplier_code, it.description, qtyOf(it), cost(it), (qtyOf(it) * cost(it)).toFixed(2),
        why(it).replace(/<[^>]+>/g, '')].map(q).join(','))).join('\r\n')
    const a = document.createElement('a')
    a.href = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv' }))
    a.download = `PO_${S.sup.name.replace(/[^\w]+/g, '_')}_${todayStr()}.csv`
    a.click()
  }

  // ============================================================ START
  const { data } = await supabase.auth.getSession()
  if (data.session) enterApp(data.session.user); else renderStaffEntry()
</script>
</body>
